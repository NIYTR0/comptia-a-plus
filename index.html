      },
      {
        "id": "opt_b",
        "text": "Wi-Fi",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Bluetooth",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Ethernet",
        "isCorrect": false
      }
    ],
    "explanation": "Bluetooth is commonly used in Personal Area Networks (PANs), connecting devices over a short range. Ethernet and fiber optic are more suited for LAN or WAN connections, while Wi-Fi is more common for wireless LANs, not PANs."
  },
  {
    "id": "net_types_04",
    "topic": "Network Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which device is responsible for forwarding traffic between networks?",
    "options": [
      {
        "id": "opt_a",
        "text": "Access point",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Router",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Network interface",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Switch",
        "isCorrect": false
      }
    ],
    "explanation": "Routers are used to connect multiple networks together. When sending data between networks, the router is responsible for forwarding the data to the proper network. Switches are used to connect multiple computers inside of a network together. Access points are used to connect wireless network hosts. The network interface (NIC) converts the digital data into a signal that can be transmitted along the transmission medium."
  },
  {
    "id": "net_types_05",
    "topic": "Network Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following is a characteristic of most private or enterprise WANs?",
    "options": [
      {
        "id": "opt_a",
        "text": "Utilizes Bluetooth for data transfer",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Consists solely of wireless connections",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Uses equipment leased from an ISP",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Only operates within a single building",
        "isCorrect": false
      }
    ],
    "explanation": "Most private or enterprise WANs use equipment and cabling leased from an ISP to connect LANs across multiple locations. WANs can operate over wide areas, unlike LANs, and do not rely solely on wireless or Bluetooth connections, as these are impractical for long distances."
  },
{
    "id": "network_hw_01",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following describes a benefit of using a patch panel?",
    "options": [
      {
        "id": "opt_a",
        "text": "It reduces the need for network cables.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "It eliminates the need for switches.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "It amplifies signals over long distances.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "It prevents wear and tear on switch ports.",
        "isCorrect": true
      }
    ],
    "explanation": "A patch panel prevents wear and tear on switch ports by serving as a static termination point for structured cabling. Short patch cables are used to connect the panel to the switch, making replacements easy without disturbing permanent cabling. Signal amplification is not a feature associated with patch panels. Switches are still required for network connectivity between connected devices. Patch panels do not reduce the number of cables needed; they simply organize them more effectively."
  },
  {
    "id": "network_hw_02",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "What function does an Ethernet switch perform when it receives a data frame?",
    "options": [
      {
        "id": "opt_a",
        "text": "It stores the frame until the destination device requests it.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "It discards the frame if the destination is not in its MAC address table.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "It decodes the frame and forwards it to the appropriate port based on the destination MAC address.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "It broadcasts the frame to all ports.",
        "isCorrect": false
      }
    ],
    "explanation": "An Ethernet switch decodes the frame to identify both the source and destination MAC addresses and then forwards the frame to the port that corresponds to the destination MAC address in its table. This process makes data delivery more efficient by only sending data to the intended recipient, unlike broadcasting, which sends data to all connected devices. Broadcasting frames to all ports is inefficient and is characteristic of network hubs, not switches. Ethernet switches forward frames in real-time as long as the destination MAC address is known. Discarding frames without an entry in the MAC address table is incorrect because switches will flood the frame to all ports except the source, learning new addresses as responses are received."
  },
  {
    "id": "network_hw_03",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "How do switches and bridges learn where devices are located on a network?",
    "options": [
      {
        "id": "opt_a",
        "text": "When a data packet enters a port, the destination MAC address is copied from the data packet header.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "When a data packet enters a port, the source MAC address is copied from the data packet header.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "When a data packet enters a port, the source IP address is copied from the data packet header.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "When a data packet enters a port, the destination IP address is copied from the data packet header.",
        "isCorrect": false
      }
    ],
    "explanation": "Bridges and switches learn addresses by copying the MAC address of the source device from the data packet header and placing it in the MAC address table. The port number the data packet entered is also recorded in the table and associated with the source MAC address.\nA switch and/or bridge cannot record the destination MAC address because they do not know the port that is used to reach the destination device.\nBridges and switches operate at Layer 2 and do not use IP addresses (which exist at Layer 3)."
  },
  {
    "id": "network_hw_04",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which IEEE PoE standard is most suitable for devices requiring around 25 W of power, such as advanced wireless access points and pan-tilt-zoom security cameras?",
    "options": [
      {
        "id": "opt_a",
        "text": "802.3af",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "802.3bt Type 4",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "802.3at",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "802.3bt Type 3",
        "isCorrect": false
      }
    ],
    "explanation": "802.3at (PoE+ or Type 2) provides up to 25 W of power, making it ideal for devices with higher energy demands like advanced wireless access points, pan-tilt-zoom security cameras, and video IP phones. 802.3af only supports up to 13 W, which is insufficient for these higher-power devices. 802.3bt Type 3 and Type 4 standards deliver even more power, up to 51 W and 73 W, respectively, and are intended for significantly larger power requirements, such as digital signage and LED lighting, which exceed the needs of devices covered under 802.3at."
  },
  {
    "id": "network_hw_05",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the purpose of a patch panel?",
    "options": [
      {
        "id": "opt_a",
        "text": "To allow wireless devices to access the network through cabling",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To provide a centralized point where wall port cables are connected to Ethernet switch ports",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "To serve as a power supply for connected devices",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "To directly connect computers to the Ethernet switch without additional components",
        "isCorrect": false
      }
    ],
    "explanation": "The patch panel serves as a centralized point where wall port cables are connected to Ethernet switch ports, allowing easy changes to network connections. Directly connecting computers to switches without a patch panel would limit flexibility in network management. Wireless devices do not require this cabling setup, as they connect via Wi-Fi. Patch panels do not supply power to devices (a PoE switch does); they organize and link network connections."
  },
  {
    "id": "network_hw_06",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "Why does an Ethernet switch eliminate the negative effects of collisions in a network?",
    "options": [
      {
        "id": "opt_a",
        "text": "It assigns a separate collision domain to each port.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "It reduces the number of devices connected to the network.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "It prevents devices from sending data at the same time.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "It limits the amount of data transmitted to avoid congestion.",
        "isCorrect": false
      }
    ],
    "explanation": "An Ethernet switch eliminates collisions by assigning a separate collision domain to each port, allowing devices to communicate independently. This configuration ensures that each device connected to the switch operates in full-duplex mode, enabling simultaneous sending and receiving of data at the network's full speed. Reducing the number of devices does not address collisions, as collisions occur based on how traffic is handled, not the number of connections. Preventing devices from sending data simultaneously is unnecessary because full-duplex communication inherently supports simultaneous transmissions. Limiting data to avoid congestion relates to traffic management, not collision prevention, which is handled by creating isolated collision domains per port."
  },
  {
    "id": "network_hw_07",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the purpose of a patch cord?",
    "options": [
      {
        "id": "opt_a",
        "text": "It links a port on the patch panel to a port on the Ethernet switch.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "It routes network traffic between different floors in a building.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "It terminates cables into insulation displacement connectors (IDCs).",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "It connects the computer directly to the Ethernet switch.",
        "isCorrect": false
      }
    ],
    "explanation": "A patch cord connects a port on the patch panel to a port on the Ethernet switch, completing the link from the wall port to the network. The computer connects to the wall port, not directly via the patch cord, to the ethernet switch. Terminating cables into IDCs is done at the back of the patch panel, not by the patch cord. While patch cords connect devices, they are not specifically used for routing network traffic between floors."
  },
  {
    "id": "network_hw_08",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "Why is it important to label ports on a patch panel?",
    "options": [
      {
        "id": "opt_a",
        "text": "To provide redundancy in case of failure",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To increase network speed",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To prevent data collisions",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "To reduce errors during troubleshooting",
        "isCorrect": true
      }
    ],
    "explanation": "Labeling ports reduces errors during troubleshooting by making it easy to identify and match connections between the patch panel and switch. Proper labeling also speeds up network changes and repairs. Increasing network speed depends on hardware specifications, not labeling. Providing redundancy involves backup devices or paths, not labeling. Data collisions are eliminated by switches, which provide separate collision domains, not by labeling."
  },
  {
    "id": "network_hw_09",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "What differentiates a managed switch from an unmanaged switch?",
    "options": [
      {
        "id": "opt_a",
        "text": "A managed switch can be configured with security settings and advanced features.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "A managed switch does not connect devices within a network.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "A managed switch operates only with a specific ISP's network.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "A managed switch has no physical ports for network connections.",
        "isCorrect": false
      }
    ],
    "explanation": "A managed switch can be configured with security settings and advanced features, offering greater control and functionality for larger networks. Unlike unmanaged switches, it provides options for network management and monitoring. Managed switches are not limited to specific ISPs and are specifically designed to connect devices within a network. They also come with physical ports for network connections, often in large quantities."
  },
  {
    "id": "network_hw_10",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the purpose of bonding multiple Ethernet NIC ports?",
    "options": [
      {
        "id": "opt_a",
        "text": "To create a higher-speed link by combining the speeds of multiple ports",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "To allow one port to function as a backup in case of a failure",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To improve signal quality for distant connections",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "To connect both copper and fiber connections simultaneously",
        "isCorrect": false
      }
    ],
    "explanation": "Bonding multiple Ethernet NIC ports enables a higher-speed link by combining the individual speeds of each port, effectively increasing the data transfer rate. Improved signal quality for long distances is achieved through cabling standards or signal boosters, not by bonding ports. Using one port as a backup would be achieved through redundancy settings, not bonding, and simultaneous copper and fiber connections requiring specific NICs with different port types rather than bonded ports."
  },
  {
    "id": "network_hw_11",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are using a patch panel to connect the computers in your building to the appropriate switches, and you need to connect the Ethernet wires from the building network port cables to the patch panel.\nWhere do you connect the wires on a patch panel?",
    "options": [
      {
        "id": "opt_a",
        "text": "You connect the outgoing wires to the front and the incoming wires to the back.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "You connect the wires to the backside of the panel.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "You connect the wires to the front side of the panel.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "You connect the incoming wires to the front and the outgoing wires to the back.",
        "isCorrect": false
      }
    ],
    "explanation": "All network ports in a building terminate at a patch panel. The Ethernet cables are punched down and terminate on the backside of the patch panel.\nThe front of the patch panel consists of RJ-45 ports. An Ethernet cable runs from the patch panel to the network switch to provide the connection between a device that is connected to the network port and the switch.\nThere are no specified incoming or outgoing wires on an Ethernet cable."
  },
  {
    "id": "network_hw_12",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "A technician determines that an older network hub that connects 24 workstations is performing poorly due to excessive network collisions.\nWhich of the following network devices would be the BEST replacement?",
    "options": [
      {
        "id": "opt_a",
        "text": "Switch",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Bridge",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Patch panel",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Router",
        "isCorrect": false
      }
    ],
    "explanation": "A switch maintains a table of MAC addresses by port and forwards network data packets to only the port that matches the MAC address. This significantly reduces collisions.\nA router manages IP traffic between networks.\nA bridge separates two network segments and forwards data packets from one segment to another.\nA patch panel organizes network cables and connects inbound and outbound cables."
  },
  {
    "id": "network_hw_13",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "Why might a company choose to use modular switches in its network?",
    "options": [
      {
        "id": "opt_a",
        "text": "To avoid using racks for network equipment",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To provide wireless connectivity to employees",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To limit the number of devices connected to the network",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "To interconnect multiple switch units through a fast backplane",
        "isCorrect": true
      }
    ],
    "explanation": "Modular switches allow companies to interconnect multiple switch units via a fast communications backplane, enabling the management of many access ports in a compact design. Modular switches are typically mounted in racks for efficient space use. They do not limit device connections but rather facilitate large networks. Additionally, they do not provide wireless connectivity; they are specifically for wired networks."
  },
  {
    "id": "network_hw_14",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "What component allows PoE functionality when a switch does not support PoE?",
    "options": [
      {
        "id": "opt_a",
        "text": "Ethernet splitter",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Endspan switch",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Power adapter",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "PoE injector",
        "isCorrect": true
      }
    ],
    "explanation": "A PoE injector (also known as a midspan device) enables PoE functionality when a switch does not natively support it. It connects between the switch and the powered device, injecting power into the Ethernet cable while preserving data connectivity. An endspan switch is a PoE-enabled switch that directly provides power without requiring additional hardware, which is different from using an injector. A power adapter provides local power to a device but does not integrate with Ethernet cabling. An Ethernet splitter splits network signals but does not provide power delivery, making it unsuitable for PoE functionality."
  },
  {
    "id": "network_hw_15",
    "topic": "Network Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "Currently, your company is in the process of upgrading security in the company headquarters building by installing biometric sensors to limit access to specific rooms.\nYour network switches are PoE-enabled, which allows biometric sensors to connect to switches without an external power source.\nWhich of the following PoE standards is designed for use with biometric sensors that require 25 watts?",
    "options": [
      {
        "id": "opt_a",
        "text": "802.11n",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "802.1X",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "802.3af (PoE)",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "802.3at (PoE+)",
        "isCorrect": true
      }
    ],
    "explanation": "802.3at PoE+ provides a maximum of 30 watts of power, which is designed for use with devices like biometric sensors and tablets.\n802.3af POE allows powered devices to draw up to about 13 W. This is not enough watts for the device.\n802.1X is a network access control/authentication standard, not a power‑delivery standard. It governs how devices authenticate to the network; it does not define how power is delivered over Ethernet.\n802.11n is a wireless networking standard (Wi‑Fi) and is unrelated to PoE."
  },
{
    "id": "netct_01",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network technician is connecting a computer to the network using Ethernet. How is the physical connection to the cable made?",
    "options": [
      {
        "id": "opt_a",
        "text": "Using the RJ45 port",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Using PoE",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Using the MAC address",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Using a patch panel",
        "isCorrect": false
      }
    ],
    "explanation": "The physical connection to an Ethernet cable is made via an RJ45 port, which is the standard port for Ethernet networking. An RJ45 connector on the Ethernet cable plugs directly into the RJ45 port on a computer or network device, allowing it to connect to the network. The MAC address is a unique identifier assigned to a network device, not a physical means of connection. It operates at the data link layer (Layer 2) and does not involve physically connecting the cable. A patch panel is a central point where network cables are organized and connected. However, it does not directly connect a computer to an Ethernet cable; instead, it helps manage multiple connections within a network setup. Power over Ethernet (PoE) allows Ethernet cables to transmit electrical power along with data, enabling devices like IP cameras or wireless access points to operate without separate power sources. It is not a method for physically connecting a computer to an Ethernet network."
  },
  {
    "id": "netct_02",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is a major benefit STP provides that UTP does not?",
    "options": [
      {
        "id": "opt_a",
        "text": "Greater resistance to interference",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Safer for installations in overhead ceiling spaces",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Ability to install longer cable lengths",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Lower cost",
        "isCorrect": false
      }
    ],
    "explanation": "Shielded twisted pair (STP) has a grounded outer copper shield around the bundle of twisted pairs or around each pair. This provides added protection against EMI. Unshielded twisted pair (UTP) does not have a grounded outer copper shield.\nSTP costs considerably more than UTP. Neither is safer for installations in overhead ceiling spaces unless they are made with plenum plastic shielding.\nSTP and UTP are equally effective at transmitting signals over the same distance."
  },
  {
    "id": "netct_03",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following BEST describes the purpose for which loopback plugs are used?",
    "options": [
      {
        "id": "opt_a",
        "text": "Grabbing and lifting small objects",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Removing broken pins within sockets",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Testing ports by returning output signals as input",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Connecting computers together without using network cards or modems",
        "isCorrect": false
      }
    ],
    "explanation": "Loopback plugs are used to test ports by returning output signals as input. Use a loopback plug to test the functionality of serial ports or networking ports.\nA 3-prong holder is a tweezer-like tool with three prongs for grabbing and lifting small objects.\nAn IC extractor is a tweezer-like tool (usually spring-loaded in the open position) that's used to remove integrated circuit chips.\nNull modem cables are used to connect computers using their serial ports without the need for a modem and phone line connection."
  },
  {
    "id": "netct_04",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the primary function of a network tap?",
    "options": [
      {
        "id": "opt_a",
        "text": "To replace network switches in small networks",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To amplify signals passing over a cable for longer transmission distances",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To intercept and copy signals passing over a cable for monitoring or analysis",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "To provide additional ports for connecting multiple network devices",
        "isCorrect": false
      }
    ],
    "explanation": "The main function of a network tap is to intercept and copy signals passing over a cable, enabling the captured data to be sent to a packet or protocol analyzer for monitoring or analysis. Amplifying signals for longer distances is not the purpose of a tap; this would involve repeaters or amplifiers. Network taps do not add additional connection ports for devices like a switch would, nor are they intended to replace switches in small networks."
  },
  {
    "id": "netct_05",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network technician used a tool that energizes each wire in a cable. When the technician sent energy to some of the wires, the LED on the tool did not light up. What tool was the technician using?",
    "options": [
      {
        "id": "opt_a",
        "text": "Tone generator",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Loopback plug",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Cable tester",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Toner probe",
        "isCorrect": false
      }
    ],
    "explanation": "A cable tester is a tool used to check the integrity and functionality of cables by sending a signal through each wire. If the LED on the tester does not light up for certain wires, it indicates a break or fault in those wires, meaning the cable is not transmitting signals properly. A toner probe is used in conjunction with a tone generator to trace cables through walls or ceilings. It does not test the functionality of each wire within a cable. A tone generator, used with a probe, helps locate cables by emitting a tone. It is not designed to test the individual wires in a cable for continuity or signal integrity. A loopback plug is used to test network ports and troubleshoot connectivity issues by reflecting signals back to the source. It is not used to check the integrity of each individual wire in a cable."
  },
  {
    "id": "netct_06",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are using a crimper to attach an RJ-45 connector to a Cat 6 UTP cable. You need to use the T568A standard to connect the individual wires to the connector. Which wire should you connect to pin 1?",
    "options": [
      {
        "id": "opt_a",
        "text": "Blue",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Orange with white",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Green",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Green with white",
        "isCorrect": true
      }
    ],
    "explanation": "According to the T568A standard, the green with white wire should be connected to pin 1 on an RJ-45 connector."
  },
  {
    "id": "netct_07",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network technician needs to deploy a computer on an Ethernet network and notices that the computer will sit on a shelf directly under a fluorescent light. What type of cable will the technician use?",
    "options": [
      {
        "id": "opt_a",
        "text": "Fiber optic",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "UTP",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Coax",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "STP",
        "isCorrect": true
      }
    ],
    "explanation": "Shielded Twisted Pair (STP) cable is the best choice for this situation because it includes shielding that protects against electromagnetic interference (EMI), which can be caused by fluorescent lighting. The shielding around the wires helps to prevent data transmission issues that could arise from the nearby light source. UTP lacks shielding, making it more susceptible to interference from nearby sources like fluorescent lights. This interference could lead to data loss or signal degradation, making UTP unsuitable in this environment. While coaxial cables are shielded and can resist some interference, they are not commonly used for standard Ethernet networks and are generally more suitable for television and broadband internet connections. Fiber optic cables are immune to electromagnetic interference; however, they are typically more expensive and may be unnecessary in this scenario where STP can provide sufficient protection. Fiber optic is generally reserved for long-distance or high-bandwidth applications."
  },
  {
    "id": "netct_08",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "A printer is behaving erratically; you suspect a faulty parallel port. Which tool can you use to test the parallel port?",
    "options": [
      {
        "id": "opt_a",
        "text": "Loopback plug",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Multimeter",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Cable tester",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Ammeter",
        "isCorrect": false
      }
    ],
    "explanation": "A loopback plug allows an output signal to be returned as input. Loopback plugs are used to test serial and parallel ports.\nA cable tester verifies that a network can carry a signal from one end to the other and that all wires within the connector are in their correct positions.\nA multimeter measures electrical properties, such as voltage, amps, and resistance.\nAn ammeter is an instrument that measures the flow of electric current in a circuit."
  },
  {
    "id": "netct_09",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "As a network engineer, you have been creating patch (straight-through) cables for a network switch. You have plugged in all the cables and are testing data transmission through the cables.\nYou notice that the data transmission is not functioning properly in some of the cables, and you are sure that one of the cables is interfering with the transmission at the near end.\nWhat is this type of interference called?",
    "options": [
      {
        "id": "opt_a",
        "text": "Cat 5 Ethernet interference",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Router interference",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Cross-talk interference",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Wi-Fi interference",
        "isCorrect": false
      }
    ],
    "explanation": "Cross-talk is an interference between two pairs in a cable. The cable transmitting the interfering signal interferes the greatest at the end where the interfering signal is transmitted from (called the near end) with other cables next to it. In this scenario, you probably did not keep the wire pairs twisted as much as possible up to the end of the cable connector, and you will need to fix the issue.\nCat 5 Ethernet is a type of network connector, not a type of network interference.\nYou are using a network switch, not a router, so there should be no interference from any router.\nWi-Fi interference can come from many sources, but you are using a wired (not a wireless) connection."
  },
  {
    "id": "netct_10",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network technician needs to replace a broken Ethernet cable. What connector will the technician use to terminate the new cable, also known as 8P8C?",
    "options": [
      {
        "id": "opt_a",
        "text": "RJ-45",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "LC",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "F-type",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "SC",
        "isCorrect": false
      }
    ],
    "explanation": "RJ-45 is the connector used to terminate Ethernet cables and is also known as an 8P8C (8-position, 8-contact) connector. This connector type is standard for Ethernet networking cables, enabling proper data transmission across devices on a network. F-type connectors are used for coaxial cables, primarily in television and cable internet connections, not for Ethernet cables. SC (Subscriber Connector or Standard Connector) is a type of fiber optic connector, not suitable for Ethernet cables, which use copper wiring. LC (Lucent Connector) is another type of fiber optic connector used for smaller form factor fiber optic cables, but it is also not appropriate for Ethernet cabling."
  },
  {
    "id": "netct_11",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "A technician is running a network above a dropped ceiling that is also used for ventilation. The cable must be a twisted pair and must be capable of Gigabit Ethernet speeds.\nWhich of the following cables should the technician use?",
    "options": [
      {
        "id": "opt_a",
        "text": "Riser-rated Cat 5e",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Plenum-rated Cat 6a",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Plenum-rated multimode fiber",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Riser-rated RG-58",
        "isCorrect": false
      }
    ],
    "explanation": "Plenum-rated Cat 6a cables can transfer data at 10 Gbps and can be placed in plenum spaces used for ventilation.\nRiser-rated RG-58 cables are coaxial and can transfer data at 10 Mbps. Plenum-rated cables can be used in riser applications, but riser-rated cables cannot be used in plenum applications.\nRiser-rated Cat 5e cables can transfer data at 1 Gbps, but they cannot be used in plenum applications.\nPlenum-rated multimode fiber can transfer data at 10 Gbps, but it is not a twisted pair."
  },
  {
    "id": "netct_12",
    "topic": "Network Cable Types",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "Which of the following are characteristics of a coaxial network cable? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "It has a conductor made from copper in the center.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "It uses two concentric metallic conductors.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "It is totally immune to electromagnetic interference (EMI).",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "It is made of plastic or glass in the center.",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "It has conductors that are twisted around each other to eliminate crosstalk.",
        "isCorrect": false
      }
    ],
    "explanation": "A coaxial cable is composed of a central copper conductor that is surrounded by an insulator, which is then surrounded by a second metallic mesh conductor. The name coaxial is derived from the fact that both of these conductors share a common axis.\nTwisted-pair cables are twisted around each other to reduce the effects of electromagnetic interference (EMI) and crosstalk.\nFiber optic cables have a plastic or glass center (known as the core). Only fiber optic cables are totally immune to electromagnetic interference (EMI) because light pulses, instead of electrical signals, represent the data."
  },
  {
    "id": "netct_13",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "What distinguishes single-mode fiber (SMF) from multi-mode fiber (MMF) in terms of usage?",
    "options": [
      {
        "id": "opt_a",
        "text": "SMF is better suited for long distances and high speeds, whereas MMF is ideal for shorter distances in LANs.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "SMF uses lower-cost LEDs, while MMF uses high-power lasers.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "SMF has a larger core than MMF, allowing for more light to pass through.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "SMF and MMF perform identically, with only minor cost differences.",
        "isCorrect": false
      }
    ],
    "explanation": "Single-mode fiber is designed for high-speed, long-distance transmission and is well-suited for WANs, while multi-mode fiber, with a larger core and LED-based technology, is cost-effective and ideal for shorter distances in LANs. Multi-mode does not use high-power lasers like SMF and is generally less capable of high-speed, long-distance transmission. SMF has a smaller core, focusing light more precisely, which improves distance and speed."
  },
  {
    "id": "netct_14",
    "topic": "Network Cable Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "Why can fiber optic cables support higher bandwidth and longer distances compared to copper cables?",
    "options": [
      {
        "id": "opt_a",
        "text": "Copper signals are stronger than light pulses, leading to shorter cable runs.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Fiber optic cables are less durable and, therefore, require longer cable runs.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Fiber optic cables are thicker, which reduces interference.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The light pulses in fiber optics are not susceptible to interference and experience less attenuation.",
        "isCorrect": true
      }
    ],
    "explanation": "Fiber optic cables use light pulses that are not affected by electrical interference and suffer less attenuation, allowing for higher bandwidth and longer distances. Fiber optic cables are not necessarily thicker, as core size varies with the type of fiber. Copper signals are more susceptible to interference, limiting the distance they can travel. Fiber optics are durable but fragile in certain conditions and do not require longer runs based on durability."
  },

{

  },
  {

  },
  {
    "id": "wnt_03",
    "topic": "Wireless Networking Types",

    "question": "What is the advantage of using the same SSID for both frequency bands on a dual-band access point?",
    "options": [

      },

        "isCorrect": true
      },

        "text": "It prevents interference from nearby networks.",
        "isCorrect": false

    ],
    "explanation": "Using the same SSID for both bands allows devices to automatically connect to the band with the strongest signal, improving connectivity and simplifying network selection for the user. Forcing devices to a specific band or requiring manual selection would limit flexibility. Using the same SSID does not inherently reduce interference from nearby networks, which is managed through channel configuration."
  },
  {
    "id": "wnt_04",
    "topic": "Wireless Networking Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network technician is upgrading the wireless network so that it can take advantage of \"multiple input multiple output\" (MIMO) to increase reliability and bandwidth. What standard is the technician upgrading the wireless network to?",
    "options": [
      {
        "id": "opt_a",
        "text": "802.11n",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "802.11b",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "802.11a",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "802.11g",
        "isCorrect": false
      }
    ],
    "explanation": "802.11n was the first Wi-Fi standard to introduce MIMO (Multiple Input Multiple Output) technology, which allows multiple antennas to transmit and receive data simultaneously. This increases the network's reliability, range, and bandwidth, making it suitable for environments that require enhanced performance.\n802.11g is an older standard that does not support MIMO. It operates at 2.4 GHz and offers lower speeds and ranges compared to 802.11n. 802.11b is one of the earliest Wi-Fi standards and does not support MIMO. It has a limited range and operates at slower speeds.\n802.11a operates at 5 GHz and offers higher speeds than 802.11b and 802.11g, but it does not support MIMO. It is primarily used for specific business applications requiring the 5 GHz band without MIMO capability."
  },
  {
    "id": "wnt_05",
    "topic": "Wireless Networking Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "An organization located on a large piece of rural property needs to connect its office building on the north side of the property with its warehouse and shipping operation on the south side of the property. The organization decides to connect the locations using long-range fixed wireless. What frequency spectrum must the organization use to ensure that nobody else can use the same frequency band?",
    "options": [
      {
        "id": "opt_a",
        "text": "Licensed",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "802.11ax",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Unlicensed",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "DFS",
        "isCorrect": false
      }
    ],
    "explanation": "A licensed frequency spectrum provides exclusive access to a specific frequency band, ensuring that no other entities can use the same frequency in the area. This is especially useful for long-range, fixed wireless connections in rural areas where dedicated, interference-free communication is essential for reliable operation between distant locations. Unlicensed frequencies, such as the 2.4 GHz and 5 GHz bands, are open for public use, meaning that other organizations or individuals could potentially operate on the same frequencies, leading to interference and unreliable communication. 802.11ax (Wi-Fi 6) is a Wi-Fi standard, not a frequency spectrum type. It typically operates in unlicensed bands and is designed for high-density, short- to medium-range wireless networks, not long-range fixed wireless connections. DFS is a mechanism that allows Wi-Fi devices to avoid interference with radar systems by automatically selecting channels within the 5 GHz band. However, it does not provide exclusive access to frequencies, so other users could still be present on the same frequencies."
  },
  {
    "id": "wnt_06",

  },

  {

  },

  {
    "id": "wnt_10",
    "topic": "Wireless Networking Types",
    "type": "single",

  {

  {
    "id": "wnt_14",
    "topic": "Wireless Networking Types",
    "type": "single",

    "question": "What does a high Signal-to-Noise Ratio (SNR) indicate in a wireless network?",

      {
        "id": "opt_b",
        "text": "Increased power output from the Wi-Fi device",

      },

    ],
    "explanation": "A high Signal-to-Noise Ratio (SNR) means the signal is significantly stronger than the background noise, leading to better network performance. Higher noise levels would result in a lower SNR, not a higher one. SNR does not reflect power output or directly relate to data speed but impacts the quality and reliability of the connection."
  },
  {
    "id": "wnt_15",
    "topic": "Wireless Networking Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network technician is upgrading a grocery store's checkout lines with contactless payment devices. What type of wireless technology are the payment devices based on?",
    "options": [
      {
        "id": "opt_a",
        "text": "RFID",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "802.11a",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Bluetooth",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "NFC",
        "isCorrect": true
      }
    ],
    "explanation": "NFC (Near Field Communication) is a wireless technology used in contactless payment systems. It enables secure, short-range communication between devices, such as payment terminals and contactless cards or smartphones, typically within a range of a few centimeters. 802.11a is a Wi-Fi standard used for wireless networking, not typically for secure, short-range communication required in contactless payments. Bluetooth is a wireless technology for short-range communication, but it is generally used for pairing devices over a slightly longer range than NFC and is not specifically optimized for secure contactless payments. While RFID (Radio Frequency Identification) is used for short-range identification and can sometimes be used in payment systems, NFC is specifically designed for secure, close proximity communication and is the primary technology in contactless payment systems."
  },
{
    "id": "clnh_01",
    "topic": "Comparing Local Networking Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the main characteristic of an unmanaged switch?",
    "options": [
      {
        "id": "opt_a",
        "text": "It requires extensive configuration to function.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "It includes advanced security features for corporate networks.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "It operates automatically without configuration.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "It typically has 64 or more ports for large networks.",
        "isCorrect": false
      }
    ],
    "explanation": "An unmanaged switch operates automatically without requiring configuration, making it ideal for small networks or home use. Extensive configuration is unnecessary for unmanaged switches, as they are designed for simple, plug-and-play functionality. Advanced security features are typical of managed switches for larger networks. Unmanaged switches often have fewer ports (4, 8, or 16 but can have more), but 64 ports are not a typical number of ports found on either a managed or unmanaged switch."
  },
  {
    "id": "clnh_02",
    "topic": "Comparing Local Networking Hardware",
    "type": "multiple",
    "requiredSelections": 3,
    "question": "There are strict requirements for signal strength to minimize interference in the unlicensed long-range fixed wireless spectrum. What are the main components of these requirements? (Select all that apply.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Transmit power",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Effective isotropic radiated power",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Antenna gain",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "IEEE 802.11",
        "isCorrect": false
      }
    ],
    "explanation": "Transmit power is the fundamental strength of the radio, measured in dBm (decibel-milliwatts). Regulatory requirements limit the power output to minimize the potential for conflicts. Antenna gain is the amount that a signal boosts by directionality—focusing the signal in a single direction rather than spreading it over a wide area. Effective isotropic radiated power (EIRP) is signal strength from a transmitter, measured as the sum of transmit power, antenna cable/connector loss, and antenna gain, expressed in dBm. The IEEE 802.11 standards define frequencies, not signal transmission power components."
  },
  {
    "id": "clnh_03",
    "topic": "Comparing Local Networking Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are an IT consultant tasked with providing internet connectivity for a rural farm that lacks access to traditional wired internet options like DSL, cable, or fiber. The farm requires internet access for managing IoT devices, monitoring weather data, and conducting occasional video calls. After assessing the available options, you decide to recommend a Wireless Internet Service Provider (WISP). Which of the following configurations would BEST meet the farm's needs while ensuring reliable connectivity?",
    "options": [
      {
        "id": "opt_a",
        "text": "Install a WISP antenna on the farm's roof to establish a line-of-sight connection to the nearest WISP tower.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Use a satellite internet connection instead, as it provides better speeds and reliability than WISP in rural areas.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Install a WISP antenna in the farm's basement to protect it from weather-related damage.",
        "isCorrect": false
      },
      {

        "text": "Use a mobile hotspot device with a 4G LTE connection instead of WISP, as it is more cost-effective and widely available.",
        "isCorrect": false

    ],
    "explanation": "WISPs rely on a line-of-sight connection between the customer's antenna and the WISP tower to provide reliable internet access. Installing the antenna on the roof ensures the best possible signal strength and minimizes obstructions like trees or buildings. Satellite internet typically has higher latency and weather disruptions compared to WISP. Basement installation would completely block the line-of-sight, and mobile hotspots are less reliable or scalable for heavy farm IoT demands."
  },

  {

  {

let questions = [];
let historyStack = [];
let historyIndex = -1;
let answeredMap = {}; 
let currentShuffledOptionsMap = {}; // Maps question ID -> shuffled array of option objects
let tempSelectionsMap = {};         // Keeps track of in-progress multi-select choices before final submission

function initApp() {
    loadBank();
    setupEventListeners();
    startNewDeck();
}

function loadBank() {
    questions = [...DEFAULT_QUESTIONS];
}

function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function startNewDeck() {
    historyStack = [];
    historyIndex = -1;
    answeredMap = {};
    tempSelectionsMap = {};
    currentShuffledOptionsMap = {};

    // Shuffle options independently for each question on new deck creation
    questions.forEach(q => {
        currentShuffledOptionsMap[q.id] = shuffleArray(q.options);
    });

    let unvisited = Array.from({length: questions.length}, (_, i) => i);
    let shuffledSequence = shuffleArray(unvisited);

    if (shuffledSequence.length > 0) {
        historyStack.push(shuffledSequence[0]);
        historyIndex = 0;
    }

    renderGrid();
    renderQuestion();
}

function renderGrid() {
    const gridContainer = document.getElementById('question-grid');
    const statusText = document.getElementById('grid-status-text');
    if (!gridContainer) return;

    gridContainer.innerHTML = '';
    const total = questions.length;
    const completed = Object.keys(answeredMap).length;

    if (statusText) {
        statusText.textContent = `${completed}/${total} Completed`;
    }

    const currentQIdx = historyStack[historyIndex];

    questions.forEach((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'grid-btn';
        btn.textContent = i + 1;

        if (i === currentQIdx) {
            btn.classList.add('active');
        }

        if (answeredMap.hasOwnProperty(i)) {
            if (answeredMap[i].isCorrect) {
                btn.classList.add('answered-correct');
            } else {
                btn.classList.add('answered-incorrect');
            }
        }

        btn.addEventListener('click', () => {
            if (historyStack[historyIndex] !== i) {
                historyStack = historyStack.slice(0, historyIndex + 1);
                historyStack.push(i);
                historyIndex++;
                renderQuestion(); 
            }
        });

        gridContainer.appendChild(btn);
    });
}

function renderQuestion() {
    if (historyIndex < 0 || historyIndex >= historyStack.length) return;
    const qIndex = historyStack[historyIndex];
    const q = questions[qIndex];

    document.getElementById('stats-badge').innerText = `Question ${historyIndex + 1} of ${questions.length}`;
    document.getElementById('topic-tag').innerText = q.topic || 'General';
    document.getElementById('question-text').innerText = q.question;

    const optionsList = document.getElementById('options-list');
    optionsList.innerHTML = '';

    const expPanel = document.getElementById('explanation-panel');
    const expContent = document.getElementById('explanation-content');
    expContent.innerText = q.explanation;

    const record = answeredMap[qIndex];

    if (record) {
        expPanel.classList.remove('hidden');
    } else {
        expPanel.classList.add('hidden');
    }

    // Retrieve shuffled options for this question
    const displayOptions = currentShuffledOptionsMap[q.id] || q.options;
    const prefixes = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
    const currentTemp = tempSelectionsMap[qIndex] || [];

    displayOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="prefix">${prefixes[idx]}</span> <span>${opt.text}</span>`;

        if (record) {
            // Question has been evaluated
            btn.disabled = true;

            if (opt.isCorrect) {
                btn.classList.add('correct');
            }

            if (record.selectedIds.includes(opt.id) && !opt.isCorrect) {
                btn.classList.add('incorrect');
            }
        } else {
            // Question is active
            const isSelectedInTemp = currentTemp.includes(opt.id);

            if (isSelectedInTemp) {
                btn.classList.add('selected-temp');
            }

            // Disable unselected options when selection limit is reached
            if (!isSelectedInTemp && currentTemp.length >= q.requiredSelections) {
                btn.disabled = true;
            } else {
                btn.addEventListener('click', () => handleOptionClick(qIndex, opt.id));
            }
        }

        optionsList.appendChild(btn);
    });

    document.getElementById('prev-btn').disabled = (historyIndex <= 0);
    renderGrid();
}

function handleOptionClick(qIndex, selectedOptionId) {
    const q = questions[qIndex];
    if (!q || answeredMap[qIndex]) return;

    if (q.type === 'single') {
        evaluateQuestion(qIndex, [selectedOptionId]);
    } else {
        // Multi-select logic
        let currentTemp = tempSelectionsMap[qIndex] ? [...tempSelectionsMap[qIndex]] : [];

        if (currentTemp.includes(selectedOptionId)) {
            // Deselect if clicked again
            currentTemp = currentTemp.filter(id => id !== selectedOptionId);
        } else {
            if (currentTemp.length < q.requiredSelections) {
                currentTemp.push(selectedOptionId);
            }
        }

        tempSelectionsMap[qIndex] = currentTemp;

        // Auto-evaluate when exact selection limit is reached
        if (currentTemp.length === q.requiredSelections) {
            evaluateQuestion(qIndex, currentTemp);
        } else {
            renderQuestion();
        }
    }
}

function evaluateQuestion(qIndex, selectedIds) {
    const q = questions[qIndex];
    if (!q) return;

    const correctIds = q.options.filter(o => o.isCorrect).map(o => o.id);

    // Compare selected IDs against true correct IDs
    const isCorrect = (
        selectedIds.length === correctIds.length &&
        selectedIds.every(id => correctIds.includes(id))
    );

    answeredMap[qIndex] = {
        selectedIds: selectedIds,
        isCorrect: isCorrect
    };

    renderQuestion();
}

function nextQuestion() {
    if (historyIndex < historyStack.length - 1) {
        historyIndex++;
    } else {
        const visitedSet = new Set(historyStack);
        const unvisited = [];
        for (let i = 0; i < questions.length; i++) {
            if (!visitedSet.has(i)) {
                unvisited.push(i);
            }
        }

        if (unvisited.length > 0) {
            const nextRandom = unvisited[Math.floor(Math.random() * unvisited.length)];
            historyStack.push(nextRandom);
            historyIndex++;
        } else {
            let nextRandom = Math.floor(Math.random() * questions.length);
            historyStack.push(nextRandom);
            historyIndex++;
        }
    }
    renderQuestion();
}

function prevQuestion() {
    if (historyIndex > 0) {
        historyIndex--;
        renderQuestion();
    }
}

function toggleExplanation() {
    const expPanel = document.getElementById('explanation-panel');
    expPanel.classList.toggle('hidden');
}

function resetToDefaults() {
    if (confirm('Reset your current test attempt and shuffle a new deck?')) {
        startNewDeck();
    }
}

function setupEventListeners() {
    document.getElementById('next-btn').addEventListener('click', nextQuestion);
    document.getElementById('prev-btn').addEventListener('click', prevQuestion);
    document.getElementById('toggle-exp-btn').addEventListener('click', toggleExplanation);

    document.addEventListener('keydown', (e) => {
        if (e.key >= '1' && e.key <= '7') {
            const idx = parseInt(e.key) - 1;
            const qIndex = historyStack[historyIndex];
            const q = questions[qIndex];
            if (q && !answeredMap[qIndex]) {
                const displayOptions = currentShuffledOptionsMap[q.id] || q.options;
                if (idx < displayOptions.length) {
                    const optId = displayOptions[idx].id;
                    const currentTemp = tempSelectionsMap[qIndex] || [];
                    
                    // Allow hotkey selection if option is clickable
                    if (currentTemp.includes(optId) || currentTemp.length < q.requiredSelections) {
                        handleOptionClick(qIndex, optId);
                    }
                }
            }
        } else if (e.key === ' ' || e.key === 'ArrowRight') {
            e.preventDefault();
            nextQuestion();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevQuestion();
        } else if (e.key.toLowerCase() === 'e') {
            toggleExplanation();
        }
    });
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
