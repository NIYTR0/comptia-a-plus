<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA A+ Master Practice Bank</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
            --border-color: #334155;
            --hover-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-blue);
        }

        .stats-badge {
            background-color: var(--bg-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-grid-container {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .grid-header {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
        }

        .question-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .grid-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .grid-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-main);
        }

        .grid-btn.active {
            background-color: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            font-weight: 700;
        }

        .grid-btn.answered-correct {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .grid-btn.answered-incorrect {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .topic-tag {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--text-main);
            font-weight: 500;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--hover-bg);
            border-color: var(--accent-blue);
        }

        .option-btn .prefix {
            font-weight: 700;
            color: var(--accent-blue);
            min-width: 20px;
        }

        .option-btn.selected-temp {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-blue);
        }

        .option-btn.correct {
            background-color: rgba(34, 197, 94, 0.15) !important;
            border-color: var(--accent-green) !important;
            color: #ffffff !important;
        }

        .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--accent-red) !important;
            color: #ffffff !important;
        }

        .option-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .explanation-panel {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-blue);
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .explanation-panel.hidden {
            display: none !important;
        }

        .explanation-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .explanation-content {
            font-size: 0.95rem;
            line-height: 1.65;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--hover-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: #2563eb;
            border-color: #3b82f6;
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #1d4ed8;
            border-color: #60a5fa;
            color: #ffffff;
        }

        .keyboard-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: -5px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>CompTIA A+ Master Bank</h1>
        <div class="stats-badge" id="stats-badge">Loading...</div>
        <div class="header-actions">
            <button id="resetBankBtn" onclick="resetToDefaults()" style="background:#dc2626; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:0.85rem; font-weight:600;">Reset Bank</button>
        </div>
    </header>

    <div class="nav-grid-container">
        <div class="grid-header">
            <span>Question Sequence Queue</span>
            <span id="grid-status-text">0/0 Completed</span>
        </div>
        <div class="question-grid" id="question-grid"></div>
    </div>

    <main class="card">
        <div class="card-header">
            <span class="topic-tag" id="topic-tag">General</span>
        </div>

        <div class="question-text" id="question-text">Loading question...</div>

        <div class="options-list" id="options-list"></div>

        <div class="explanation-panel hidden" id="explanation-panel">
            <div class="explanation-title">Official CompTIA Explanation & Distractor Analysis</div>
            <div class="explanation-content" id="explanation-content"></div>
        </div>

        <div class="controls">
            <button class="btn" id="prev-btn" disabled>&larr; Previous</button>
            <button class="btn" id="toggle-exp-btn">Toggle Explanation</button>
            <button class="btn btn-primary" id="next-btn">Next &rarr;</button>
        </div>
    </main>

    <div class="keyboard-hint">Shortcuts: [1-5] Select Option | [Space] Next Question | [&larr;] Previous | [E] Toggle Explanation</div>
</div>

<script>
const DEFAULT_QUESTIONS = [
  {
    "id": "bios_01",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer is not booting from a newly installed SSD, even though it is properly connected.\nUpon checking the system firmware settings, you find that the boot option sequence is set to prioritize the optical drive first, followed by a USB drive, and then the network.\nWhich of the following actions should you take to analyze and resolve the boot issue?",
    "options": [
      { "id": "opt_a", "text": "Enable Secure Boot in the UEFI setup to ensure the SSD is recognized as a trusted device.", "isCorrect": false },
      { "id": "opt_b", "text": "Update the system firmware to the latest version to ensure compatibility with the SSD.", "isCorrect": false },
      { "id": "opt_c", "text": "Change the boot option sequence to prioritize the SSD as the first boot device.", "isCorrect": true },
      { "id": "opt_d", "text": "Disconnect the optical drive and USB drive to force the system to boot from the SSD.", "isCorrect": false }
    ],
    "explanation": "Analyzing the boot option sequence reveals that the SSD is not prioritized, which is why the system is not booting from it. By changing the sequence to prioritize the SSD, you ensure that the system firmware searches the SSD first for a boot manager, resolving the issue.\n\nOption Analysis:\n- Change the boot option sequence to prioritize the SSD as the first boot device. (Correct): Prioritizing the SSD in the boot sequence ensures the system firmware searches the SSD first for a boot manager, resolving the issue.\n- Disconnect the optical drive and USB drive to force the system to boot from the SSD. (Incorrect): While disconnecting other boot devices might force the system to boot from the SSD, it is not an efficient or practical solution.\n- Enable Secure Boot in the UEFI setup to ensure the SSD is recognized as a trusted device. (Incorrect): Enabling Secure Boot is a security measure and does not influence boot device prioritization.\n- Update the system firmware to the latest version to ensure compatibility with the SSD. (Incorrect): Firmware updates are beneficial, but the boot sequence setting is the root cause here."
  },
  {
    "id": "net_01",
    "topic": "Networking Principles",
    "type": "multiple",
    "requiredSelections": 3,
    "question": "A network technician is configuring an enterprise Wi-Fi infrastructure. Which THREE of the following standard features/protocols operate primarily at the Data Link Layer (Layer 2) of the OSI model? (Select THREE)",
    "options": [
      { "id": "opt_a", "text": "MAC Address Filtering", "isCorrect": true },
      { "id": "opt_b", "text": "802.11 Wi-Fi Framing", "isCorrect": true },
      { "id": "opt_c", "text": "Address Resolution Protocol (ARP)", "isCorrect": true },
      { "id": "opt_d", "text": "Internet Protocol (IP) Routing", "isCorrect": false },
      { "id": "opt_e", "text": "Domain Name System (DNS) Resolution", "isCorrect": false }
    ],
    "explanation": "Layer 2 (Data Link Layer) manages physical addressing, hardware framing, and local device communication on the same LAN segment.\n\nOption Analysis:\n- MAC Address Filtering (Correct): Uses hardware MAC addresses assigned at Layer 2 to permit or deny access.\n- 802.11 Wi-Fi Framing (Correct): Encapsulates payload data into 802.11 Data Link frames for transmission across wireless media.\n- Address Resolution Protocol (ARP) (Correct): Maps Layer 3 IP addresses to Layer 2 MAC addresses, acting directly at the boundary of Layer 2.\n- IP Routing (Incorrect): IP routing operates strictly at Layer 3 (Network Layer).\n- DNS Resolution (Incorrect): DNS operates at Layer 7 (Application Layer)."
  }
];

let questions = [];
let historyStack = [];
let historyIndex = -1;
let answeredMap = {}; 
let currentShuffledOptionsMap = {}; // Maps question ID -> shuffled array of option objects
let tempSelectionsMap = {};         // Keeps track of in-progress multi-select choices before final submission

function initApp() {
    loadBank();
    setupEventListeners();
    startNewDeck();
}

function loadBank() {
    questions = [...DEFAULT_QUESTIONS];
}

function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function startNewDeck() {
    historyStack = [];
    historyIndex = -1;
    answeredMap = {};
    tempSelectionsMap = {};
    currentShuffledOptionsMap = {};

    // Shuffle options independently for each question on new deck creation
    questions.forEach(q => {
        currentShuffledOptionsMap[q.id] = shuffleArray(q.options);
    });

    let unvisited = Array.from({length: questions.length}, (_, i) => i);
    let shuffledSequence = shuffleArray(unvisited);

    if (shuffledSequence.length > 0) {
        historyStack.push(shuffledSequence[0]);
        historyIndex = 0;
    }

    renderGrid();
    renderQuestion();
}

function renderGrid() {
    const gridContainer = document.getElementById('question-grid');
    const statusText = document.getElementById('grid-status-text');
    if (!gridContainer) return;

    gridContainer.innerHTML = '';
    const total = questions.length;
    const completed = Object.keys(answeredMap).length;

    if (statusText) {
        statusText.textContent = `${completed}/${total} Completed`;
    }

    const currentQIdx = historyStack[historyIndex];

    questions.forEach((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'grid-btn';
        btn.textContent = i + 1;

        if (i === currentQIdx) {
            btn.classList.add('active');
        }

        if (answeredMap.hasOwnProperty(i)) {
            if (answeredMap[i].isCorrect) {
                btn.classList.add('answered-correct');
            } else {
                btn.classList.add('answered-incorrect');
            }
        }

        btn.addEventListener('click', () => {
            if (historyStack[historyIndex] !== i) {
                historyStack = historyStack.slice(0, historyIndex + 1);
                historyStack.push(i);
                historyIndex++;
                renderQuestion(); 
            }
        });

        gridContainer.appendChild(btn);
    });
}

function renderQuestion() {
    if (historyIndex < 0 || historyIndex >= historyStack.length) return;
    const qIndex = historyStack[historyIndex];
    const q = questions[qIndex];

    document.getElementById('stats-badge').innerText = `Question ${historyIndex + 1} of ${historyStack.length} (${questions.length} total)`;
    document.getElementById('topic-tag').innerText = q.topic || 'General';
    document.getElementById('question-text').innerText = q.question;

    const optionsList = document.getElementById('options-list');
    optionsList.innerHTML = '';

    const expPanel = document.getElementById('explanation-panel');
    const expContent = document.getElementById('explanation-content');
    expContent.innerText = q.explanation;

    const record = answeredMap[qIndex];

    if (record) {
        expPanel.classList.remove('hidden');
    } else {
        expPanel.classList.add('hidden');
    }

    // Retrieve shuffled options for this question
    const displayOptions = currentShuffledOptionsMap[q.id] || q.options;
    const prefixes = ['A', 'B', 'C', 'D', 'E', 'F'];
    const currentTemp = tempSelectionsMap[qIndex] || [];

    displayOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="prefix">${prefixes[idx]}</span> <span>${opt.text}</span>`;

        if (record) {
            // Question has been evaluated
            btn.disabled = true;

            if (opt.isCorrect) {
                btn.classList.add('correct');
            }

            if (record.selectedIds.includes(opt.id) && !opt.isCorrect) {
                btn.classList.add('incorrect');
            }
        } else {
            // Question is active
            const isSelectedInTemp = currentTemp.includes(opt.id);

            if (isSelectedInTemp) {
                btn.classList.add('selected-temp');
            }

            // Disable unselected options when selection limit is reached
            if (!isSelectedInTemp && currentTemp.length >= q.requiredSelections) {
                btn.disabled = true;
            } else {
                btn.addEventListener('click', () => handleOptionClick(qIndex, opt.id));
            }
        }

        optionsList.appendChild(btn);
    });

    document.getElementById('prev-btn').disabled = (historyIndex <= 0);
    renderGrid();
}

function handleOptionClick(qIndex, selectedOptionId) {
    const q = questions[qIndex];
    if (!q || answeredMap[qIndex]) return;

    if (q.type === 'single') {
        evaluateQuestion(qIndex, [selectedOptionId]);
    } else {
        // Multi-select logic
        let currentTemp = tempSelectionsMap[qIndex] ? [...tempSelectionsMap[qIndex]] : [];

        if (currentTemp.includes(selectedOptionId)) {
            // Deselect if clicked again
            currentTemp = currentTemp.filter(id => id !== selectedOptionId);
        } else {
            if (currentTemp.length < q.requiredSelections) {
                currentTemp.push(selectedOptionId);
            }
        }

        tempSelectionsMap[qIndex] = currentTemp;

        // Auto-evaluate when exact selection limit is reached
        if (currentTemp.length === q.requiredSelections) {
            evaluateQuestion(qIndex, currentTemp);
        } else {
            renderQuestion();
        }
    }
}

function evaluateQuestion(qIndex, selectedIds) {
    const q = questions[qIndex];
    if (!q) return;

    const correctIds = q.options.filter(o => o.isCorrect).map(o => o.id);

    // Compare selected IDs against true correct IDs
    const isCorrect = (
        selectedIds.length === correctIds.length &&
        selectedIds.every(id => correctIds.includes(id))
    );

    answeredMap[qIndex] = {
        selectedIds: selectedIds,
        isCorrect: isCorrect
    };

    renderQuestion();
}

function nextQuestion() {
    if (historyIndex < historyStack.length - 1) {
        historyIndex++;
    } else {
        const visitedSet = new Set(historyStack);
        const unvisited = [];
        for (let i = 0; i < questions.length; i++) {
            if (!visitedSet.has(i)) {
                unvisited.push(i);
            }
        }

        if (unvisited.length > 0) {
            const nextRandom = unvisited[Math.floor(Math.random() * unvisited.length)];
            historyStack.push(nextRandom);
            historyIndex++;
        } else {
            let nextRandom = Math.floor(Math.random() * questions.length);
            historyStack.push(nextRandom);
            historyIndex++;
        }
    }
    renderQuestion();
}

function prevQuestion() {
    if (historyIndex > 0) {
        historyIndex--;
        renderQuestion();
    }
}

function toggleExplanation() {
    const expPanel = document.getElementById('explanation-panel');
    expPanel.classList.toggle('hidden');
}

function resetToDefaults() {
    if (confirm('Reset your current test attempt and shuffle a new deck?')) {
        startNewDeck();
    }
}

function setupEventListeners() {
    document.getElementById('next-btn').addEventListener('click', nextQuestion);
    document.getElementById('prev-btn').addEventListener('click', prevQuestion);
    document.getElementById('toggle-exp-btn').addEventListener('click', toggleExplanation);

    document.addEventListener('keydown', (e) => {
        if (e.key >= '1' && e.key <= '5') {
            const idx = parseInt(e.key) - 1;
            const qIndex = historyStack[historyIndex];
            const q = questions[qIndex];
            if (q && !answeredMap[qIndex]) {
                const displayOptions = currentShuffledOptionsMap[q.id] || q.options;
                if (idx < displayOptions.length) {
                    const optId = displayOptions[idx].id;
                    const currentTemp = tempSelectionsMap[qIndex] || [];
                    
                    // Allow hotkey selection if option is clickable
                    if (currentTemp.includes(optId) || currentTemp.length < q.requiredSelections) {
                        handleOptionClick(qIndex, optId);
                    }
                }
            }
        } else if (e.key === ' ' || e.key === 'ArrowRight') {
            e.preventDefault();
            nextQuestion();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevQuestion();
        } else if (e.key.toLowerCase() === 'e') {
            toggleExplanation();
        }
    });
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
