        "isCorrect": false
      }
    ],
    "explanation": "The technician is implementing the trusted platform module (TPM), which, during the boot process, compares hashes of key system state data to ensure they have not been tampered with.\n\nA hardware security module (HSM) is a secure USB key or thumb drive used to store cryptographic material where a user must authenticate before they can access the keys stored on the module.\n\nEncryption products make data secure by scrambling it in such a way that only a user with the correct decryption key can subsequently read it.\n\nA boot password requires the user to authenticate before the operating system is loaded. There are usually at least two passwords, though some systems may allow for more."
  },
{
    "id": "power_disk_01",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer frequently crashes with a Blue Screen of Death (BSOD) displaying the error code \"0x00000024,\" which indicates an issue with the NTFS file system.\n\nAfter analyzing the situation, which of the following actions should you prioritize to determine the root cause of this error?",
    "options": [
      {
        "id": "opt_a",
        "text": "Update the graphics card driver to the latest version.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Disable all startup programs to see if the issue persists.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check the system's RAM for errors using a memory diagnostic tool.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Analyze the system's event logs to identify any disk-related errors or warnings.",
        "isCorrect": true
      }
    ],
    "explanation": "The \"0x00000024\" error is associated with the NTFS file system, which involves disk operations. Reviewing event logs for disk-related errors can help identify underlying issues with the file system or hard drive.\n\nWhile faulty RAM can cause system instability, the specific \"0x00000024\" error relates to the NTFS file system, not memory issues. Analyzing disk-related logs is more relevant.\n\nGraphics drivers are unlikely to be related to an NTFS file system error. The focus should be on disk-related diagnostics.\n\nWhile disabling startup programs can help identify software conflicts, it does not directly address the NTFS file system error. Disk analysis is more pertinent."
  },
  {
    "id": "power_disk_02",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have just installed an SSD drive in your older Windows workstation. However, after you start Windows, you do not see the SSD drive listed in Windows Explorer.\n\nWhat should you do FIRST?",

      {
        "id": "opt_c",

      },

  },

      }
    ],
    "explanation": "Analyzing the drive for file system corruption or logical errors is appropriate in this scenario. The \"Missing Operating System\" error can be caused by issues within the boot sector or file system, which may prevent the system from locating the operating system.\n\nWhile faulty RAM can cause various system issues, it is less likely to be the cause of a \"Missing Operating System\" error, which is more directly related to the boot sector or drive issues.\n\nAlthough changes in firmware settings can affect boot behavior, the issue described is more indicative of a problem with the drive's boot sector or file system, not the firmware settings.\n\nWhile faulty cables can cause detection issues, the drive is already detected in the UEFI/BIOS. The focus should be on analyzing the integrity of the drive's file system and boot sector."
  },
  {

    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "While running a graphics editing program on your Windows workstation, a screen suddenly pops up with an error message warning. You note the error message, but the only way to continue working is to reboot your system.\n\nWhat is this type of error screen called?",
    "options": [
      {
        "id": "opt_a",
        "text": "POST",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "HVAC",

      },
      {
        "id": "opt_c",
        "text": "BSoD",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "SPoD",
        "isCorrect": false
      }
    ],
    "explanation": "You are experiencing a Blue Screen of Death (BSoD). This is a proprietary crash screen officially known as a stop error or blue screen error. A BSoD happens when the Windows OS encounters a fatal system error.\n\nAn SPoD (Spinning Pinwheel of Death) is the macOS equivalent of a BSoD. In this case, you are running a Windows system, so an SPoD does not apply.\n\nPOST errors are encountered when booting your system (before running Windows) and do not apply in this scenario.\n\nHVAC stands for heating, ventilation, and air conditioning. This is the system that moves air between indoor and outdoor areas in a room. HVAC does not directly apply to computer systems."
  },
  {
    "id": "power_disk_05",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "Every time a user attempts to save a file, the computer shows an error that reads, \"Cannot read from the source disk.\" What kind of issue does this indicate?",
    "options": [
      {
        "id": "opt_a",
        "text": "RAID failure",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Drive issue",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Power issue",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "POST issue",
        "isCorrect": false
      }
    ],
    "explanation": "A \"cannot read from the source disk\" error indicates an issue with a fixed disk drive that is failing. Bad sectors typically cause this on a hard disk drive.\n\nPower-on self-test (POST) is a diagnostic program implemented in the system firmware that checks the hardware to ensure the components required to boot the PC are present and functioning correctly.\n\nA power issue might arise due to a fault in the power supply unit (PSU), incoming electricity supply, power cables/connectors, or fuses.\n\nIn a redundant array of independent disks (RAID), if one of the underlying devices fails, the volume will show up as \"degraded,\" but the data on the volume will still be accessible."
  },
  {
    "id": "power_disk_06",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "A technician is troubleshooting a failed redundant array of independent disks (RAID) configuration and is unable to access the RAID configuration utility. What does this indicate?",
    "options": [

      },

        "text": "Multiple disk failure",

      },
      {

    ],
    "explanation": "If the technician cannot access the RAID configuration utility, this indicates that the controller itself is likely to have failed. However, the data on the volume should be recoverable.\n\nMost desktop-level RAID solutions can tolerate the loss of only one disk, so the technician should replace it as soon as possible.\n\nIf the RAID failure affects the boot process, the technician can use the RAID configuration utility to verify its status.\n\nIf a volume is not available, either multiple disks (more than the tolerated number of disks) have failed, or the controller has failed."
  },
  {
    "id": "power_disk_07",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "When troubleshooting boot sector issues, which of the following steps is essential to ensure the system can successfully boot from the correct drive?",
    "options": [
      {
        "id": "opt_a",
        "text": "Inspect the power supply unit for any faults or issues.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Ensure that the system firmware is updated to the latest version.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check if the keyboard is connected properly to avoid boot errors.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Verify that the boot order in the UEFI/BIOS settings is correctly configured.",
        "isCorrect": true
      }
    ],
    "explanation": "Verifying that the boot order in the UEFI/BIOS settings is correctly configured is crucial when troubleshooting boot sector issues, as the boot order determines which drive the system attempts to boot from first. If the boot order is incorrect, the system may try to boot from a non-bootable device, leading to boot failures.\n\nWhile a disconnected or malfunctioning keyboard can cause certain boot issues, it is not directly related to boot sector problems. Boot sector issues are more concerned with the configuration and detection of bootable drives.\n\nUpdating the system firmware can resolve some hardware compatibility issues, but it is not a primary step in addressing boot sector issues. Boot sector troubleshooting focuses on drive configuration and boot order.\n\nWhile power supply issues can cause a computer not to start, they are not directly related to boot sector problems. Boot sector troubleshooting involves ensuring the correct drive is being accessed during the boot process."
  },
  {
    "id": "power_disk_08",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a technician tasked with resolving a boot issue on a client's computer. The system fails to boot and displays an error message indicating \"No Bootable Device Found.\"\n\nUpon inspection, you notice that the system has multiple drives installed.\n\nWhich of the following actions should you take first to resolve the boot sector issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Run a full diagnostic test on all installed drives to check for hardware failures.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Reinstall the operating system on the primary drive.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check the UEFI/BIOS settings to ensure the correct boot order is set.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Replace the data cables connecting the drives to the motherboard.",
        "isCorrect": false
      }
    ],
    "explanation": "Ensuring that the UEFI/BIOS is configured to boot from the correct drive can resolve the \"No Bootable Device Found\" error if the system is trying to boot from a non-bootable drive.\n\nReinstalling the operating system is a more drastic measure and should not be the first step. It is important to first verify that the system is attempting to boot from the correct drive before considering reinstallation.\n\nWhile faulty data cables can cause drive detection issues, the error message specifically indicates a boot order problem. Checking the boot order is a more direct and less invasive step to take first.\n\nRunning diagnostics is a good practice if a hardware failure is suspected, but in this scenario, the error message suggests a configuration issue rather than a hardware failure. Checking the boot order is a more efficient first step."
  },
  {
    "id": "power_disk_09",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "When booting your workstation, you hear a series of audible beeps, and the system locks up.\n\nWhat is the FIRST step you should take when troubleshooting this issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Replace the motherboard battery.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Check for dust buildup inside the case.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Disconnect nonessential peripherals and try to reboot.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Check the motherboard documentation for POST errors.",
        "isCorrect": true
      }
    ],
    "explanation": "Every time a workstation boots, it runs a Power-On Self-Test (POST) to make sure that all of the basic hardware in the system is present and functioning correctly. If a problem is identified during POST, an error is generated, which can be a series of beeps. You need to check the motherboard documentation to interpret what the series of beeps represents.\n\nIf the motherboard battery fails, the system clock can lose time, or the BIOS/UEFI settings may reset to their defaults. However, this would not cause the series of beeps you are hearing when the system boots.\n\nDust buildup can cause overheating and other symptoms. However, this is not related to the POST error beeps you are hearing when the system boots.\n\nDisconnecting nonessential peripherals and then rebooting is a troubleshooting step for resolving a Blue Screen of Death issue and is not related to POST error beeps."
  },
  {
    "id": "power_disk_10",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer is not booting and displays an error message stating, \"Boot device not found.\" You verify that the hard drive is properly connected and powered.\n\nUpon entering the BIOS/UEFI settings, you notice that the boot order is set to prioritize USB devices over the internal hard drive.\n\nWhat should you do to resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Update the BIOS/UEFI firmware to the latest version.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Change the boot order to prioritize the internal hard drive.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Format the hard drive and reinstall the operating system.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Disable USB ports in the BIOS/UEFI settings.",
        "isCorrect": false
      }
    ],
    "explanation": "By analyzing the BIOS/UEFI settings, you identified that the boot order was incorrect. Changing the boot order to prioritize the internal hard drive will allow the system to boot from the correct device.\n\nDisabling USB ports is not necessary and could prevent the use of USB devices needed for other functions. The issue is related to the boot order, not the functionality of USB ports.\n\nWhile updating firmware can resolve some issues, it is not relevant to the current problem of boot order configuration. The solution lies in adjusting the settings rather than updating them.\n\nFormatting the hard drive is an extreme measure and unnecessary in this scenario. The problem is with the boot order, not the operating system or hard drive integrity."
  },
  {
    "id": "power_disk_11",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following is a common symptom of a failing hard disk drive (HDD) that affects its reliability and performance?",
    "options": [
      {
        "id": "opt_a",
        "text": "The computer's power supply unit (PSU) fails to provide stable power to the motherboard.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "The computer fails to detect any bootable drives during the boot sequence.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "The computer displays a blue screen of death (BSOD) during startup.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The computer experiences frequent freezing and slow file access times.",
        "isCorrect": true
      }
    ],
    "explanation": "Frequent freezing and slow file access times are common symptoms of a failing hard disk drive. These issues indicate that the drive is struggling to read or write data efficiently, affecting its reliability and performance.\n\nWhile a BSOD can occur due to various hardware and software issues, it is not specifically indicative of a failing hard disk drive. BSODs can be caused by driver issues, memory problems, or other hardware failures.\n\nThe computer failing to detect any bootable drives during the boot sequence is more related to boot configuration problems, connection issues, or BIOS/UEFI settings rather than directly indicating a failing hard disk drive. It could also be due to a completely failed drive, but not necessarily related to reliability and performance.\n\nThe computer's power supply unit (PSU) failing to provide stable power to the motherboard is related to power supply problems and is not directly connected to the reliability and performance of a hard disk drive. A failing PSU can cause various system issues but does not specifically indicate a problem with the HDD."
  },
  {
    "id": "power_disk_12",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "When troubleshooting a computer that won't start due to a power issue, which of the following steps should you take first to determine if the problem is related to the power supply unit (PSU)?",
    "options": [
      {
        "id": "opt_a",
        "text": "Remove all nonessential devices and add them back one by one.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Replace the motherboard with a new one.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check if the LEDs on the front panel are lit and if you can hear the fans.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Update the system firmware to the latest version.",
        "isCorrect": false
      }
    ],
    "explanation": "Checking if the LEDs on the front panel are lit and if you can hear the fans helps determine if the PSU is supplying power to the system. If the LEDs and fans are operational, it indicates that the PSU is at least partially functioning, which helps narrow down the potential causes of the power issue.\n\nReplacing the motherboard is a more invasive and costly step that should only be considered after simpler diagnostics have been performed. It is not the first step in troubleshooting power issues.\n\nUpdating the system firmware is unrelated to diagnosing power issues. Firmware updates are typically used to resolve compatibility or performance issues, not to address basic power functionality.\n\nRemoving all nonessential devices and adding them back one by one is more relevant for diagnosing POST or boot issues rather than initial power issues. It helps identify faulty components but does not directly address whether the PSU is supplying power."
  },
  {
    "id": "power_disk_13",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are called to troubleshoot a desktop computer that suddenly turns off and does not power back on. Upon inspection, you notice that the LEDs on the front panel are not lit, and the fans are not spinning.\n\nWhat should be your next step to analyze and identify the potential cause of the power issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Remove the CPU and test it in another working system.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Immediately replace the power supply unit (PSU) with a new one.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check the UEFI/BIOS settings to ensure the power settings are configured correctly.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Test the wall socket by plugging in a known-good device, such as a lamp.",
        "isCorrect": true
      }
    ],
    "explanation": "Testing the wall socket helps determine if the issue is external to the computer, such as a faulty power outlet. This step is crucial to rule out external power supply issues before investigating internal components.\n\nReplacing the PSU without first verifying the power source is premature and may lead to unnecessary costs. It's important to confirm that the issue isn't with the external power supply before replacing internal components.\n\nIf the computer is not powering on at all, you cannot access the UEFI/BIOS settings. This step is irrelevant when the system shows no signs of receiving power.\n\nTesting the CPU in another system is a more advanced diagnostic step that should only be considered after simpler checks, such as verifying power supply and connections, have been performed. It is not directly related to initial power issues."
  },
  {
    "id": "power_disk_14",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "When troubleshooting boot issues, which of the following steps should you take if a fixed disk is not detected during the boot process?",
    "options": [
      {
        "id": "opt_a",
        "text": "Verify that the drive is powered and check for secure power connections.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Replace the motherboard immediately.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Reinstall the system firmware.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Check if the operating system is up to date.",
        "isCorrect": false
      }
    ],
    "explanation": "Ensuring that the drive is powered and that power connectors are secure is a crucial step in troubleshooting when a fixed disk is not detected. This addresses potential power issues that could prevent the drive from being recognized.\n\nChecking if the operating system is up to date is not relevant when a fixed disk is not detected during the boot process. The issue is more likely related to hardware connections or BIOS/UEFI settings rather than the operating system.\n\nReinstalling the system firmware is not a standard troubleshooting step for a fixed disk not being detected. This action is more drastic and typically unrelated to simple detection issues unless a firmware update has caused the problem.\n\nReplacing the motherboard is a significant step and should not be the first action taken when a fixed disk is not detected. This issue is often resolved by checking connections and settings rather than replacing major components."
  },
  {
    "id": "power_disk_15",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a technician tasked with diagnosing a desktop computer that has been reported to frequently freeze and experience slow file access times.\n\nUpon investigation, you notice that the hard disk drive (HDD) is making unusual clicking noises.\n\nWhat is the MOST appropriate action to take to address the drive's reliability and performance issues?",
    "options": [
      {
        "id": "opt_a",
        "text": "Run a full system antivirus scan to check for malware affecting the HDD.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Replace the HDD with a new one and restore data from the latest backup.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Update the computer's BIOS/UEFI settings to ensure proper drive configuration.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Defragment the HDD to improve data access speed and performance.",
        "isCorrect": false
      }
    ],
    "explanation": "The symptoms of frequent freezing, slow file access, and unusual clicking noises suggest that the HDD is failing. Replacing the HDD and restoring data from a backup is the most appropriate action to ensure data integrity and resolve the reliability and performance issues.\n\nWhile malware can affect system performance, the symptoms described (frequent freezing, slow file access, and clicking noises) are more indicative of a physical hardware issue with the HDD rather than a software problem like malware.\n\nDefragmenting the HDD can improve performance in some cases, but it is not suitable for addressing hardware failure symptoms such as clicking noises. Defragmentation does not resolve physical issues with the drive.\n\nWhile ensuring correct BIOS/UEFI settings is important, it does not address the physical symptoms of a failing HDD, such as clicking noises and performance degradation. The issue is likely hardware-related, requiring drive replacement."
  },
{
  "id": "sdi_01",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "A technician is troubleshooting an issue with a computer. Although the computer is on the network, the server will not authenticate the user. What kind of problem does this indicate?",
  "options": [
    {
      "id": "opt_a",
      "text": "Overheating",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Inaccurate date/time",
      "isCorrect": true
    },
    {
      "id": "opt_c",
      "text": "Cabling issues",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "Disk failure",
      "isCorrect": false
    }
  ],
  "explanation": "If the computer does not correctly synchronize the date and time with other computers on the network, security systems such as authentication will not work.\n\nA hard disk drive (HDD) is most likely to fail due to mechanical problems either in the first few months of operation or after a few years.\n\nThe technician not securely connecting the cables at both ends, the cable has become stretched or crimped, or an incorrect cable specification may all cause cabling issues.\n\nUnusual odors, such as a burning smell or smoke, will almost always indicate that something (probably the power supply) is overheating."
},
{
  "id": "sdi_02",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "Since it has no moving parts, a CPU will usually work properly for several years. Which of the following is a common factor that might cause a CPU to fail prematurely?",
  "options": [
    {
      "id": "opt_a",
      "text": "High CPU usage",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Magnetic field",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "Electrostatic discharge (ESD)",
      "isCorrect": true
    },
    {
      "id": "opt_d",
      "text": "Electromagnetic interference",
      "isCorrect": false
    },
    {
      "id": "opt_e",
      "text": "Unsupported memory modules",
      "isCorrect": false
    }
  ],
  "explanation": "Electrostatic discharge (ESD) is a sudden flow of electricity between two electrically charged objects caused by contact or a short circuit. ESD can damage sensitive electronic components, including CPUs, by creating a high-voltage surge that can destroy or degrade the delicate circuits within the processor. While CPUs are designed to last several years under normal operating conditions, they are highly sensitive to ESD during handling or installation. For example, if a technician does not use proper grounding techniques (such as wearing an anti-static wrist strap), static electricity from their body can discharge into the CPU, causing irreparable damage. This is why ESD is a common factor that might cause a CPU to fail prematurely.\n\nWhile unsupported memory modules can cause system instability or prevent the system from booting, they do not directly cause physical damage to the CPU. The CPU itself is not likely to fail prematurely due to incompatible memory; instead, the system may simply not function correctly.\n\nHigh CPU usage does not inherently cause a CPU to fail prematurely. Modern CPUs are designed to handle high workloads and include thermal protection mechanisms, such as throttling or shutting down, to prevent overheating. However, sustained high usage without adequate cooling could lead to overheating, which might indirectly damage the CPU over time, but this is not as immediate or common as ESD.\n\nMagnetic fields generally do not affect CPUs because they are not magnetic storage devices. CPUs are made of silicon and other non-magnetic materials, so they are not susceptible to damage from magnetic fields in the same way that hard drives or other magnetic storage devices might be.\n\nElectromagnetic interference (EMI) can cause temporary disruptions in electronic signals and may lead to performance issues or data corruption. However, it does not typically cause permanent physical damage to a CPU. EMI is more of a concern for communication devices or systems with sensitive signal processing."
},
{
  "id": "sdi_03",
  "topic": "System and Display Issues",
  "type": "multiple",
  "requiredSelections": 2,
  "question": "You have just finished upgrading your desktop system's CPU. After running for about 15 minutes, the system spontaneously shuts down.\n\nWhich steps should you take FIRST to begin troubleshooting the issue? (Select two.)",
  "options": [
    {
      "id": "opt_a",
      "text": "Replace the power supply.",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Make sure that you used thermal paste for the CPU.",
      "isCorrect": true
    },
    {
      "id": "opt_c",
      "text": "Remove any unnecessary components and run the system.",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "Check the power supply voltage switch.",
      "isCorrect": false
    },
    {
      "id": "opt_e",
      "text": "Check the CPU fan power.",
      "isCorrect": true
    }
  ],
  "explanation": "After upgrading a CPU, one of the most critical components for its proper functioning is the cooling system. If the CPU fan is not powered or functioning correctly, the processor can quickly overheat, leading to spontaneous shutdowns as a protective measure. Ensuring that the CPU fan's power cable is securely connected and that the fan is operational is a crucial first step in troubleshooting overheating issues. A non-functional fan can cause the CPU to reach unsafe temperatures within minutes, triggering the system to shut down to prevent damage.\n\nThermal paste is essential for effective heat transfer between the CPU and the heat sink. Without thermal paste, the heat generated by the CPU cannot be efficiently dissipated, leading to overheating and system shutdowns. Ensuring that thermal paste was applied correctly during the CPU installation is another critical step in diagnosing and resolving overheating issues. If the paste was not applied or was applied improperly, the CPU will not be adequately cooled, even if the fan is working.\n\nWhile a faulty power supply can cause system instability or shutdowns, it is not the most likely cause in this scenario. The issue described (shutdown after 15 minutes) strongly suggests an overheating problem rather than a power supply issue. Replacing the power supply should only be considered after ruling out more common causes like overheating.\n\nThe power supply voltage switch is used to set the input voltage (e.g., 110V or 220V) based on the region's electrical standards. If this switch were set incorrectly, the system would likely fail to power on at all or exhibit immediate instability. Since the system runs for 15 minutes before shutting down, this is not a likely cause of the issue.\n\nRemoving unnecessary components is a general troubleshooting step to isolate hardware issues. However, in this scenario, the problem is clearly related to the CPU upgrade, making this step unnecessary at this stage. The focus should be on diagnosing the CPU and its cooling system first."
},
{
  "id": "sdi_04",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "A technician is troubleshooting a projector that keeps randomly shutting down. What is the most likely cause?",
  "options": [
    {
      "id": "opt_a",
      "text": "Burned-out bulb",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Incorrect data source",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "Overheating",
      "isCorrect": true
    },
    {
      "id": "opt_d",
      "text": "Loose cable between the monitor and the display",
      "isCorrect": false
    }
  ],
  "explanation": "Overheating typically causes intermittent projector shutdown. Check that the projector's fan is working, that the vents are free from dust and obstructions, and that the ambient temperature is not too high.\n\nA completely failed bulb is known as a burned-out bulb. A technician might hear the bulb \"pop\" and observe scorch marks on the inside or a broken filament.\n\nIf the projector is on, but there is no image displayed, the technician should check the cable and connectors between the video card and monitor.\n\nThe technician may also need to adjust the image or select the appropriate data source or input channel if no image is displayed."
},
{
  "id": "sdi_05",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "You are an IT technician tasked with resolving a recurring issue where a user's computer frequently locks up and reboots unexpectedly.\n\nAfter confirming that software issues are not the cause, you suspect a hardware problem. The user reports that the issue often occurs after the computer has been running for a few hours.\n\nBased on this scenario, what is the MOST appropriate action to apply next?",
  "options": [
    {
      "id": "opt_a",
      "text": "Check the CPU fan and heat sink to ensure they are functioning properly and not causing overheating.",
      "isCorrect": true
    },
    {
      "id": "opt_b",
      "text": "Replace the computer's RAM modules with new ones to see if the problem resolves.",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "Run a full antivirus scan to double-check for any missed malware.",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "Update the computer's BIOS to the latest version available from the manufacturer.",
      "isCorrect": false
    }
  ],
  "explanation": "The problem occurring after the computer has been running for a while suggests a thermal issue. Checking the CPU fan and heat sink is a practical application for troubleshooting overheating, which can cause system lockups and reboots.\n\nReplacing RAM without first confirming it as the source of the problem is not an efficient application of troubleshooting skills. The scenario suggests a thermal issue rather than a memory problem.\n\nThe scenario states that software issues, including malware, have already been ruled out. Therefore, running another antivirus scan is not an appropriate application for troubleshooting in this context.\n\nUpdating the BIOS is not directly related to addressing the symptoms described in the scenario. The issue is more likely related to overheating, as indicated by the timing of the lockups and reboots."
},
{
  "id": "sdi_06",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "When diagnosing performance issues in a computer system, which of the following steps is crucial to ensure that overheating is not the cause of the problem?",
  "options": [
    {
      "id": "opt_a",
      "text": "Verify the compatibility of new components with the motherboard.",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Monitor temperature sensors and fan speeds.",
      "isCorrect": true
    },
    {
      "id": "opt_c",
      "text": "Use diagnostic tests to compare CPU performance against known baselines.",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "Rule out operating system and application issues.",
      "isCorrect": false
    }
  ],
  "explanation": "Monitoring temperature sensors and fan speeds is directly related to diagnosing overheating issues. High temperatures can cause components to throttle performance to prevent damage, making this step crucial in identifying overheating as a potential cause of performance problems.\n\nWhile verifying component compatibility is important for diagnosing performance issues, it specifically addresses misconfigurations that might occur after a new build or upgrade. It does not directly relate to checking for overheating.\n\nUsing diagnostic tests to compare CPU performance against known baselines is useful for verifying the problem and isolating performance issues to specific subsystems. However, it does not specifically address overheating, which requires monitoring temperature and cooling systems.\n\nRuling out software and configuration issues is important for diagnosing performance problems, but it does not specifically address overheating. This step focuses on ensuring that the problem is not software-related before assuming a hardware issue."
},
{
  "id": "sdi_07",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "A user reports that their computer is running sluggishly after a recent upgrade. As an IT specialist, you need to evaluate the situation to determine the most likely cause.\n\nWhich of the following actions would BEST help you assess whether the sluggish performance is due to a hardware bottleneck?",
  "options": [
    {
      "id": "opt_a",
      "text": "Check for overheating by monitoring temperature sensors and fan speeds.",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Rule out software and configuration issues by checking for faulty network login scripts.",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "Use diagnostic tests to compare the system's performance against known baselines.",
      "isCorrect": true
    },
    {
      "id": "opt_d",
      "text": "Verify the compatibility of the new components with the motherboard.",
      "isCorrect": false
    }
  ],
  "explanation": "Using diagnostic tests to compare the system's performance against known baselines directly evaluates the system's performance by comparing it to known baselines, helping to identify if a specific component is underperforming and causing a bottleneck. It provides a quantitative assessment of the system's capabilities.\n\nWhile checking for overheating is important, it primarily addresses thermal issues rather than directly evaluating whether a hardware bottleneck is causing sluggish performance. Overheating can lead to throttling but it does not specifically identify a bottleneck.\n\nEnsuring compatibility is crucial to prevent misconfigurations, but it does not directly evaluate the system's current performance against expected standards. Compatibility checks are more preventive than evaluative in nature.\n\nWhile ruling out software issues is necessary, this step focuses on eliminating non-hardware causes of sluggishness. It does not evaluate the hardware's performance or identify bottlenecks within the system's components."
},
{
  "id": "sdi_08",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "A customer complains that a recently purchased monitor no longer displays a picture. You verify that the monitor is powered on and that the video cable is securely fastened to the video port.\n\nWhich of the following actions is the BEST to take next?",
  "options": [
    {
      "id": "opt_a",
      "text": "Check the brightness and contrast settings using the monitor's controls.",
      "isCorrect": true
    },
    {
      "id": "opt_b",
      "text": "Return the monitor to the manufacturer.",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "Unload and then reload the video card's software driver.",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "Open the computer and switch the video card to a different slot.",
      "isCorrect": false
    }
  ],
  "explanation": "When troubleshooting a monitor that no longer displays a picture, it is important to start with the simplest and most accessible solutions before moving on to more complex or invasive steps. In this case, checking the brightness and contrast settings using the monitor's on-screen controls is the best next step. Sometimes, the brightness or contrast may have been accidentally adjusted to a level where the screen appears blank or too dim to see. This is a common and easily overlooked issue that can be resolved quickly without requiring any hardware changes or software adjustments. Additionally, the monitor's controls can also help verify if the monitor is functioning properly by allowing you to navigate its on-screen display (OSD) menu.\n\nReturning the monitor to the manufacturer should only be considered as a last resort after all troubleshooting steps have been exhausted. Since the issue could be something as simple as incorrect brightness or contrast settings, returning the monitor at this stage would be premature and unnecessary.\n\nOpening the computer and switching the video card to a different slot is a more advanced troubleshooting step that is not appropriate at this stage. The issue may not even be related to the video card, and such an action could introduce additional variables or risks (e.g., damaging components). It is better to rule out simpler causes, such as monitor settings, before attempting hardware changes.\n\nReloading the video card's driver is a software troubleshooting step that is more relevant if the issue is determined to be related to the video card or its driver. However, since the monitor itself is not displaying a picture, it is more logical to first verify the monitor's settings and functionality before addressing potential software issues."
},
{
  "id": "sdi_09",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "The contrast on your projector's output is not displaying properly. In addition, the images continually flicker.\n\nWhat is the MOST likely cause of the projector's display problems?",
  "options": [
    {
      "id": "opt_a",
      "text": "The high-definition files are not in sync with the audio files.",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "An outdated projector driver is in operation.",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "The wrong cable is connected to the HDMI port.",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "A bulb is close to burning out.",
      "isCorrect": true
    }
  ],
  "explanation": "A bulb on the verge of burning out can cause a projector's screen contrast to display incorrectly and induce flickering.\n\nAn incorrect cable would not be the source of contrast and flickering problems.\n\nAn outdated projector driver could cause the projector to not display anything at all. However, it would not cause contrast or flickering problems.\n\nHigh-definition files that are not in sync with audio files would not cause contrast or flickering problems."
},
{
  "id": "sdi_10",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "You have just purchased 10 new notebook computers for your users. You are concerned that users will leave the notebooks on for long periods of time, which could result in display burn-in.\n\nWhat should you do to prevent this from happening?",
  "options": [
    {
      "id": "opt_a",
      "text": "Install a software utility on each computer that is designed to fix stuck pixels.",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Configure each computer to automatically power off after five minutes of inactivity.",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "Configure a screen saver on each computer.",
      "isCorrect": true
    },
    {
      "id": "opt_d",
      "text": "Increase the hardware acceleration setting on each computer.",
      "isCorrect": false
    }
  ],
  "explanation": "Burn-in can happen when the same image is displayed on the screen for an extended period of time. The best way to prevent this from happening is to configure a screen saver on each computer.\n\nConfiguring the computers to automatically power off after five minutes of inactivity can prevent burn-in, but this will also make the notebooks very inconvenient to use.\n\nIncreasing hardware acceleration settings will not prevent burn-in from occurring.\n\nInstalling a software utility on each system that is designed to fix stuck pixels is a solution for repairing a burnt-in display, but this will not prevent burn-in from happening in the first place."
},
{
  "id": "sdi_11",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "A company employee reports that their computer, which was recently upgraded with additional RAM and a new SSD, is still experiencing sluggish performance. As an IT analyst, you need to determine the underlying cause of the issue.\n\nWhich of the following analyses would BEST help you identify the root cause of the sluggish performance?",
  "options": [
    {
      "id": "opt_a",
      "text": "Analyze the network traffic to determine if bandwidth limitations are affecting the computer's performance.",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Analyze the software applications running on the system to identify any resource-intensive processes.",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "Analyze the system configuration to ensure that the new RAM is operating in dual-channel mode and the SSD is properly configured.",
      "isCorrect": true
    },
    {
      "id": "opt_d",
      "text": "Analyze the system's temperature logs to check for any signs of overheating that might throttle performance.",
      "isCorrect": false
    }
  ],
  "explanation": "Ensuring that the RAM is in dual-channel mode and the SSD is configured correctly can reveal misconfigurations that might be causing the sluggish performance.\n\nWhile overheating can cause performance throttling, the scenario involves recent hardware upgrades. Analyzing temperature logs is more about preventing thermal issues rather than addressing potential misconfigurations related to new hardware.\n\nNetwork traffic analysis is more relevant to diagnosing network-related performance issues. The scenario focuses on hardware upgrades, so network bandwidth is unlikely to be the root cause of the sluggish performance.\n\nWhile identifying resource-intensive processes is important, the scenario specifically involves recent hardware upgrades. The focus should be on analyzing hardware configurations rather than software processes to identify the root cause of the performance issue."
},
{
  "id": "sdi_12",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "After working without problems for a couple of years, your computer has begun to lock up. You suspect that it is a thermal issue, but you can't find any component that is not functioning correctly.\n\nYou have not replaced the CPU or installed any new devices. The CPU cooling fan and the power supply fan are working properly. The lock-ups are happening with increasing frequency.\n\nWhich of the following is the MOST common condition that explains these symptoms?",
  "options": [
    {
      "id": "opt_a",
      "text": "An accumulation of dust has gradually built up.",
      "isCorrect": true
    },
    {
      "id": "opt_b",
      "text": "The internal temperature sensor is beginning to malfunction intermittently.",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "The power supply has been switched to the wrong voltage setting.",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "The BIOS has never been flashed and has gotten more and more out of date.",
      "isCorrect": false
    }
  ],
  "explanation": "Over time, an accumulation of dust can gradually build up and cause significant overheating (which results in lock-ups) by constricting airflow through the system case. Vent holes and heat sinks can become clogged with dust, which prevents heat dissipation. Remove the dust with compressed air or with an anti-static vacuum.\n\nYou should always flash the BIOS when firmware updates become available, but failing to do so will not lead to the system overheating.\n\nSwitching the power supply to the wrong voltage can damage system components, but this would not lead to the system locking up more frequently over time. The damage would happen immediately.\n\nA malfunctioning heat monitor could cause the system to lock up, but the frequency is likely to be intermittent, not consistently increasing."
},
{
  "id": "sdi_13",
  "topic": "System and Display Issues",
  "type": "multiple",
  "requiredSelections": 2,
  "question": "A technician must determine why a computer is overheating. Which of the following may be the cause? (Select two.)",
  "options": [

    },

      "id": "opt_b",

    },
    {
      "id": "opt_c",

      "isCorrect": true
    },
    {
      "id": "opt_d",
      "text": "A fan is not working.",
      "isCorrect": true
    }
  ],
  "explanation": "A computer can overheat because a fan is not working. Proper cooling is vital to the lifespan and performance of the processor.\n\nA computer can overheat because an area is too warm. The technician should check whether the PC is near a hot radiator or in direct sunlight.\n\nA technician should always use blanking plates to cover up slots in the back or front of the PC. Holes can create gaps, allowing dust and debris to make their way to computing components.\n\nAn invalid cable specification can cause display issues. If the display is on and the technician can rule out a problem with the input source, they should check the cable."
},
{
  "id": "sdi_14",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "You are tasked with evaluating a computer system that frequently experiences random shutdowns and OS blue screen errors. After eliminating software issues, you suspect a hardware problem.\n\nWhich of the following actions would be the MOST effective in evaluating the stability of the system's power supply?",
  "options": [
    {
      "id": "opt_a",
      "text": "Visually inspect the power supply for any physical damage or burnt smells.",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Use a multimeter to measure the output voltages of the power supply.",
      "isCorrect": true
    },
    {
      "id": "opt_c",
      "text": "Replace the power supply with a new one to see if the problem persists.",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "Check the system's event logs for any power-related error messages.",
      "isCorrect": false
    }
  ],
  "explanation": "Using a multimeter to measure the output voltages allows you to accurately evaluate whether the power supply is providing stable and correct voltages to the system. This method provides direct and quantitative data about the power supply's performance.\n\nWhile a visual inspection can reveal obvious physical damage or burnt smells, it does not provide a comprehensive evaluation of the power supply's stability or voltage output.\n\nReplacing the power supply without first evaluating the current one does not provide an understanding of the existing power supply's condition. It is more of a trial-and-error approach rather than an evaluative one.\n\nWhile checking event logs can provide insights into power-related issues, it does not directly evaluate the power supply's voltage stability. Event logs are more useful for identifying patterns or symptoms rather than evaluating hardware components."
},
{
  "id": "sdi_15",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "While trying to use a projector for a presentation, you receive an error that states, \"No signal detected.\"\n\nWhat is the MOST likely cause of this error?",
  "options": [
    {
      "id": "opt_a",
      "text": "A burned-out bulb",

    },
    {
      "id": "opt_b",

    },
    {
      "id": "opt_c",

    },
    {
      "id": "opt_d",

},
{
    "id": "hw_01",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "When troubleshooting a Windows system that displays a Blue Screen of Death (BSOD), which of the following steps should you take to understand the cause of the error?",
    "options": [
      {
        "id": "opt_a",
        "text": "Check the error code and message displayed on the BSOD to identify the specific problem.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Disconnect all peripheral devices and attempt to boot the system again.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Immediately restart the computer to see if the issue resolves itself.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Reinstall the operating system to ensure all corrupted files are replaced.",
        "isCorrect": false
      }
    ],
    "explanation": "The BSOD provides an error code and message that can help identify the specific issue causing the crash. Understanding these details is crucial for diagnosing and resolving the underlying problem.\n\nWhile restarting the computer might temporarily resolve the issue, it does not help in understanding the cause of the BSOD. Without identifying the error, the problem may persist or recur.\n\nWhile disconnecting peripherals can help isolate hardware issues, it does not directly address understanding the cause of a BSOD. The error message on the BSOD is a more direct source of information.\n\nReinstalling the operating system is a drastic measure that may resolve the issue but does not help in understanding the specific cause of the BSOD. It's important to analyze the error code first to determine if reinstallation is necessary."
  },
  {
    "id": "hw_02",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are responsible for enhancing the security of a company's laptops that are frequently used by employees for remote work. The company wants to ensure that sensitive data on these laptops is protected even if the devices are lost or stolen.\n\nHow can you utilize the Trusted Platform Module (TPM) to achieve this goal?",
    "options": [
      {
        "id": "opt_a",
        "text": "Configure TPM to monitor system temperatures and alert users of overheating.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Enable TPM to store encryption keys and use it to encrypt the entire hard drive with BitLocker.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Enable TPM to provide faster boot times by optimizing hardware initialization.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Use TPM to disable all USB ports, preventing unauthorized data transfer.",
        "isCorrect": false
      }
    ],
    "explanation": "TPM can securely store encryption keys, and when used with BitLocker, it can encrypt the entire hard drive. This ensures that sensitive data is protected, even if the laptop is lost or stolen, as the data cannot be accessed without the correct decryption key.\n\nTPM is not used for managing USB port permissions. Its primary function is to securely store cryptographic keys and enhance security features like encryption, not to control hardware interfaces like USB ports.\n\nTPM does not have the capability to monitor system temperatures. Its role is focused on security, particularly in storing cryptographic keys and ensuring platform integrity, not hardware monitoring.\n\nTPM is not designed to optimize boot times or hardware initialization. Its purpose is to enhance security by storing cryptographic keys and supporting secure boot processes, not to improve system performance or speed."
  },
  {
    "id": "hw_03",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer frequently overheats and shuts down during intensive tasks. Upon accessing the system firmware settings, you notice that the fan speed is set to \"Quiet\" mode.\n\nWhich of the following actions should you take to analyze and resolve the overheating issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Enable Secure Boot to ensure that only trusted software runs, preventing overheating.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Adjust the boot order to prioritize the SSD, reducing the time the system spends booting and thus lowering heat generation.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Change the fan speed setting to \"Cool\" mode to increase fan activity and reduce system temperature.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Disable USB ports to reduce power consumption and heat output from connected devices.",
        "isCorrect": false
      }
    ],
    "explanation": "By analyzing the current fan speed setting, you can determine that the \"Quiet\" mode is likely contributing to the overheating issue. Changing the setting to \"Cool\" mode will increase fan activity, enhancing cooling and reducing system temperature during intensive tasks.\n\nSecure Boot is a security feature that does not affect system temperature or fan operation. It ensures that only trusted software is loaded during boot but does not address overheating issues.\n\nAdjusting the boot order does not impact the system's temperature during intensive tasks. Boot order settings determine the sequence of boot devices and do not influence heat generation or cooling.\n\nDisabling USB ports may slightly reduce power consumption, but it is unlikely to have a significant impact on the overall system temperature during intensive tasks. The primary issue is related to fan speed settings, not USB port activity."
  },
  {
    "id": "hw_04",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "A flat panel monitor has several black dots. After extensive troubleshooting, it appears to be a display problem. What can fix this?",
    "options": [
      {
        "id": "opt_a",
        "text": "Adjust the resolution.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Change the bulb.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Adjust brightness and contrast controls.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Check for warranty replacement.",
        "isCorrect": true
      }
    ],
    "explanation": "A flat-panel monitor defect may cause individual pixels to be \"stuck\" or \"dead.\" A technician can sometimes fix stuck pixels using a software program. However, a technician cannot usually fix dead pixels (solid black) and should submit the monitor for warranty replacement (if available).\n\nAdjusting the brightness and contrast of a display can help fix a dim image, but not dead pixels.\n\nAdjusting the resolution can resolve a fuzzy image, but it cannot fix dead pixels.\n\nFlat-panel monitors generally do not have a replaceable bulb. However, some projectors may have a replaceable bulb."
  },
  {
    "id": "hw_05",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "When configuring fan settings in the UEFI setup program, which option would you select to prioritize a quieter operation over cooling performance?",
    "options": [
      {
        "id": "opt_a",
        "text": "Cool",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Balanced",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Quiet",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Fanless",
        "isCorrect": false
      }
    ],
    "explanation": "The \"Quiet\" setting prioritizes reducing fan speed to minimize noise, even if it allows for slightly higher system temperatures. This option is specifically intended for quieter operations.\n\nThe \"Balanced\" setting aims to provide a compromise between cooling performance and noise level, but it does not specifically prioritize quieter operation over cooling.\n\nThe \"Cool\" setting is designed to enhance cooling performance by running fans at higher speeds, which typically results in more noise, not less.\n\nWhile \"Fanless\" might suggest a quieter operation, it is not a typical setting for active cooling systems in UEFI. It implies no fan operation, which could lead to overheating unless the system is specifically designed for passive cooling."
  },

  },
  {

      },
      {
        "id": "opt_b",
        "text": "Setting the minimum temperature at which fans start to cool the system",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Adjusting the screen brightness to reduce heat generation",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Configuring the boot order to prioritize devices with lower heat output",
        "isCorrect": false
      }
    ],
    "explanation": "In the system firmware settings, you can typically set the minimum temperature at which fans start to cool the system. This option helps manage the cooling process by activating fans when the system reaches a certain temperature threshold.\n\nAdjusting screen brightness is not related to fan control settings in the system firmware. Screen brightness is typically managed through the operating system or monitor settings, not through firmware fan controls.\n\nSecure Boot is a security feature that ensures that only trusted software is loaded during the boot process. It does not have any impact on fan control or temperature management.\n\nConfiguring the boot order is related to the sequence in which devices are checked for boot managers, not temperature management or fan control. Boot order settings do not influence heat output or cooling fan operation."
  },
  {
    "id": "hw_08",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user submits a support ticket. The user is experiencing a lack of audio signal to the display. The user's computer has a display with built-in audio and a DVI cable connected to a fully-updated Windows PC. Diagnose the lack of audio.",
    "options": [
      {
        "id": "opt_a",
        "text": "Failing monitor circuitry",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Output resolution does not match device’s native resolution.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Using an incorrect cable type",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Outdated audio drivers",
        "isCorrect": false
      }
    ],
    "explanation": "Since the digital visual interface (DVI) does not provide sound, the technician must link the speakers to the computer's audio interfaces through 3.5mm connectors.\n\nA display image will appear fuzzy if the output resolution does not match the native resolution of the display device. However, this will not cause audio issues.\n\nWhile driver issues can cause problems with audio, in this case, the user has claimed to be using a fully-updated system.\n\nThe monitor's backlight or circuitry failure might cause a flickering or flashing display. For example, if the image is nearly invisible, the backlight on the display may have failed."
  },
  {
    "id": "hw_09",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a technician tasked with troubleshooting a desktop computer that powers on but does not boot. The fans are spinning, but the screen remains blank, and there are no beep codes from the internal speaker. The user mentioned that the system firmware was recently updated.\n\nWhich of the following actions should you take first to resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Replace the CPU with a known good one to check for faults.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Check the power supply unit (PSU) for faults.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Remove and re-seat all non-essential adapter cards and cables.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Reset the system firmware to its default settings.",
        "isCorrect": true
      }
    ],
    "explanation": "Given that the system firmware was recently updated and the computer does not boot, resetting the firmware to its default settings can resolve issues caused by a failed or incorrect firmware update. This step directly addresses the potential root cause of the problem.\n\nWhile a faulty CPU can prevent the system from booting, the absence of beep codes and the recent firmware update suggest that the issue might be related to the firmware rather than the CPU itself. Replacing the CPU should be considered only after other potential causes have been ruled out.\n\nAlthough a faulty PSU can cause boot issues, the fact that the fans are spinning indicates that the PSU is likely providing power. The problem is more likely related to the firmware update rather than the power supply.\n\nWhile re-seating adapter cards and cables can resolve connection issues, the context of a recent firmware update suggests that the problem is more likely related to the firmware settings rather than physical connections. This step is useful if there were recent hardware changes or maintenance."
  },
  {
    "id": "hw_10",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "When powering on a legacy IBM desktop computer, hearing one short beep code would indicate the computer is experiencing what sort of issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Faulty onboard speaker",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "No issue",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Power supply fault",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Keyboard issue",
        "isCorrect": false
      }
    ],
    "explanation": "One short beep indicates a normal power-on self-test (POST), meaning the system is OK. Computer technicians configure most modern PCs to boot silently, however.\n\nNo beep may indicate a problem with the power supply, the motherboard problem, or a faulty onboard speaker. The technician should narrow down the issue by checking each component to rule it out, moving on to the next one until discovering the component causing the problem.\n\nRepeating short beeps would indicate a power supply fault or a motherboard problem. Check power cord connections to internal components, especially to the motherboard itself.\n\nThree long beeps would indicate a keyboard issue. However, first, check that a key is not depressed."
  },
  {
    "id": "hw_11",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "A technician is troubleshooting a projector that keeps randomly shutting down. What is the most likely cause?",
    "options": [
      {
        "id": "opt_a",
        "text": "Burned-out bulb",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Incorrect data source",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Overheating",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Loose cable between the monitor and the display",
        "isCorrect": false
      }
    ],
    "explanation": "Overheating typically causes intermittent projector shutdown. Check that the projector's fan is working, that the vents are free from dust and obstructions, and that the ambient temperature is not too high.\n\nA completely failed bulb is known as a burned-out bulb. A technician might hear the bulb \"pop\" and observe scorch marks on the inside or a broken filament.\n\nIf the projector is on, but there is no image displayed, the technician should check the cable and connectors between the video card and monitor.\n\nThe technician may also need to adjust the image or select the appropriate data source or input channel if no image is displayed."
  },
  {
    "id": "hw_12",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "A company is evaluating different boot options for its new fleet of computers to ensure the fastest boot times and efficient recovery processes.\n\nWhich boot option should they prioritize in the boot sequence to achieve these goals, considering modern hardware capabilities?",
    "options": [
      {
        "id": "opt_a",
        "text": "USB drive formatted as a boot device",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Network/PXE (Preboot Execution Environment)",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Optical drive (CD/DVD/Blu-ray)",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Fixed disk (HDD or SSD) using NVMe interface",
        "isCorrect": true
      }
    ],
    "explanation": "Prioritizing a fixed disk, specifically an SSD using the NVMe interface, in the boot sequence ensures the fastest boot times due to the high-speed data transfer capabilities of NVMe. This option leverages modern hardware capabilities to provide efficient and rapid system startup, making it the optimal choice for performance-focused environments.\n\nOptical drives are significantly slower compared to SSDs and are typically used for installations or repairs rather than regular booting. Prioritizing an optical drive would not meet the goal of achieving the fastest boot times.\n\nWhile Network/PXE booting is useful for centralized management and recovery processes, it relies on network speed and server configuration, which can introduce delays. It is not the fastest option for regular booting compared to local NVMe SSDs.\n\nUSB drives can be used for recovery and installation purposes, but they generally do not offer the same speed and performance as NVMe SSDs for regular booting. They are more suitable for temporary or emergency boot scenarios rather than daily use."
  },
  {
    "id": "hw_13",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "A technician replaced a failed drive in a RAID array and noticed a severely degraded performance. What is the problem?",
    "options": [
      {
        "id": "opt_a",
        "text": "There is a cable problem.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Takes resources to rebuild the array.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "The controller is failing.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "There is a faulty disk.",
        "isCorrect": false
      }
    ],
    "explanation": "After replacing the failed disk in the redundant array of independent disks (RAID) array, the performance of the array degrades for some time since the array is rebuilding and the system is writing several gigabytes of data onto the new drive.\n\nIf the controller were failing, replacing the failed disk or boot into the RAID array would not have been possible.\n\nA cable problem would not cause degraded performance. However, a cable problem would likely cause the system not to read the new disk at all.\n\nThe technician has already replaced the faulty disk. Furthermore, failing disks generally fail slowly over time, not immediately, causing substantial performance issues."
  },
  {
    "id": "hw_14",
    "topic": "Troubleshooting PC Hardware",
    "type": "multiple",
    "requiredSelections": 3,
    "question": "What options are available when using Self-Monitoring, Analysis, and Reporting Technology (SMART)? (Select all that apply.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Read test",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Drive self-test (short)",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "File recovery",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Confidence test",
        "isCorrect": true
      }
    ],
    "explanation": "The confidence test is one of the options available on SMART. It is a short operational test to ensure the drive is simply operating properly.\n\nThe drive self-test is a test on the internal workings of the individual disk. The short version just tests for common mechanical issues. A self-test failure will require a drive replacement.\n\nThe read test simply tests the reading aspect of the drive. Therefore, long read times will result in performance issues overall.\n\nA file recovery option is not available on SMART. SMART primarily focuses on individual disk diagnostic tasks."
  },
  {
    "id": "hw_15",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "What issue is occurring when there is no light-emitting diode (LED) lit on a hard drive disk (HDD)?",
    "options": [
      {
        "id": "opt_a",
        "text": "Data loss",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Faulty disk",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "RAID failure",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Mechanical issue",
        "isCorrect": false
      }
    ],
    "explanation": "If disk activity lights (or LED status indicators) are not active, the whole system might not be receiving power, or the individual HDD could be faulty.\n\nA loud or grinding noise, or any sort of clicking sound, is a sign of a mechanical problem.\n\nAn LED status itself does not determine data loss. For example, if the HDD was part of a RAID 5 group, data is still available with one faulty disk; two disk failures would result in some data loss.\n\nA redundant array of independent disks (RAID) failure depends on the RAID type. If part of a RAID 0 group, then a single disk failure results in failure to the RAID. There is no indication of that here."
  },
{
    "id": "net_types_01",
    "topic": "Network Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which type of network is best suited for a company that operates across multiple locations in a city?",
    "options": [
      {
        "id": "opt_a",
        "text": "LAN",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "MAN",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "WLAN",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "PAN",
        "isCorrect": false
      }
    ],
    "explanation": "A MAN (Metropolitan Area Network) is ideal for a company with networks spread across multiple locations in a single city, as it bridges the gap between local LANs and broader WANs. LANs are restricted to a single site, PANs cover very small areas, and WLANs are limited to local, often indoor, wireless communication."
  },
  {
    "id": "net_types_02",
    "topic": "Network Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following features is typically included in a datacenter to ensure a high level of availability?",
    "options": [
      {
        "id": "opt_a",
        "text": "Gaming equipment",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Climate control",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Retail facilities",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Basic electrical service",
        "isCorrect": false
      }
    ],
    "explanation": "Datacenters include climate control to maintain optimal temperatures and protect hardware. Gaming equipment is irrelevant to datacenter operations. Datacenters require dedicated, specialized power solutions instead of basic service. Retail facilities are unrelated to datacenter functions."
  },
  {
    "id": "net_types_03",
    "topic": "Network Types",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is an example of a common PAN technology?",
    "options": [
