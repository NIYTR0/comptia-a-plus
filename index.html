      }
    ],
    "explanation": "Modular PSU incorporates connectors on the PSU and component ends of the power cables. ATX12V, ATC, and Redundant PSU do not explicitly include an option to remove unnecessary connectors."
  },
  {
    "id": "psu_13",
    "topic": "Power Supplies and Cooling",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "You have a motherboard that uses a 24-pin ATX connector.\nWhich types of power supply could you use with this motherboard? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "A power supply with a 20-pin ATX and a Molex connector",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "A power supply with a 24-pin ATX connector only",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "A power supply with a 20-pin ATX and a +4-pin connector",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "A power supply with a 20-pin ATX and a 6-pin connector",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "A power supply with a 20-pin ATX connector only",
        "isCorrect": false
      }
    ],
    "explanation": "In this case, the motherboard needs either a 24-pin ATX connector or a 20-pin ATX and a +4-pin connector.\n\nWhen selecting a power supply, make sure it includes the necessary connectors for your motherboard. Some motherboards and processors require an extra 4-pin and/or 8-pin connector in addition to the main 20- or 24-pin power connector.\n\nA Molex connector is used by legacy components (such as IDE hard drives and PATA optical drives), case fans, and other accessory devices.\n\nA 6-pin connector is used for video cards."
  },
  {
    "id": "psu_14",
    "topic": "Power Supplies and Cooling",
    "type": "multiple",
    "requiredSelections": 3,
    "question": "Which of the following will ensure optimal system cooling? (Select three.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Remove the side panel on the case.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Keep the ambient temperature below 80 degrees F.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Leave space between the case and any walls or obstructions.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Bundle cables together and secure unused cables to the case.",
        "isCorrect": true
      },
      {
        "id": "opt_e",
        "text": "Stack hard drives next to each other.",
        "isCorrect": false
      },
      {
        "id": "opt_f",
        "text": "Remove unused expansion slot covers to increase airflow.",
        "isCorrect": false
      }
    ],
    "explanation": "Consider the following recommendations to ensure optimal system cooling:\nKeep the case free of dust and debris. Excess dust can restrict airflow and prevent proper heat transfer.\nReduce the number of airflow obstructions. Employ proper cable management (bundle cables together and secure unused cables to the case). Space out multiple hard disk drives instead of stacking them next to each other.\nMaintain appropriate ambient temperatures. Optimal ambient temperatures are between 60 and 80 degrees Fahrenheit.\nEnsure proper ventilation; leave space between the computer and any walls or desks.\nPreserve negative pressure inside the case by keeping all covers and shields installed (unused expansion cards, I/O shield, front drive bays)."
  },
  {
    "id": "psu_15",
    "topic": "Power Supplies and Cooling",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have a desktop computer that you want to upgrade. You add several internal and external components. You realize that you need to ensure that your power supply can support these new components.\nWhich of the following power supply ratings BEST describes the rating you would use to determine this?",
    "options": [
      {
        "id": "opt_a",
        "text": "Watt rating",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "DC voltage rating",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "AC voltage rating",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Resistance rating",
        "isCorrect": false
      }
    ],
    "explanation": "The number of devices a power supply can support is directly related to the number of watts that the power supply is rated for. A power supply's watt rating determines its maximum power output.\n\nAC and DC voltage are a measure of electrical pressure and are not directly related to the number of supportable devices. The voltage is dependent on the voltage of the wall outlet, and the voltage switch on the power supply should match the outlet's voltage. 115 is used in the United States, while 230 is typically used in Europe.\n\nResistance is a measure of how much an electrical device reduces the electrical current flowing through it."
  },
{
    "id": "storage_01",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "What distinguishes SD Express cards from earlier versions of SD cards?",
    "options": [
      {
        "id": "opt_a",
        "text": "They are only compatible with devices using USB interfaces",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "They have a maximum capacity of 32 GB",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "They are only available in the original SD format with speeds up to 25 MBps",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "They offer much higher speeds",
        "isCorrect": true
      }
    ],
    "explanation": "SD Express cards stand out because they use PCIe and NVMe interfaces, allowing for significantly higher speeds of up to 985 MBps compared to earlier versions. They are not limited to USB interfaces or small capacities; instead, they offer improved performance and capacity options. The original SD format only supported speeds up to 25 MBps, which is much slower than SD Express."
  },
  {
    "id": "storage_02",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following drive configurations uses striping with parity for fault tolerance?",
    "options": [
      {
        "id": "opt_a",
        "text": "RAID 0",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "RAID 1",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "RAID 10",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "RAID 5",
        "isCorrect": true
      }
    ],
    "explanation": "RAID 5 uses disk striping, but provides fault tolerance for a single disk failure. Disk striping breaks data into units and stores the units across a series of disks by reading and writing to all disks simultaneously.\n\nRAID 0 uses disk striping and offers no fault tolerance. A failure of one disk in the set means that all data is lost.\n\nRAID 1 provides fault tolerance, but does not use striping.\n\nA RAID 10 array nests a mirrored array within a striped array."
  },
  {
    "id": "storage_03",
    "topic": "Storage Devices",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "You are in the process of purchasing several new Windows-based computers to replace broken or outdated computers. You have heard that solid-state drives (SSDs) can significantly increase systems' overall performance.\nWhich of the following BEST describe the features of solid-state drives (SSDs) compared to hard disk drives (HDDs)? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "An SSD opens files faster than an HDD.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "An SSD uses flash technology to store data.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "SSD spindles move at a faster rate than those of an HDD.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "An SSD can be adversely affected by magnetism.",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "An SSD cheaply stores a large amount of data.",
        "isCorrect": false
      }
    ],
    "explanation": "A solid-state drive is a flash device with a storage capacity similar to that of a small hard drive. Solid-state drives are used as replacements for hard disk drives and store operating systems, application, and data files.\n\nSolid-state drives have several advantages. They:\n* Are faster than hard drives.\n* Have no moving parts.\n* Have lower power consumption than hard drives (which is good for laptops).\n* Are less susceptible to physical damage and are immune to magnetic field damage.\n* Are smaller and lighter than hard drives.\n\nThe main disadvantage to solid-state drives is cost. They are several times more expensive than comparable hard drives. However, their advantages make them a good choice in many situations, especially for portable devices."
  },
  {
    "id": "storage_04",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "One of your customers wants you to build a personal server that he can use in his home. One of his concerns is making sure that he has at least one data backup stored on the server in the event that a disk fails. You have decided to back up his data using RAID.\nSince this server is for personal use only, the customer wants to keep costs down. Therefore, he would like to keep the number of drives to a minimum.\nWhich of the following RAID systems would BEST meet the customer's specifications?",
    "options": [
      {
        "id": "opt_a",
        "text": "RAID 1",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "RAID 0",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "RAID 5",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "RAID 10",
        "isCorrect": false
      }
    ],
    "explanation": "RAID 1 protects memory from a single disk failure and provides high-read performance. RAID 1 also only requires a minimum of two disks. RAID 5 would also protect data from a single disk failure but requires a minimum of three disks, and RAID 10 requires a minimum of four disks."
  },
  {
    "id": "storage_05",
    "topic": "Storage Devices",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "You want to create a high-performance Windows laptop with both a 2-TB hard drive and a 1-TB SSD drive.\nWhich of the following are data storage recommendations for your high performance system? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Store heavily used information on the SSD drive.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Automatically back up important data on the hard drive to the SSD drive.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Store data that requires high performance on the SSD drive.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Store data that requires high performance on the hard drive.",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "Store heavily used information on the hard drive.",
        "isCorrect": true
      }
    ],
    "explanation": "For your high-performance system, you should adhere to the following data storage recommendations:\n* Store heavily used information on the standard hard disk drive.\n* Store high-performance data on the SSD drive.\n* As a final recommendation, you should automatically back up important data on the SSD drive to the hard drive."
  },
  {
    "id": "storage_06",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have an existing computer running Windows 11. You want to configure a RAID 1 array in the computer. You install two new SATA drives and then use the RAID controller integrated in the motherboard to define a RAID 1 array using both drives.\nWhen you boot the computer, Windows does not show the logical RAID drive. What should you do?",
    "options": [
      {
        "id": "opt_a",
        "text": "Set the jumpers on the drives to use SATA I mode.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Install the driver for the RAID controller.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "In the BIOS, change the SATA disk mode to RAID.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "In the BIOS, change the SATA disk mode to AHCI.",
        "isCorrect": false
      }
    ],
    "explanation": "You must install the RAID driver so that Windows recognizes arrays created by the motherboard RAID utility. Without the driver, Windows will not be able to see the logical drive defined by the array.\n\nWhen you define the array, you configure the BIOS to use RAID as the SATA type. If you had not completed this step, you would not be able to run the RAID configuration utility.\n\nYou use AHCI to configure SATA drives to support hot swapping.\n\nSetting the jumpers is designed to help older drives work smoothly with newer equipment by limiting the data transfer rate. There are no jumpers on newer hard drives (manufactured after 2002)."
  },
  {
    "id": "storage_07",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which Blu-ray standard defines rewritable discs?",
    "options": [
      {
        "id": "opt_a",
        "text": "BD-R",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "BD-R/RW",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "BD-ROM",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "BD-RE",
        "isCorrect": true
      }
    ],
    "explanation": "BD-RE is the Blu-ray standard that defines rewritable discs.\n\nBD-ROM is the read-only standard, and BD-R is the recordable standard.\n\nR/RW is used to designate rewritable CD and DVD discs, not Blu-ray discs."
  },
  {
    "id": "storage_08",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have configured Disk 3 and Disk 4 on your Windows 11 workstation as a RAID 1 array with the NTFS file system, and you have assigned F as the drive letter for the array. Each disk has an individual storage capacity of 1 TB.\nHowever, when you check the available storage size of F, you notice that it only lists 1 TB (instead of 2 TB) of available disk storage space. What should you do to resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Change the volume to a spanned volume.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Make sure both disks are set to dynamic instead of basic.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "You need to change to a RAID 5 array.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Nothing. The RAID array is working as designed.",
        "isCorrect": true
      }
    ],
    "explanation": "You do not need to do anything. A RAID 1 array provides mirroring, which means that the same data is available on both disks. This means that the total size of the volume is equal to just the size of one of the disks in the array. In this case, the total volume size is still 1 TB, even though each disk is capable of storing 1 TB.\n\nYou change the format of the disks from basic to dynamic before creating the RAID array.\n\nA RAID 5 array requires three disks, not two. In addition, you can't create a RAID 5 array on a Windows workstation. You can only do this on server versions of Windows.\n\nWhile a spanned volume spans across multiple hard disk drives (much like a RAID volume), it is not a RAID method. A spanned volume simply glues two disks together to create a volume without any redundancy or performance improvement."
  },
  {
    "id": "storage_09",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which storage device uses aluminum platters for storing data?",
    "options": [
      {
        "id": "opt_a",
        "text": "SD card",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "DVD disc",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "CD-ROM disc",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Hard disk",
        "isCorrect": true
      },
      {
        "id": "opt_e",
        "text": "DLT tape",
        "isCorrect": false
      }
    ],
    "explanation": "Hard disks use magnetic disks and platters.\n\nOptical drives, such as DVD or CD-ROM drives, use a reflective surface that is read by an optical reader.\n\nFlash devices, such as SD cards, store information using programmable non-volatile flash memory.\n\nDLT drives use magnetic tape."
  },
  {
    "id": "storage_10",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is an advantage of RAID 5 over RAID 1?",
    "options": [
      {
        "id": "opt_a",
        "text": "RAID 5 improves performance over RAID 1.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "RAID 5 provides redundancy for the disk controller.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "RAID 5 provides redundancy; RAID 1 does not.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "RAID 5 continues to operate with a failure in two disks. RAID 1 can only operate with a failure of one disk.",
        "isCorrect": false
      }
    ],
    "explanation": "RAID 5 provides both fault tolerance and improved performance. RAID 1 (utilizing mirroring) provides only fault tolerance with no performance benefit. Both RAID 5 and RAID 1 can only sustain a loss of one disk in the set. Use multiple disk controllers to provide redundancy for the disk controller."
  },
  {
    "id": "storage_11",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a sales representative for a large pharmaceutical company. You often want to share information from your laptop quickly with customers during onsite visits.\nWhich of the following storage media would BEST allow you to quickly and inexpensively share your files with the customers?",
    "options": [
      {
        "id": "opt_a",
        "text": "HDD drive",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "SDHC memory card",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "SSD drive",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Flash drive",
        "isCorrect": true
      }
    ],
    "explanation": "A flash drive (sometimes called a thumb drive) uses flash memory to permanently store data on flash memory chips. You can plug a flash drive into the appropriate port (such as a USB port) on a PC and have it function as a standard hard drive. In this scenario, you would simply plug it externally into your laptop, copy the files, and then leave it with the customer to copy to their own device.\n\nWhile an SSD drive can act as an external drive, an SDD drive is much more expensive than a flash drive and would not be practical to leave with the customer.\n\nWhile you normally install an HDD drive on a PC, an HDD drive can be housed for external access as well. However, it would be a very expensive solution compared to simply leaving a flash drive with the customer.\n\nWhile an SDHC memory card might be a solution, it would only work if the customer had a PC with a memory card reader. The flash drive uses a USB connector, which is a much more universal method of connecting to a PC or other portable computing device."
  },
  {
    "id": "storage_12",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are configuring a new system, and you want to use a RAID 0 array for the operating system using SATA disks and a special controller card that includes a RAID processor.\nWhich RAID method should you use?",
    "options": [
      {
        "id": "opt_a",
        "text": "Software",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Operating system",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "JBOD",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Hardware",
        "isCorrect": true
      }
    ],
    "explanation": "Hardware RAID uses a special controller card that includes a RAID processor. While it is the most expensive RAID method, it provides much better performance and is more reliable than other methods.\n\nSoftware RAID uses a driver and the system CPU for controlling RAID operations. While some RAID controller cards support RAID configuration, they do not have an onboard RAID processor and are classified as software RAID.\n\nOperating system RAID uses RAID features within the operating system. Like software RAID, the system CPU is used for RAID operations.\n\nJBOD (Just a Bunch of Disks) is a spanned volume."
  },
  {
    "id": "storage_13",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You work for a small company as the human resources specialist. Since the company is fairly small, you are maintaining all of the employee information on your desktop computer, which is running Windows 11. This computer has two high-capacity hard disks. You want to ensure that this information is protected from a hard disk failure, so you want to set up a Windows software RAID system.\nWhich of the following would be your BEST solution?",
    "options": [
      {
        "id": "opt_a",
        "text": "Use striped volumes.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Use RAID 5 volumes.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Use spanned volumes.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Use mirrored volumes.",
        "isCorrect": true
      }
    ],
    "explanation": "A Windows software RAID system can be configured on Windows 11 using the Windows Disk Management tool. Of the available options from within Disk Management, you would need to configure a mirrored volume to protect your data from a disk failure. Disk mirroring requires two available drives with sufficient storage. Once configured, the data written to a mirrored volume is duplicated to both drives. This duplication, or mirroring, means that if one of the mirrored drives fails, all of the data can still be retrieved from the remaining good drive.\n\nA spanned volume is a dynamic volume consisting of disk space on more than one physical disk. This method does not duplicate the data. If a spanned volume drive fails, the data is lost.\n\nA striped volume uses the free space on more than one physical hard disk to create a bigger volume (similar to a spanned volume). However, a striped volume writes across all volumes in the stripe in small blocks, distributing the load across the disks in the volume. In other words, when a single file is written, some of the file will be on one disk, and the rest of the file will be on another. This makes writing files faster. It does not, however, protect the data in the event of a disk failure.\n\nRAID 5 requires more than two disks."
  },
  {
    "id": "storage_14",
    "topic": "Storage Devices",
    "type": "single",

    "question": "You want to create a software RAID 1 array on your Windows 11 workstation using Disk 1 and Disk 2.\nWhat do you need to do with Disk 1 and Disk 2 before configuring them for a RAID 1 array?",
    "options": [
      {
        "id": "opt_a",
        "text": "Format both disks with the same file system.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Convert the disks from basic to dynamic.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Convert the disks from dynamic to basic.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Verify that both disks are the same size.",
        "isCorrect": false
      }
    ],
    "explanation": "You can only use dynamic disks to create a software RAID array in Windows. Therefore, you need to convert Disk 1 and Disk 2 (using the Disk Management tool) from basic disks to dynamic disks.\n\nWith RAID 1, you write redundantly on both disks. If the disks are not the same size, the mirroring is limited to the size on the smaller disk. However, this does not impact preparing the disks for use in a RAID 1 array.\n\nWhile it's important to configure the disks with a file system, this step is part of configuring the RAID 1 software array. You do not need to do this before the configuration process."

{
    "id": "bios_01",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer is not booting from a newly installed SSD, even though it is properly connected.\n\nUpon checking the system firmware settings, you find that the boot option sequence is set to prioritize the optical drive first, followed by a USB drive, and then the network.\n\nWhich of the following actions should you take to analyze and resolve the boot issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Enable Secure Boot in the UEFI setup to ensure the SSD is recognized as a trusted device.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Update the system firmware to the latest version to ensure compatibility with the SSD.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Change the boot option sequence to prioritize the SSD as the first boot device.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Disconnect the optical drive and USB drive to force the system to boot from the SSD.",
        "isCorrect": false
      }
    ],
    "explanation": "Analyzing the boot option sequence reveals that the SSD is not prioritized, which is why the system is not booting from it. By changing the sequence to prioritize the SSD, you ensure that the system firmware searches the SSD first for a boot manager, resolving the issue.\n\nWhile disconnecting other boot devices might force the system to boot from the SSD, it is not an efficient or practical solution. It does not address the root cause of the issue, which is the incorrect boot option sequence.\n\nEnabling Secure Boot is a security measure and does not influence the boot order or resolve issues related to boot device prioritization. It ensures that only trusted software is loaded but does not affect the SSD's boot priority.\n\nWhile updating the firmware can be beneficial for compatibility, it is not necessary in this scenario. The issue is related to the boot option sequence, not firmware compatibility. Prioritizing the SSD in the boot sequence is the correct action to resolve the issue."
  },
  {

    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following BEST describes the role of the Trusted Platform Module (TPM) in enhancing system security?",
    "options": [
      {
        "id": "opt_a",
        "text": "Verifying that the TPM is configured to support legacy BIOS mode for compatibility with older hardware.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Checking if the TPM is used to control fan speed and temperature monitoring for system stability.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Assessing whether the TPM is used to store cryptographic keys securely, preventing unauthorized access to encrypted data.",
        "isCorrect": true

      {
        "id": "opt_d",
        "text": "Evaluating if the TPM is enabled to allow booting from USB devices for recovery purposes.",
        "isCorrect": false

    "explanation": "The TPM is designed to securely store cryptographic keys, which is crucial for protecting encrypted data and ensuring that sensitive information is not accessed by unauthorized users.\n\nWhile booting from USB devices can be useful for recovery, it is not related to the primary function of the TPM. The TPM is not involved in enabling or disabling boot options; its role is focused on security, particularly in storing cryptographic keys.\n\nThe TPM does not play a role in supporting legacy BIOS mode. This option confuses the TPM's security functions with compatibility settings, which are unrelated to the TPM's purpose.\n\nThe TPM is not involved in hardware management tasks such as controlling fan speed or temperature monitoring. This option misrepresents the TPM's role, which is centered around security and cryptographic functions, not hardware stability."
  },
  {
    "id": "bios_03",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "An energy company is strengthening its defenses and wants to look for methods that successfully protect trade secrets by ensuring none of its company's computing assets are hijacked by malware.\nTo assist in safeguarding the sensitive information, what can the technician enable to ensure this will not happen?",
    "options": [

        "id": "opt_a",

      },

        "id": "opt_b",
        "text": "HSM",

      },
      {
        "id": "opt_c",
        "text": "TPM",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Secure boot",
        "isCorrect": true
      }
    ],
    "explanation": "The technician can configure secure boot, which is a unified extensible firmware interface (UEFI) feature designed to prevent malware from hijacking a computer.\n\nA trusted platform module (TPM) is a specification for hardware-based storage of digital certificates, cryptographic keys, and hashed passwords.\n\nA hardware security module (HSM) is a secure USB key or thumb drive used to store cryptographic material where a user must authenticate before they can access the keys stored on the module.\n\nA boot password requires the user to authenticate before the operating system is loaded. Different system software will provide different support for authentication methods. This measure cannot keep malware from injecting code into the bootloader of the operating system."
  },
  {

    "topic": "BIOS and UEFI",

    "question": "You have purchased a new notebook. This notebook system uses UEFI firmware and comes with Windows 11 preinstalled. However, you want to use Linux on this system.\nYou download your favorite distribution and install it on the system, removing all Windows partitions on the hard disk in the process. When the installation is complete, you find that the operating system won't load when the system is rebooted.\nWhich of the following would allow your computer to boot to Linux?",

  },
  {

    "topic": "BIOS and UEFI",

    "requiredSelections": 1,
    "question": "A company has recently upgraded its systems to UEFI-based firmware, and some employees are experiencing issues accessing system settings during boot.\nWhich of the following actions would BEST evaluate and resolve the issue of missing the key prompt to access the UEFI setup program?",

    "explanation": "Using the Shift-click method on the Restart button from the Windows logon screen to access UEFI boot options provides a reliable way to access UEFI boot options without relying on the timing of key presses during boot. It evaluates the issue by offering an alternative access method, ensuring users can reach the UEFI setup even if they miss the initial prompt.\n\nWhile pressing the Delete key is a common method to access the UEFI setup, it does not evaluate the issue of missing the prompt. This approach relies on timing and may not resolve the problem if the boot process is too fast.\n\nDisabling Secure Boot does not affect the ability to access the UEFI setup program. Secure Boot is a security feature and does not influence the key prompt or access method for UEFI settings.\n\nAdjusting the boot order is unrelated to accessing the UEFI setup program. This action focuses on the sequence of boot devices rather than resolving the issue of missing the key prompt for UEFI access."
  },
  {

    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a system administrator tasked with optimizing the cooling system of a high-performance workstation used for video editing. The workstation frequently overheats, causing performance issues.\nBased on the system's UEFI settings, which of the following actions should you take to ensure the workstation operates efficiently without overheating?",
    "options": [
      {
        "id": "opt_a",
        "text": "Configure the duty cycle settings to a higher percentage to increase the fan speed and improve cooling efficiency.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Set the cooling option to \"Quiet\" to reduce fan noise and allow the system to run at higher temperatures.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Use third-party applications to manually monitor the temperature and adjust fan settings as needed.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Disable all USB ports to reduce power consumption and indirectly lower system temperature.",

    "explanation": "Increasing the duty cycle settings will make the fans run faster, enhancing cooling efficiency and helping to prevent the workstation from overheating. This action directly addresses the overheating issue by improving airflow and heat dissipation.\n\nWhile this option reduces fan noise, it allows the system to run at higher temperatures, which is not ideal for a workstation that is already experiencing overheating issues. This setting prioritizes noise reduction over cooling efficiency.\n\nDisabling USB ports may slightly reduce power consumption, but it is unlikely to have a significant impact on the system's overall temperature. This action does not directly address the cooling needs of the workstation.\n\nWhile third-party applications can provide valuable temperature monitoring, they do not directly adjust fan settings through UEFI. The question specifically asks for actions within the UEFI settings, making this option less relevant to the scenario."
  },
  {

    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following BEST describes the technology that was designed to replace the BIOS and is a firmware solution for controlling the startup process and loading the computer operating system into memory?",

  {
    "id": "bios_08",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer frequently overheats and shuts down during intensive tasks. Upon accessing the system firmware settings, you notice that the fan speed is set to \"Quiet\" mode.\nWhich of the following actions should you take to analyze and resolve the overheating issue?",

  },
  {

    "question": "Which of the following is a typical boot device option that can be prioritized in the system firmware's boot option sequence?",

  {

    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a technician tasked with setting up a new computer system for a client who wants to install an operating system from a USB drive. However, the system is currently configured to boot from the internal hard drive first.\nWhich of the following actions should you take to ensure the system boots from the USB drive?",

  {

  {

  {

{

    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer frequently crashes with a Blue Screen of Death (BSOD) displaying the error code \"0x00000024,\" which indicates an issue with the NTFS file system.\n\nAfter analyzing the situation, which of the following actions should you prioritize to determine the root cause of this error?",

        "id": "opt_b",
        "text": "Disable all startup programs to see if the issue persists.",

      },
      {
        "id": "opt_c",
        "text": "Check the system's RAM for errors using a memory diagnostic tool.",

      },

  },
  {
    "id": "power_disk_02",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have just installed an SSD drive in your older Windows workstation. However, after you start Windows, you do not see the SSD drive listed in Windows Explorer.\n\nWhat should you do FIRST?",
    "options": [
      {
        "id": "opt_a",
        "text": "Replace the power supply.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Configure the jumpers on the SSD drive.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Make sure the power connectors on the SSD drive are plugged in all the way.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Use the voltage switch on the power supply to switch from 110 to 220 volts.",
        "isCorrect": false
      }
    ],
    "explanation": "Because you have just made a system change, you should check items related to the change you have made. In this case, check to make sure that the power connectors are plugged into the SSD drive.\n\nJumpers are pins on the back of some older hard drives and are used to enable specific types of settings. These do not apply to an SSD drive.\n\nReplacing the power supply is one of the last steps you should take, especially if the power supply is new and seems to be working.\n\nUsing the voltage switch to go from 110 to 220 volts does not normally impact whether or not an SSD drive is working."
  },
  {
    "id": "power_disk_03",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "A client complains that their computer intermittently fails to boot, displaying a \"Missing Operating System\" error. You have confirmed that the boot order is correct, and the drive is detected in the UEFI/BIOS.\n\nWhat should you analyze next to identify the root cause of the boot sector issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Examine the drive for file system corruption or logical errors.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Replace the SATA cables connecting the drive to the motherboard.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check for any recent changes in the system firmware settings.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Test the RAM modules for any faults or errors.",
        "isCorrect": false
      }
    ],
    "explanation": "Analyzing the drive for file system corruption or logical errors is appropriate in this scenario. The \"Missing Operating System\" error can be caused by issues within the boot sector or file system, which may prevent the system from locating the operating system.\n\nWhile faulty RAM can cause various system issues, it is less likely to be the cause of a \"Missing Operating System\" error, which is more directly related to the boot sector or drive issues.\n\nAlthough changes in firmware settings can affect boot behavior, the issue described is more indicative of a problem with the drive's boot sector or file system, not the firmware settings.\n\nWhile faulty cables can cause detection issues, the drive is already detected in the UEFI/BIOS. The focus should be on analyzing the integrity of the drive's file system and boot sector."
  },
  {
    "id": "power_disk_04",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "While running a graphics editing program on your Windows workstation, a screen suddenly pops up with an error message warning. You note the error message, but the only way to continue working is to reboot your system.\n\nWhat is this type of error screen called?",
    "options": [
      {
        "id": "opt_a",
        "text": "POST",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "HVAC",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "BSoD",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "SPoD",
        "isCorrect": false
      }
    ],
    "explanation": "You are experiencing a Blue Screen of Death (BSoD). This is a proprietary crash screen officially known as a stop error or blue screen error. A BSoD happens when the Windows OS encounters a fatal system error.\n\nAn SPoD (Spinning Pinwheel of Death) is the macOS equivalent of a BSoD. In this case, you are running a Windows system, so an SPoD does not apply.\n\nPOST errors are encountered when booting your system (before running Windows) and do not apply in this scenario.\n\nHVAC stands for heating, ventilation, and air conditioning. This is the system that moves air between indoor and outdoor areas in a room. HVAC does not directly apply to computer systems."
  },
  {
    "id": "power_disk_05",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "Every time a user attempts to save a file, the computer shows an error that reads, \"Cannot read from the source disk.\" What kind of issue does this indicate?",
    "options": [
      {
        "id": "opt_a",
        "text": "RAID failure",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Drive issue",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Power issue",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "POST issue",
        "isCorrect": false
      }
    ],
    "explanation": "A \"cannot read from the source disk\" error indicates an issue with a fixed disk drive that is failing. Bad sectors typically cause this on a hard disk drive.\n\nPower-on self-test (POST) is a diagnostic program implemented in the system firmware that checks the hardware to ensure the components required to boot the PC are present and functioning correctly.\n\nA power issue might arise due to a fault in the power supply unit (PSU), incoming electricity supply, power cables/connectors, or fuses.\n\nIn a redundant array of independent disks (RAID), if one of the underlying devices fails, the volume will show up as \"degraded,\" but the data on the volume will still be accessible."
  },
  {
    "id": "power_disk_06",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "A technician is troubleshooting a failed redundant array of independent disks (RAID) configuration and is unable to access the RAID configuration utility. What does this indicate?",
    "options": [
      {
        "id": "opt_a",
        "text": "Controller failure",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Boot process failure",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Multiple disk failure",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Disk failure",
        "isCorrect": false
      }
    ],
    "explanation": "If the technician cannot access the RAID configuration utility, this indicates that the controller itself is likely to have failed. However, the data on the volume should be recoverable.\n\nMost desktop-level RAID solutions can tolerate the loss of only one disk, so the technician should replace it as soon as possible.\n\nIf the RAID failure affects the boot process, the technician can use the RAID configuration utility to verify its status.\n\nIf a volume is not available, either multiple disks (more than the tolerated number of disks) have failed, or the controller has failed."
  },
  {
    "id": "power_disk_07",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "When troubleshooting boot sector issues, which of the following steps is essential to ensure the system can successfully boot from the correct drive?",
    "options": [
      {
        "id": "opt_a",
        "text": "Inspect the power supply unit for any faults or issues.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Ensure that the system firmware is updated to the latest version.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check if the keyboard is connected properly to avoid boot errors.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Verify that the boot order in the UEFI/BIOS settings is correctly configured.",
        "isCorrect": true
      }
    ],
    "explanation": "Verifying that the boot order in the UEFI/BIOS settings is correctly configured is crucial when troubleshooting boot sector issues, as the boot order determines which drive the system attempts to boot from first. If the boot order is incorrect, the system may try to boot from a non-bootable device, leading to boot failures.\n\nWhile a disconnected or malfunctioning keyboard can cause certain boot issues, it is not directly related to boot sector problems. Boot sector issues are more concerned with the configuration and detection of bootable drives.\n\nUpdating the system firmware can resolve some hardware compatibility issues, but it is not a primary step in addressing boot sector issues. Boot sector troubleshooting focuses on drive configuration and boot order.\n\nWhile power supply issues can cause a computer not to start, they are not directly related to boot sector problems. Boot sector troubleshooting involves ensuring the correct drive is being accessed during the boot process."
  },
  {
    "id": "power_disk_08",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a technician tasked with resolving a boot issue on a client's computer. The system fails to boot and displays an error message indicating \"No Bootable Device Found.\"\n\nUpon inspection, you notice that the system has multiple drives installed.\n\nWhich of the following actions should you take first to resolve the boot sector issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Run a full diagnostic test on all installed drives to check for hardware failures.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Reinstall the operating system on the primary drive.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check the UEFI/BIOS settings to ensure the correct boot order is set.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Replace the data cables connecting the drives to the motherboard.",
        "isCorrect": false
      }
    ],
    "explanation": "Ensuring that the UEFI/BIOS is configured to boot from the correct drive can resolve the \"No Bootable Device Found\" error if the system is trying to boot from a non-bootable drive.\n\nReinstalling the operating system is a more drastic measure and should not be the first step. It is important to first verify that the system is attempting to boot from the correct drive before considering reinstallation.\n\nWhile faulty data cables can cause drive detection issues, the error message specifically indicates a boot order problem. Checking the boot order is a more direct and less invasive step to take first.\n\nRunning diagnostics is a good practice if a hardware failure is suspected, but in this scenario, the error message suggests a configuration issue rather than a hardware failure. Checking the boot order is a more efficient first step."
  },
  {
    "id": "power_disk_09",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "When booting your workstation, you hear a series of audible beeps, and the system locks up.\n\nWhat is the FIRST step you should take when troubleshooting this issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Replace the motherboard battery.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Check for dust buildup inside the case.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Disconnect nonessential peripherals and try to reboot.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Check the motherboard documentation for POST errors.",
        "isCorrect": true
      }
    ],
    "explanation": "Every time a workstation boots, it runs a Power-On Self-Test (POST) to make sure that all of the basic hardware in the system is present and functioning correctly. If a problem is identified during POST, an error is generated, which can be a series of beeps. You need to check the motherboard documentation to interpret what the series of beeps represents.\n\nIf the motherboard battery fails, the system clock can lose time, or the BIOS/UEFI settings may reset to their defaults. However, this would not cause the series of beeps you are hearing when the system boots.\n\nDust buildup can cause overheating and other symptoms. However, this is not related to the POST error beeps you are hearing when the system boots.\n\nDisconnecting nonessential peripherals and then rebooting is a troubleshooting step for resolving a Blue Screen of Death issue and is not related to POST error beeps."
  },
  {
    "id": "power_disk_10",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer is not booting and displays an error message stating, \"Boot device not found.\" You verify that the hard drive is properly connected and powered.\n\nUpon entering the BIOS/UEFI settings, you notice that the boot order is set to prioritize USB devices over the internal hard drive.\n\nWhat should you do to resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Update the BIOS/UEFI firmware to the latest version.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Change the boot order to prioritize the internal hard drive.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Format the hard drive and reinstall the operating system.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Disable USB ports in the BIOS/UEFI settings.",
        "isCorrect": false
      }
    ],
    "explanation": "By analyzing the BIOS/UEFI settings, you identified that the boot order was incorrect. Changing the boot order to prioritize the internal hard drive will allow the system to boot from the correct device.\n\nDisabling USB ports is not necessary and could prevent the use of USB devices needed for other functions. The issue is related to the boot order, not the functionality of USB ports.\n\nWhile updating firmware can resolve some issues, it is not relevant to the current problem of boot order configuration. The solution lies in adjusting the settings rather than updating them.\n\nFormatting the hard drive is an extreme measure and unnecessary in this scenario. The problem is with the boot order, not the operating system or hard drive integrity."
  },
  {
    "id": "power_disk_11",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following is a common symptom of a failing hard disk drive (HDD) that affects its reliability and performance?",
    "options": [
      {
        "id": "opt_a",
        "text": "The computer's power supply unit (PSU) fails to provide stable power to the motherboard.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "The computer fails to detect any bootable drives during the boot sequence.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "The computer displays a blue screen of death (BSOD) during startup.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The computer experiences frequent freezing and slow file access times.",
        "isCorrect": true
      }
    ],
    "explanation": "Frequent freezing and slow file access times are common symptoms of a failing hard disk drive. These issues indicate that the drive is struggling to read or write data efficiently, affecting its reliability and performance.\n\nWhile a BSOD can occur due to various hardware and software issues, it is not specifically indicative of a failing hard disk drive. BSODs can be caused by driver issues, memory problems, or other hardware failures.\n\nThe computer failing to detect any bootable drives during the boot sequence is more related to boot configuration problems, connection issues, or BIOS/UEFI settings rather than directly indicating a failing hard disk drive. It could also be due to a completely failed drive, but not necessarily related to reliability and performance.\n\nThe computer's power supply unit (PSU) failing to provide stable power to the motherboard is related to power supply problems and is not directly connected to the reliability and performance of a hard disk drive. A failing PSU can cause various system issues but does not specifically indicate a problem with the HDD."
  },
  {
    "id": "power_disk_12",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "When troubleshooting a computer that won't start due to a power issue, which of the following steps should you take first to determine if the problem is related to the power supply unit (PSU)?",
    "options": [
      {
        "id": "opt_a",
        "text": "Remove all nonessential devices and add them back one by one.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Replace the motherboard with a new one.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check if the LEDs on the front panel are lit and if you can hear the fans.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Update the system firmware to the latest version.",
        "isCorrect": false
      }
    ],
    "explanation": "Checking if the LEDs on the front panel are lit and if you can hear the fans helps determine if the PSU is supplying power to the system. If the LEDs and fans are operational, it indicates that the PSU is at least partially functioning, which helps narrow down the potential causes of the power issue.\n\nReplacing the motherboard is a more invasive and costly step that should only be considered after simpler diagnostics have been performed. It is not the first step in troubleshooting power issues.\n\nUpdating the system firmware is unrelated to diagnosing power issues. Firmware updates are typically used to resolve compatibility or performance issues, not to address basic power functionality.\n\nRemoving all nonessential devices and adding them back one by one is more relevant for diagnosing POST or boot issues rather than initial power issues. It helps identify faulty components but does not directly address whether the PSU is supplying power."
  },
  {
    "id": "power_disk_13",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are called to troubleshoot a desktop computer that suddenly turns off and does not power back on. Upon inspection, you notice that the LEDs on the front panel are not lit, and the fans are not spinning.\n\nWhat should be your next step to analyze and identify the potential cause of the power issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Remove the CPU and test it in another working system.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Immediately replace the power supply unit (PSU) with a new one.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check the UEFI/BIOS settings to ensure the power settings are configured correctly.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Test the wall socket by plugging in a known-good device, such as a lamp.",
        "isCorrect": true
      }
    ],
    "explanation": "Testing the wall socket helps determine if the issue is external to the computer, such as a faulty power outlet. This step is crucial to rule out external power supply issues before investigating internal components.\n\nReplacing the PSU without first verifying the power source is premature and may lead to unnecessary costs. It's important to confirm that the issue isn't with the external power supply before replacing internal components.\n\nIf the computer is not powering on at all, you cannot access the UEFI/BIOS settings. This step is irrelevant when the system shows no signs of receiving power.\n\nTesting the CPU in another system is a more advanced diagnostic step that should only be considered after simpler checks, such as verifying power supply and connections, have been performed. It is not directly related to initial power issues."
  },
  {
    "id": "power_disk_14",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "When troubleshooting boot issues, which of the following steps should you take if a fixed disk is not detected during the boot process?",
    "options": [
      {
        "id": "opt_a",
        "text": "Verify that the drive is powered and check for secure power connections.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Replace the motherboard immediately.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Reinstall the system firmware.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Check if the operating system is up to date.",
        "isCorrect": false
      }
    ],
    "explanation": "Ensuring that the drive is powered and that power connectors are secure is a crucial step in troubleshooting when a fixed disk is not detected. This addresses potential power issues that could prevent the drive from being recognized.\n\nChecking if the operating system is up to date is not relevant when a fixed disk is not detected during the boot process. The issue is more likely related to hardware connections or BIOS/UEFI settings rather than the operating system.\n\nReinstalling the system firmware is not a standard troubleshooting step for a fixed disk not being detected. This action is more drastic and typically unrelated to simple detection issues unless a firmware update has caused the problem.\n\nReplacing the motherboard is a significant step and should not be the first action taken when a fixed disk is not detected. This issue is often resolved by checking connections and settings rather than replacing major components."
  },
  {
    "id": "power_disk_15",
    "topic": "Power and Disk Issues",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a technician tasked with diagnosing a desktop computer that has been reported to frequently freeze and experience slow file access times.\n\nUpon investigation, you notice that the hard disk drive (HDD) is making unusual clicking noises.\n\nWhat is the MOST appropriate action to take to address the drive's reliability and performance issues?",
    "options": [
      {
        "id": "opt_a",
        "text": "Run a full system antivirus scan to check for malware affecting the HDD.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Replace the HDD with a new one and restore data from the latest backup.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Update the computer's BIOS/UEFI settings to ensure proper drive configuration.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Defragment the HDD to improve data access speed and performance.",
        "isCorrect": false
      }
    ],
    "explanation": "The symptoms of frequent freezing, slow file access, and unusual clicking noises suggest that the HDD is failing. Replacing the HDD and restoring data from a backup is the most appropriate action to ensure data integrity and resolve the reliability and performance issues.\n\nWhile malware can affect system performance, the symptoms described (frequent freezing, slow file access, and clicking noises) are more indicative of a physical hardware issue with the HDD rather than a software problem like malware.\n\nDefragmenting the HDD can improve performance in some cases, but it is not suitable for addressing hardware failure symptoms such as clicking noises. Defragmentation does not resolve physical issues with the drive.\n\nWhile ensuring correct BIOS/UEFI settings is important, it does not address the physical symptoms of a failing HDD, such as clicking noises and performance degradation. The issue is likely hardware-related, requiring drive replacement."
  },
{
  "id": "sdi_12",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "A technician is troubleshooting an issue with a computer. Although the computer is on the network, the server will not authenticate the user. What kind of problem does this indicate?",
  "options": [
    {
      "id": "opt_a",
      "text": "Overheating",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Inaccurate date/time",
      "isCorrect": true
    },
    {
      "id": "opt_c",
      "text": "Cabling issues",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "Disk failure",
      "isCorrect": false
    }
  ],
  "explanation": "If the computer does not correctly synchronize the date and time with other computers on the network, security systems such as authentication will not work.\n\nA hard disk drive (HDD) is most likely to fail due to mechanical problems either in the first few months of operation or after a few years.\n\nThe technician not securely connecting the cables at both ends, the cable has become stretched or crimped, or an incorrect cable specification may all cause cabling issues.\n\nUnusual odors, such as a burning smell or smoke, will almost always indicate that something (probably the power supply) is overheating."
},
{
  "id": "cpu_01",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "Since it has no moving parts, a CPU will usually work properly for several years. Which of the following is a common factor that might cause a CPU to fail prematurely?",
  "options": [
    {
      "id": "opt_a",
      "text": "High CPU usage",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Magnetic field",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "Electrostatic discharge (ESD)",
      "isCorrect": true
    },
    {
      "id": "opt_d",
      "text": "Electromagnetic interference",
      "isCorrect": false
    },
    {
      "id": "opt_e",
      "text": "Unsupported memory modules",
      "isCorrect": false
    }
  ],
  "explanation": "Electrostatic discharge (ESD) is a sudden flow of electricity between two electrically charged objects caused by contact or a short circuit. ESD can damage sensitive electronic components, including CPUs, by creating a high-voltage surge that can destroy or degrade the delicate circuits within the processor. While CPUs are designed to last several years under normal operating conditions, they are highly sensitive to ESD during handling or installation. For example, if a technician does not use proper grounding techniques (such as wearing an anti-static wrist strap), static electricity from their body can discharge into the CPU, causing irreparable damage. This is why ESD is a common factor that might cause a CPU to fail prematurely.\n\nWhile unsupported memory modules can cause system instability or prevent the system from booting, they do not directly cause physical damage to the CPU. The CPU itself is not likely to fail prematurely due to incompatible memory; instead, the system may simply not function correctly.\n\nHigh CPU usage does not inherently cause a CPU to fail prematurely. Modern CPUs are designed to handle high workloads and include thermal protection mechanisms, such as throttling or shutting down, to prevent overheating. However, sustained high usage without adequate cooling could lead to overheating, which might indirectly damage the CPU over time, but this is not as immediate or common as ESD.\n\nMagnetic fields generally do not affect CPUs because they are not magnetic storage devices. CPUs are made of silicon and other non-magnetic materials, so they are not susceptible to damage from magnetic fields in the same way that hard drives or other magnetic storage devices might be.\n\nElectromagnetic interference (EMI) can cause temporary disruptions in electronic signals and may lead to performance issues or data corruption. However, it does not typically cause permanent physical damage to a CPU. EMI is more of a concern for communication devices or systems with sensitive signal processing."
},
{
  "id": "cpu_02",
  "topic": "System and Display Issues",
  "type": "multiple",
  "requiredSelections": 2,
  "question": "You have just finished upgrading your desktop system's CPU. After running for about 15 minutes, the system spontaneously shuts down.\n\nWhich steps should you take FIRST to begin troubleshooting the issue? (Select two.)",

    },
    {
      "id": "opt_b",
      "text": "Make sure that you used thermal paste for the CPU.",
      "isCorrect": true
    },
    {
      "id": "opt_c",
      "text": "Remove any unnecessary components and run the system.",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "Check the power supply voltage switch.",
      "isCorrect": false
    },
    {
      "id": "opt_e",

    }
  ],
  "explanation": "After upgrading a CPU, one of the most critical components for its proper functioning is the cooling system. If the CPU fan is not powered or functioning correctly, the processor can quickly overheat, leading to spontaneous shutdowns as a protective measure. Ensuring that the CPU fan's power cable is securely connected and that the fan is operational is a crucial first step in troubleshooting overheating issues. A non-functional fan can cause the CPU to reach unsafe temperatures within minutes, triggering the system to shut down to prevent damage.\n\nThermal paste is essential for effective heat transfer between the CPU and the heat sink. Without thermal paste, the heat generated by the CPU cannot be efficiently dissipated, leading to overheating and system shutdowns. Ensuring that thermal paste was applied correctly during the CPU installation is another critical step in diagnosing and resolving overheating issues. If the paste was not applied or was applied improperly, the CPU will not be adequately cooled, even if the fan is working.\n\nWhile a faulty power supply can cause system instability or shutdowns, it is not the most likely cause in this scenario. The issue described (shutdown after 15 minutes) strongly suggests an overheating problem rather than a power supply issue. Replacing the power supply should only be considered after ruling out more common causes like overheating.\n\nThe power supply voltage switch is used to set the input voltage (e.g., 110V or 220V) based on the region's electrical standards. If this switch were set incorrectly, the system would likely fail to power on at all or exhibit immediate instability. Since the system runs for 15 minutes before shutting down, this is not a likely cause of the issue.\n\nRemoving unnecessary components is a general troubleshooting step to isolate hardware issues. However, in this scenario, the problem is clearly related to the CPU upgrade, making this step unnecessary at this stage. The focus should be on diagnosing the CPU and its cooling system first."
},

{

  "topic": "System and Display Issues",

{

  "topic": "System and Display Issues",

  "question": "When diagnosing performance issues in a computer system, which of the following steps is crucial to ensure that overheating is not the cause of the problem?",

    },
    {
      "id": "opt_b",

      "isCorrect": false
    },
    {

      "text": "Rule out operating system and application issues.",
      "isCorrect": false
    }
  ],
  "explanation": "Monitoring temperature sensors and fan speeds is directly related to diagnosing overheating issues. High temperatures can cause components to throttle performance to prevent damage, making this step crucial in identifying overheating as a potential cause of performance problems.\n\nWhile verifying component compatibility is important for diagnosing performance issues, it specifically addresses misconfigurations that might occur after a new build or upgrade. It does not directly relate to checking for overheating.\n\nUsing diagnostic tests to compare CPU performance against known baselines is useful for verifying the problem and isolating performance issues to specific subsystems. However, it does not specifically address overheating, which requires monitoring temperature and cooling systems.\n\nRuling out software and configuration issues is important for diagnosing performance problems, but it does not specifically address overheating. This step focuses on ensuring that the problem is not software-related before assuming a hardware issue."
},
{
  "id": "sys_03",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "A user reports that their computer is running sluggishly after a recent upgrade. As an IT specialist, you need to evaluate the situation to determine the most likely cause.\n\nWhich of the following actions would BEST help you assess whether the sluggish performance is due to a hardware bottleneck?",
  "options": [

      "text": "Check for overheating by monitoring temperature sensors and fan speeds.",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Rule out software and configuration issues by checking for faulty network login scripts.",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "Use diagnostic tests to compare the system's performance against known baselines.",
      "isCorrect": true
    },
    {
      "id": "opt_d",
      "text": "Verify the compatibility of the new components with the motherboard.",

  "explanation": "Using diagnostic tests to compare the system's performance against known baselines directly evaluates the system's performance by comparing it to known baselines, helping to identify if a specific component is underperforming and causing a bottleneck. It provides a quantitative assessment of the system's capabilities.\n\nWhile checking for overheating is important, it primarily addresses thermal issues rather than directly evaluating whether a hardware bottleneck is causing sluggish performance. Overheating can lead to throttling but it does not specifically identify a bottleneck.\n\nEnsuring compatibility is crucial to prevent misconfigurations, but it does not directly evaluate the system's current performance against expected standards. Compatibility checks are more preventive than evaluative in nature.\n\nWhile ruling out software issues is necessary, this step focuses on eliminating non-hardware causes of sluggishness. It does not evaluate the hardware's performance or identify bottlenecks within the system's components."
},
{
  "id": "disp_01",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "A customer complains that a recently purchased monitor no longer displays a picture. You verify that the monitor is powered on and that the video cable is securely fastened to the video port.\n\nWhich of the following actions is the BEST to take next?",
  "options": [
    {
      "id": "opt_a",
      "text": "Check the brightness and contrast settings using the monitor's controls.",
      "isCorrect": true
    },
    {
      "id": "opt_b",
      "text": "Return the monitor to the manufacturer.",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "Unload and then reload the video card's software driver.",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "Open the computer and switch the video card to a different slot.",
      "isCorrect": false
    }
  ],
  "explanation": "When troubleshooting a monitor that no longer displays a picture, it is important to start with the simplest and most accessible solutions before moving on to more complex or invasive steps. In this case, checking the brightness and contrast settings using the monitor's on-screen controls is the best next step. Sometimes, the brightness or contrast may have been accidentally adjusted to a level where the screen appears blank or too dim to see. This is a common and easily overlooked issue that can be resolved quickly without requiring any hardware changes or software adjustments. Additionally, the monitor's controls can also help verify if the monitor is functioning properly by allowing you to navigate its on-screen display (OSD) menu.\n\nReturning the monitor to the manufacturer should only be considered as a last resort after all troubleshooting steps have been exhausted. Since the issue could be something as simple as incorrect brightness or contrast settings, returning the monitor at this stage would be premature and unnecessary.\n\nOpening the computer and switching the video card to a different slot is a more advanced troubleshooting step that is not appropriate at this stage. The issue may not even be related to the video card, and such an action could introduce additional variables or risks (e.g., damaging components). It is better to rule out simpler causes, such as monitor settings, before attempting hardware changes.\n\nReloading the video card's driver is a software troubleshooting step that is more relevant if the issue is determined to be related to the video card or its driver. However, since the monitor itself is not displaying a picture, it is more logical to first verify the monitor's settings and functionality before addressing potential software issues."
},
{

{

},
{
  "id": "sdi_11",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "A company employee reports that their computer, which was recently upgraded with additional RAM and a new SSD, is still experiencing sluggish performance. As an IT analyst, you need to determine the underlying cause of the issue.\n\nWhich of the following analyses would BEST help you identify the root cause of the sluggish performance?",

},
{
  "id": "sys_04",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "After working without problems for a couple of years, your computer has begun to lock up. You suspect that it is a thermal issue, but you can't find any component that is not functioning correctly.\n\nYou have not replaced the CPU or installed any new devices. The CPU cooling fan and the power supply fan are working properly. The lock-ups are happening with increasing frequency.\n\nWhich of the following is the MOST common condition that explains these symptoms?",
  "options": [
    {
      "id": "opt_a",
      "text": "An accumulation of dust has gradually built up.",
      "isCorrect": true
    },
    {
      "id": "opt_b",
      "text": "The internal temperature sensor is beginning to malfunction intermittently.",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "The power supply has been switched to the wrong voltage setting.",
      "isCorrect": false
    },
    {
      "id": "opt_d",
      "text": "The BIOS has never been flashed and has gotten more and more out of date.",
      "isCorrect": false
    }
  ],
  "explanation": "Over time, an accumulation of dust can gradually build up and cause significant overheating (which results in lock-ups) by constricting airflow through the system case. Vent holes and heat sinks can become clogged with dust, which prevents heat dissipation. Remove the dust with compressed air or with an anti-static vacuum.\n\nYou should always flash the BIOS when firmware updates become available, but failing to do so will not lead to the system overheating.\n\nSwitching the power supply to the wrong voltage can damage system components, but this would not lead to the system locking up more frequently over time. The damage would happen immediately.\n\nA malfunctioning heat monitor could cause the system to lock up, but the frequency is likely to be intermittent, not consistently increasing."
},
{

{

},
