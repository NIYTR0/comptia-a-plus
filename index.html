      }
    ],
    "explanation": "Modular PSU incorporates connectors on the PSU and component ends of the power cables. ATX12V, ATC, and Redundant PSU do not explicitly include an option to remove unnecessary connectors."
  },
  {
    "id": "psu_13",
    "topic": "Power Supplies and Cooling",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "You have a motherboard that uses a 24-pin ATX connector.\nWhich types of power supply could you use with this motherboard? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "A power supply with a 20-pin ATX and a Molex connector",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "A power supply with a 24-pin ATX connector only",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "A power supply with a 20-pin ATX and a +4-pin connector",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "A power supply with a 20-pin ATX and a 6-pin connector",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "A power supply with a 20-pin ATX connector only",
        "isCorrect": false
      }
    ],
    "explanation": "In this case, the motherboard needs either a 24-pin ATX connector or a 20-pin ATX and a +4-pin connector.\n\nWhen selecting a power supply, make sure it includes the necessary connectors for your motherboard. Some motherboards and processors require an extra 4-pin and/or 8-pin connector in addition to the main 20- or 24-pin power connector.\n\nA Molex connector is used by legacy components (such as IDE hard drives and PATA optical drives), case fans, and other accessory devices.\n\nA 6-pin connector is used for video cards."
  },
  {
    "id": "psu_14",
    "topic": "Power Supplies and Cooling",
    "type": "multiple",
    "requiredSelections": 3,
    "question": "Which of the following will ensure optimal system cooling? (Select three.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Remove the side panel on the case.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Keep the ambient temperature below 80 degrees F.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Leave space between the case and any walls or obstructions.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Bundle cables together and secure unused cables to the case.",
        "isCorrect": true
      },
      {
        "id": "opt_e",
        "text": "Stack hard drives next to each other.",
        "isCorrect": false
      },
      {
        "id": "opt_f",
        "text": "Remove unused expansion slot covers to increase airflow.",
        "isCorrect": false
      }
    ],
    "explanation": "Consider the following recommendations to ensure optimal system cooling:\nKeep the case free of dust and debris. Excess dust can restrict airflow and prevent proper heat transfer.\nReduce the number of airflow obstructions. Employ proper cable management (bundle cables together and secure unused cables to the case). Space out multiple hard disk drives instead of stacking them next to each other.\nMaintain appropriate ambient temperatures. Optimal ambient temperatures are between 60 and 80 degrees Fahrenheit.\nEnsure proper ventilation; leave space between the computer and any walls or desks.\nPreserve negative pressure inside the case by keeping all covers and shields installed (unused expansion cards, I/O shield, front drive bays)."
  },
  {
    "id": "psu_15",
    "topic": "Power Supplies and Cooling",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have a desktop computer that you want to upgrade. You add several internal and external components. You realize that you need to ensure that your power supply can support these new components.\nWhich of the following power supply ratings BEST describes the rating you would use to determine this?",
    "options": [
      {
        "id": "opt_a",
        "text": "Watt rating",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "DC voltage rating",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "AC voltage rating",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Resistance rating",
        "isCorrect": false
      }
    ],
    "explanation": "The number of devices a power supply can support is directly related to the number of watts that the power supply is rated for. A power supply's watt rating determines its maximum power output.\n\nAC and DC voltage are a measure of electrical pressure and are not directly related to the number of supportable devices. The voltage is dependent on the voltage of the wall outlet, and the voltage switch on the power supply should match the outlet's voltage. 115 is used in the United States, while 230 is typically used in Europe.\n\nResistance is a measure of how much an electrical device reduces the electrical current flowing through it."
  },
{
    "id": "storage_01",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "What distinguishes SD Express cards from earlier versions of SD cards?",
    "options": [
      {
        "id": "opt_a",
        "text": "They are only compatible with devices using USB interfaces",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "They have a maximum capacity of 32 GB",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "They are only available in the original SD format with speeds up to 25 MBps",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "They offer much higher speeds",
        "isCorrect": true
      }
    ],
    "explanation": "SD Express cards stand out because they use PCIe and NVMe interfaces, allowing for significantly higher speeds of up to 985 MBps compared to earlier versions. They are not limited to USB interfaces or small capacities; instead, they offer improved performance and capacity options. The original SD format only supported speeds up to 25 MBps, which is much slower than SD Express."
  },
  {
    "id": "storage_02",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following drive configurations uses striping with parity for fault tolerance?",
    "options": [
      {
        "id": "opt_a",
        "text": "RAID 0",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "RAID 1",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "RAID 10",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "RAID 5",
        "isCorrect": true
      }
    ],
    "explanation": "RAID 5 uses disk striping, but provides fault tolerance for a single disk failure. Disk striping breaks data into units and stores the units across a series of disks by reading and writing to all disks simultaneously.\n\nRAID 0 uses disk striping and offers no fault tolerance. A failure of one disk in the set means that all data is lost.\n\nRAID 1 provides fault tolerance, but does not use striping.\n\nA RAID 10 array nests a mirrored array within a striped array."
  },
  {
    "id": "storage_03",
    "topic": "Storage Devices",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "You are in the process of purchasing several new Windows-based computers to replace broken or outdated computers. You have heard that solid-state drives (SSDs) can significantly increase systems' overall performance.\nWhich of the following BEST describe the features of solid-state drives (SSDs) compared to hard disk drives (HDDs)? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "An SSD opens files faster than an HDD.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "An SSD uses flash technology to store data.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "SSD spindles move at a faster rate than those of an HDD.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "An SSD can be adversely affected by magnetism.",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "An SSD cheaply stores a large amount of data.",
        "isCorrect": false
      }
    ],
    "explanation": "A solid-state drive is a flash device with a storage capacity similar to that of a small hard drive. Solid-state drives are used as replacements for hard disk drives and store operating systems, application, and data files.\n\nSolid-state drives have several advantages. They:\n* Are faster than hard drives.\n* Have no moving parts.\n* Have lower power consumption than hard drives (which is good for laptops).\n* Are less susceptible to physical damage and are immune to magnetic field damage.\n* Are smaller and lighter than hard drives.\n\nThe main disadvantage to solid-state drives is cost. They are several times more expensive than comparable hard drives. However, their advantages make them a good choice in many situations, especially for portable devices."
  },
  {
    "id": "storage_04",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "One of your customers wants you to build a personal server that he can use in his home. One of his concerns is making sure that he has at least one data backup stored on the server in the event that a disk fails. You have decided to back up his data using RAID.\nSince this server is for personal use only, the customer wants to keep costs down. Therefore, he would like to keep the number of drives to a minimum.\nWhich of the following RAID systems would BEST meet the customer's specifications?",
    "options": [
      {
        "id": "opt_a",
        "text": "RAID 1",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "RAID 0",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "RAID 5",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "RAID 10",
        "isCorrect": false
      }
    ],
    "explanation": "RAID 1 protects memory from a single disk failure and provides high-read performance. RAID 1 also only requires a minimum of two disks. RAID 5 would also protect data from a single disk failure but requires a minimum of three disks, and RAID 10 requires a minimum of four disks."
  },
  {
    "id": "storage_05",
    "topic": "Storage Devices",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "You want to create a high-performance Windows laptop with both a 2-TB hard drive and a 1-TB SSD drive.\nWhich of the following are data storage recommendations for your high performance system? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Store heavily used information on the SSD drive.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Automatically back up important data on the hard drive to the SSD drive.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Store data that requires high performance on the SSD drive.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Store data that requires high performance on the hard drive.",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "Store heavily used information on the hard drive.",
        "isCorrect": true
      }
    ],
    "explanation": "For your high-performance system, you should adhere to the following data storage recommendations:\n* Store heavily used information on the standard hard disk drive.\n* Store high-performance data on the SSD drive.\nAs a final recommendation, you should automatically back up important data on the SSD drive to the hard drive."
  },
  {
    "id": "storage_06",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have an existing computer running Windows 11. You want to configure a RAID 1 array in the computer. You install two new SATA drives and then use the RAID controller integrated in the motherboard to define a RAID 1 array using both drives.\nWhen you boot the computer, Windows does not show the logical RAID drive. What should you do?",
    "options": [
      {
        "id": "opt_a",
        "text": "Set the jumpers on the drives to use SATA I mode.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Install the driver for the RAID controller.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "In the BIOS, change the SATA disk mode to RAID.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "In the BIOS, change the SATA disk mode to AHCI.",
        "isCorrect": false
      }
    ],
    "explanation": "You must install the RAID driver so that Windows recognizes arrays created by the motherboard RAID utility. Without the driver, Windows will not be able to see the logical drive defined by the array.\n\nWhen you define the array, you configure the BIOS to use RAID as the SATA type. If you had not completed this step, you would not be able to run the RAID configuration utility.\n\nYou use AHCI to configure SATA drives to support hot swapping.\n\nSetting the jumpers is designed to help older drives work smoothly with newer equipment by limiting the data transfer rate. There are no jumpers on newer hard drives (manufactured after 2002)."
  },
  {
    "id": "storage_07",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which Blu-ray standard defines rewritable discs?",
    "options": [
      {
        "id": "opt_a",
        "text": "BD-R",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "BD-R/RW",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "BD-ROM",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "BD-RE",
        "isCorrect": true
      }
    ],
    "explanation": "BD-RE is the Blu-ray standard that defines rewritable discs.\n\nBD-ROM is the read-only standard, and BD-R is the recordable standard.\n\nR/RW is used to designate rewritable CD and DVD discs, not Blu-ray discs."
  },
  {
    "id": "storage_08",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have configured Disk 3 and Disk 4 on your Windows 11 workstation as a RAID 1 array with the NTFS file system, and you have assigned F as the drive letter for the array. Each disk has an individual storage capacity of 1 TB.\nHowever, when you check the available storage size of F, you notice that it only lists 1 TB (instead of 2 TB) of available disk storage space. What should you do to resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Change the volume to a spanned volume.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Make sure both disks are set to dynamic instead of basic.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "You need to change to a RAID 5 array.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Nothing. The RAID array is working as designed.",
        "isCorrect": true
      }
    ],
    "explanation": "You do not need to do anything. A RAID 1 array provides mirroring, which means that the same data is available on both disks. This means that the total size of the volume is equal to just the size of one of the disks in the array. In this case, the total volume size is still 1 TB, even though each disk is capable of storing 1 TB.\n\nYou change the format of the disks from basic to dynamic before creating the RAID array.\n\nA RAID 5 array requires three disks, not two. In addition, you can't create a RAID 5 array on a Windows workstation. You can only do this on server versions of Windows.\n\nWhile a spanned volume spans across multiple hard disk drives (much like a RAID volume), it is not a RAID method. A spanned volume simply glues two disks together to create a volume without any redundancy or performance improvement."
  },
  {
    "id": "storage_09",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which storage device uses aluminum platters for storing data?",
    "options": [
      {
        "id": "opt_a",
        "text": "SD card",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "DVD disc",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "CD-ROM disc",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Hard disk",
        "isCorrect": true
      },
      {
        "id": "opt_e",
        "text": "DLT tape",
        "isCorrect": false
      }
    ],
    "explanation": "Hard disks use magnetic disks and platters.\n\nOptical drives, such as DVD or CD-ROM drives, use a reflective surface that is read by an optical reader.\n\nFlash devices, such as SD cards, store information using programmable non-volatile flash memory.\n\nDLT drives use magnetic tape."
  },
  {
    "id": "storage_10",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is an advantage of RAID 5 over RAID 1?",
    "options": [
      {
        "id": "opt_a",
        "text": "RAID 5 improves performance over RAID 1.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "RAID 5 provides redundancy for the disk controller.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "RAID 5 provides redundancy; RAID 1 does not.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "RAID 5 continues to operate with a failure in two disks. RAID 1 can only operate with a failure of one disk.",
        "isCorrect": false
      }
    ],
    "explanation": "RAID 5 provides both fault tolerance and improved performance. RAID 1 (utilizing mirroring) provides only fault tolerance with no performance benefit. Both RAID 5 and RAID 1 can only sustain a loss of one disk in the set. Use multiple disk controllers to provide redundancy for the disk controller."
  },
  {
    "id": "storage_11",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a sales representative for a large pharmaceutical company. You often want to share information from your laptop quickly with customers during onsite visits.\nWhich of the following storage media would BEST allow you to quickly and inexpensively share your files with the customers?",
    "options": [
      {
        "id": "opt_a",
        "text": "HDD drive",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "SDHC memory card",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "SSD drive",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Flash drive",
        "isCorrect": true
      }
    ],
    "explanation": "A flash drive (sometimes called a thumb drive) uses flash memory to permanently store data on flash memory chips. You can plug a flash drive into the appropriate port (such as a USB port) on a PC and have it function as a standard hard drive. In this scenario, you would simply plug it externally into your laptop, copy the files, and then leave it with the customer to copy to their own device.\n\nWhile an SSD drive can act as an external drive, an SDD drive is much more expensive than a flash drive and would not be practical to leave with the customer.\n\nWhile you normally install an HDD drive on a PC, an HDD drive can be housed for external access as well. However, it would be a very expensive solution compared to simply leaving a flash drive with the customer.\n\nWhile an SDHC memory card might be a solution, it would only work if the customer had a PC with a memory card reader. The flash drive uses a USB connector, which is a much more universal method of connecting to a PC or other portable computing device."
  },
  {
    "id": "storage_12",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are configuring a new system, and you want to use a RAID 0 array for the operating system using SATA disks and a special controller card that includes a RAID processor.\nWhich RAID method should you use?",
    "options": [
      {
        "id": "opt_a",
        "text": "Software",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Operating system",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "JBOD",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Hardware",
        "isCorrect": true
      }
    ],
    "explanation": "Hardware RAID uses a special controller card that includes a RAID processor. While it is the most expensive RAID method, it provides much better performance and is more reliable than other methods.\n\nSoftware RAID uses a driver and the system CPU for controlling RAID operations. While some RAID controller cards support RAID configuration, they do not have an onboard RAID processor and are classified as software RAID.\n\nOperating system RAID uses RAID features within the operating system. Like software RAID, the system CPU is used for RAID operations.\n\nJBOD (Just a Bunch of Disks) is a spanned volume."
  },
  {
    "id": "storage_13",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You work for a small company as the human resources specialist. Since the company is fairly small, you are maintaining all of the employee information on your desktop computer, which is running Windows 11. This computer has two high-capacity hard disks. You want to ensure that this information is protected from a hard disk failure, so you want to set up a Windows software RAID system.\nWhich of the following would be your BEST solution?",
    "options": [
      {
        "id": "opt_a",
        "text": "Use striped volumes.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Use RAID 5 volumes.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Use spanned volumes.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Use mirrored volumes.",
        "isCorrect": true
      }
    ],
    "explanation": "A Windows software RAID system can be configured on Windows 11 using the Windows Disk Management tool. Of the available options from within Disk Management, you would need to configure a mirrored volume to protect your data from a disk failure. Disk mirroring requires two available drives with sufficient storage. Once configured, the data written to a mirrored volume is duplicated to both drives. This duplication, or mirroring, means that if one of the mirrored drives fails, all of the data can still be retrieved from the remaining good drive.\n\nA spanned volume is a dynamic volume consisting of disk space on more than one physical disk. This method does not duplicate the data. If a spanned volume drive fails, the data is lost.\n\nA striped volume uses the free space on more than one physical hard disk to create a bigger volume (similar to a spanned volume). However, a striped volume writes across all volumes in the stripe in small blocks, distributing the load across the disks in the volume. In other words, when a single file is written, some of the file will be on one disk, and the rest of the file will be on another. This makes writing files faster. It does not, however, protect the data in the event of a disk failure.\n\nRAID 5 requires more than two disks."
  },
  {
    "id": "storage_14",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You want to create a software RAID 1 array on your Windows 11 workstation using Disk 1 and Disk 2.\nWhat do you need to do with Disk 1 and Disk 2 before configuring them for a RAID 1 array?",
    "options": [
      {
        "id": "opt_a",
        "text": "Format both disks with the same file system.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Convert the disks from basic to dynamic.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Convert the disks from dynamic to basic.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Verify that both disks are the same size.",
        "isCorrect": false
      }
    ],
    "explanation": "You can only use dynamic disks to create a software RAID array in Windows. Therefore, you need to convert Disk 1 and Disk 2 (using the Disk Management tool) from basic disks to dynamic disks.\n\nWith RAID 1, you write redundantly on both disks. If the disks are not the same size, the mirroring is limited to the size on the smaller disk. However, this does not impact preparing the disks for use in a RAID 1 array.\n\nWhile it's important to configure the disks with a file system, this step is part of configuring the RAID 1 software array. You do not need to do this before the configuration process."
  },
  {
    "id": "storage_15",
    "topic": "Storage Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are building a new computer that will contain two hard disks. To provide increased performance, you have decided to configure the drives using RAID technology.\nWhich of the following will BEST meet your needs?",
    "options": [
      {
        "id": "opt_a",

      },
      {
        "id": "opt_b",

      },

        "id": "opt_d",

  },
{
    "id": "mem_01",
    "topic": "System Memory",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "Which of the following are true when working with dual-, triple-, and quad-channel memory module sets? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "You can mix modules with different capacities within a set.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "You must install modules in matching sets (capacity and speed).",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "You need to install memory modules next to each other in a set.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "You should use the same capacity modules for a set.",
        "isCorrect": true
      },
      {
        "id": "opt_e",
        "text": "You can assign memory slots to memory modules in BIOS/UEFI.",
        "isCorrect": false
      }
    ],
    "explanation": "The memory modules within a set must be exactly the same in capacity and speed configuration, preferably from the same manufacturer and the same model.\n\nYou need to install memory modules in the slots specified in the motherboard documentation. Normally, the modules in a set are spaced one slot apart (such as slots 1 and 3).\n\nWhile you can configure some memory parameters in BIOS/UEFI, you cannot re-assign memory slots to memory modules in BIOS/UEFI."
  },
  {
    "id": "mem_02",
    "topic": "System Memory",
    "type": "single",
    "requiredSelections": 1,
    "question": "You notice your applications are loading and running slowly when you switch between them. You also notice that your hard disk drive light is constantly lit.\nWhich of the following is the BEST option to stop this problem from happening frequently on your system?",
    "options": [
      {
        "id": "opt_a",
        "text": "Configure a larger paging file on the HHD.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Install more physical RAM.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Reboot the system at the first indication of the problem.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Install a larger CPU.",
        "isCorrect": false
      }
    ],
    "explanation": "The hard disk driver staying lit constantly, applications loading slowly, and applications running slowly are symptoms of disk thrashing. The recommended fix for disk thrashing is to install more physical RAM.\n\nRebooting the system will not fix a disk thrashing problem.\n\nInstalling a larger CPU will not fix a disk thrashing problem.\n\nConfiguring a larger paging file on the HHD will improve the performance of the virtual memory but will not prevent disk thrashing. If you have inadequate physical RAM for what you are continuously using your system for, the kernel will constantly swap, which will cause disk thrashing. So installing more physical RAM would be the best choice."
  },
  {
    "id": "mem_03",
    "topic": "System Memory",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the primary way that DDR2, DDR3, DDR4, and DDR5 memory improve performance over earlier DDR versions?",
    "options": [
      {
        "id": "opt_a",
        "text": "By increasing the memory clock speed",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "By using smaller memory modules to improve heat dissipation",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "By multiplying the bus speed to allow higher bandwidth",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "By reducing the number of memory cells required for data storage",
        "isCorrect": false
      }
    ],
    "explanation": "DDR2 and subsequent DDR generations improve performance by multiplying the bus speed, which enhances bandwidth without increasing memory device speed to the point of overheating or instability. Simply increasing the memory clock speed or reducing module size alone would not achieve the same scalable performance improvements. Reducing memory cells would decrease capacity, not enhance performance."
  },
  {
    "id": "mem_04",
    "topic": "System Memory",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "What are the advantages of DDR4 over DDR3, assuming the same operating frequency? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "DDR4 doubles the data transfer rate of DDR3.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "DDR4 includes a buffer between the data bus and the memory.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "DDR4 accepts four consecutive 64-bit words per bus clock cycle.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "DDR4 accepts sixteen consecutive 64-bit words per bus clock cycle.",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "DDR4 uses less power than DDR3.",
        "isCorrect": true
      }
    ],
    "explanation": "DDR4 doubles the data transfer rate of DDR3 and generally requires less voltage than DDR3 memory.\n\nDDR4 accepts eight consecutive 64-bit words per bus clock cycle, the same as found in DDR3.\n\nDDR3 and DDR4 memory include a buffer between the data bus and the memory."
  },
  {
    "id": "mem_05",
    "topic": "System Memory",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are trying to push a memory module into a memory slot, but it is not seating properly.\nWhat is the MOST likely issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "You are trying to install a single-sided memory module in a double-sided slot.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "You need to clear debris from the memory slot.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "You need to push down the slot tabs and move them back.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "You are trying to install the memory module backward in the memory slot.",
        "isCorrect": true
      }
    ],
    "explanation": "Most memory is keyed to prevent it from being installed backward or in incompatible slots. In this scenario, the most likely issue is that you are trying to install the memory module backward in the memory slot.\n\nThere are no memory slots that are specific to single-sided or double-sided memory modules.\n\nAn empty slot normally has the slot tabs pushed down and back.\n\nWhile there may be some debris in a memory slot, this is not likely the cause."
  },
  {
    "id": "mem_06",
    "topic": "System Memory",
    "type": "single",
    "requiredSelections": 1,
    "question": "How is the peak transfer rate for DDR-200 (PC1600) calculated?",
    "options": [
      {
        "id": "opt_a",
        "text": "By halving the data rate to account for transfer delays",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "By multiplying the data rate (200 MT/s) by 8 bytes per transfer",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "By using the clock speed of the memory bus only",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "By multiplying the clock speed by the system memory capacity",
        "isCorrect": false
      }
    ],
    "explanation": "The peak transfer rate for DDR-200 (PC1600) is calculated by multiplying the data rate, which is 200 MT/s, by 8 bytes per transfer, resulting in 1600 MBps. This approach uses the data rate and transfer size rather than just clock speed, system memory capacity, or adjusting for delays."
  },
  {
    "id": "mem_07",
    "topic": "System Memory",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following is simulated memory that is created through a paging file on the hard drive?",
    "options": [
      {
        "id": "opt_a",
        "text": "Virtual memory",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "RAM",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Disk thrashing",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "VMM",
        "isCorrect": false
      }
    ],
    "explanation": "Virtual memory is simulated memory that is created through a paging file on the hard drive.\n\nDisk thrashing is when the amount of physical memory is so low that data must constantly be moved from physical RAM to disk and back again.\n\nRAM stands for random access memory, which is a system's physical memory.\n\nVMM is the Virtual Memory Manager, which is the utility in charge of swapping data between physical memory and the hard disk."
  },
  {

  },
  {
    "id": "mem_09",

    "explanation": "Enabling dual-channel mode may require activation in the system setup program within the PC's firmware. Simply replacing memory slots or using mismatched modules would not enable dual-channel and could reduce performance. Modules with higher timings do not inherently improve stability and may impact performance negatively."

  {

{
    "id": "cpu_01",
    "topic": "CPUs",
    "type": "single",
    "requiredSelections": 1,
    "question": "What must be true for device drivers in a 64-bit operating system?",
    "options": [
      {
        "id": "opt_a",
        "text": "They must be written specifically for 64-bit systems.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "They are no longer required for hardware devices.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "They can be shared between 32-bit and 64-bit operating systems.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "They are automatically compatible with all modern hardware.",
        "isCorrect": false
      }
    ],
    "explanation": "Device drivers must be written specifically for 64-bit systems to function properly in a 64-bit operating system. The architecture of the operating system determines the compatibility requirements for device drivers, and a 64-bit OS requires drivers compiled for 64-bit. The concept that drivers can be shared between 32-bit and 64-bit systems is incorrect, as driver architecture must match the OS. The option about automatic compatibility with modern hardware is false, as drivers must still be tailored for specific hardware. Lastly, the option stating that drivers are no longer required is incorrect because they remain critical for hardware-software communication."
  },
  {
    "id": "cpu_02",
    "topic": "CPUs",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following central processing unit (CPU) architectures implement a system-on-chip (SoC) where all the controllers, including video, sound, networking, and storage, are part of the CPU?",
    "options": [
      {
        "id": "opt_a",
        "text": "x86",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "x64",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "ARM",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "IA-32",
        "isCorrect": false
      }
    ],
    "explanation": "ARM is considered a System on Chip (SoC) because it integrates a CPU along with other essential components, such as memory, input/output controllers, and sometimes GPUs, all on a single chip. This integration allows ARM-based SoCs to deliver efficient performance in compact, power-saving designs, commonly used in smartphones and embedded systems."
  },
  {
    "id": "cpu_03",
    "topic": "CPUs",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is a key advantage of ARM-based processors in mobile devices compared to x86/x64 processors?",
    "options": [
      {
        "id": "opt_a",
        "text": "They offer higher performance-per-watt, improving battery life.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "They execute complex tasks more quickly due to the CISC architecture.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "They require fewer software modifications for compatibility.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "They integrate fewer components, reducing the motherboard size.",
        "isCorrect": false
      }
    ],
    "explanation": "ARM processors offer higher performance-per-watt, which improves battery life and is ideal for mobile devices. ARM's power efficiency is a crucial factor in mobile applications, providing longer battery life and enabling fanless designs. The option stating that ARM uses CISC architecture is incorrect, as its efficiency comes from its RISC-based design. The option claiming that ARM requires fewer software modifications is inaccurate, as software must often be recompiled or emulated for compatibility. Additionally, the idea that ARM integrates fewer components is false because its SoC design combines multiple functionalities, reducing hardware size and complexity."
  },
  {
    "id": "cpu_04",
    "topic": "CPUs",
    "type": "single",
    "requiredSelections": 1,
    "question": "You work at a computer repair store. You just upgraded the processor (CPU) in a customer's computer. The computer starts, but it locks up shortly after starting Windows.\nWhich of the following is MOST likely causing the computer to automatically shut down?",
    "options": [
      {
        "id": "opt_a",
        "text": "The CPU is bad.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "The computer has a virus.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "The fan is not running.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "The CPU is not supported by the BIOS.",
        "isCorrect": false
      }
    ],
    "explanation": "Today, most computers are designed to turn off automatically if inner components overheat. In this case, the fan is probably not running. You might have forgotten to connect the power connector for the fan to the motherboard.\n\nIf the CPU were bad or not supported, the computer would most likely not boot to the operating system.\n\nAlthough a virus could cause this symptom, the computer was not shutting down before you ever worked on it. Since you did not need to connect to the internet to upgrade the CPU, a virus is an unlikely cause."
  },
  {
    "id": "cpu_05",
    "topic": "CPUs",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have just installed a new CPU in your workstation along with a CPU heat sink and fan.\nWhich of the following should you do next as a best practice?",
    "options": [
      {
        "id": "opt_a",
        "text": "Ensure that the CPU and motherboard socket type match.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Verify that the motherboard supports the processor speed.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Connect the fan's power supply.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Update the UEFI after installing the processor.",
        "isCorrect": false
      }
    ],
    "explanation": "As a best practice, connecting the fan's power supply is the next step you should complete to ensure the cooling system functions properly and prevent the CPU from overheating when the system is powered on.\n\nEnsuring that the CPU and motherboard socket type match is a step that you should complete before you install the CPU.\n\nVerifying that the motherboard supports the processor speed is another step that you should complete before you install the CPU.\n\nSometimes updating the UEFI/BIOS after installing a processor is required, but it is not always the immediate next step."
  },
  {
    "id": "cpu_06",
    "topic": "CPUs",
    "type": "single",
    "requiredSelections": 1,
    "question": "A software developer is creating an application that will run multiple parallel threads through the central processing unit (CPU) at the same time to reduce the amount of \"idle time\" the CPU spends waiting for new instructions to process. What type of process is the developer taking advantage of?",
    "options": [
      {
        "id": "opt_a",
        "text": "Multi-core",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Multi-socket",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Multithreading",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Processor extensions",
        "isCorrect": false
      }
    ],
    "explanation": "Multithreading allows a CPU to work on multiple tasks concurrently, such as performing calculations while simultaneously waiting for data from a network request. This overlapping of tasks keeps the CPU busy and minimizes idle time, leading to more efficient program execution."
  },
  {
    "id": "cpu_07",
    "topic": "CPUs",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are installing an Intel Core processor into a motherboard. Which socket type are you most likely using?",

      },
      {

  },
  {
    "id": "cpu_08",
    "topic": "CPUs",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "You have been using the same computer for several years. To improve performance, you decide to upgrade the processor. You check the motherboard documentation and purchase the fastest processor that is supported by the motherboard. However, when you try to start the computer, it beeps regularly, and nothing is displayed on the screen.\nWhich of the following actions will MOST likely resolve this issue? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Press F8 while booting the computer.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Reinstall the old processor in the motherboard.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Flash the UEFI firmware.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Replace the CPU with a new one.",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "Replace the motherboard.",
        "isCorrect": false
      }
    ],
    "explanation": "Flashing the BIOS or UEFI firmware is often required to upgrade system components, such as upgrading to a faster processor. If the motherboard documentation lists the processor as supported, but the processor is not correctly recognized, updating the BIOS or UEFI firmware to the latest version might fix the problem. Before you can do this, you must reinstall the old processor in the system to get the system back up and running again.\n\nOnly replace the CPU if you have determined that the CPU is faulty.\n\nPressing F8 while booting the system displays the advanced boot menu on older versions of Windows.\n\nReplacing the motherboard is probably not required because the motherboard was working correctly with the older CPU, and the documentation indicates that the new CPU is compatible."
  },
  {
    "id": "cpu_09",
    "topic": "CPUs",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following refers to placing two or more processors in a single processor chip?",
    "options": [
      {
        "id": "opt_a",
        "text": "Hyper-threading",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Multi-threading",

      },

        "id": "opt_c",
        "text": "Multi-core",

      },
      {
        "id": "opt_d",
        "text": "Multi-processor",

      }
    ],
    "explanation": "A multi-core processor has multiple processor cores integrated into a single processor package.\n\nA multi-processor motherboard allows you to install two (or more) processors on the same motherboard.\n\nMulti-threading is an operating system feature that allows more than one process to work at the same time.\n\nHyper-threading is a feature of some Intel processors that allows a single processor to run threads in parallel, as opposed to the older and slower technology of processing threads linearly."
  },
  {

      }
    ],
    "explanation": "The x64 architecture includes hardware-based virtualization technologies and Data Execution Prevention (DEP), which enhance performance and security. Hardware-based virtualization technologies, such as Intel VT-x and AMD-V, improve virtual machine efficiency, while DEP prevents code execution in non-executable memory regions, increasing system security. The option stating that x64 enhances performance with smaller instruction sets is incorrect, as its benefits derive from hardware-based features rather than reduced instruction size. Supporting 32-bit virtual machines is possible but does not eliminate performance penalties entirely. x64 does not eliminate the need for software-based security measures, as both hardware and software security features work together to protect systems."
  },
{

    "question": "A user wants to mitigate the risk of data loss by using hardware that provides fault tolerance. What can the user use?",

    ],
    "explanation": "A redundant array of independent disks (RAID) is an array that appears as a single storage resource or volume and can be partitioned and formatted like any other drive. RAID has a basic level numbered from 0 to 6. There are also nested RAID solutions, like RAID 10.\n\nNVMe (NVM express) can be packaged for installation to a PCIe slot as an expansion card or an M.2 slot.\n\nA solid-state drive (SSD) uses flash memory technology to implement persistent mass storage. Flash memory performs much better than the mechanical components used in hard drives.\n\nA mini-serial ATA (mSATA) allows a technician to plug an SSD packaged as an adapter card into the motherboard's combined data and power port."
  },
  {

    "question": "What does Double Data Rate (DDR) memory achieve by using both the rising and falling edges of the clock cycle?",

    "explanation": "DDR memory achieves double the data transfer rate by utilizing both the rising and falling edges of the clock cycle, allowing for two operations per cycle. This does not inherently increase capacity, synchronize stability, or reduce power consumption, but it significantly improves data throughput compared to traditional SDRAM."
  },
  {

  },

    "explanation": "When choosing a power supply:\n\n* Select the power supply form factor that matches the motherboard and case form factor (ATX, Micro-ATX, Mini-ITX, etc.).\n* Make sure that the power supply has the correct type and number of power connectors for all of your devices.\n* Select a power supply with sufficient watts to power all devices. The higher the wattage, the more internal and external devices can be supported.\n\nNearly all power supplies can accept between 100 and 240 volts of AC input power. Use the switch on the back to specify the input power that is appropriate for the voltage used in your country.\n\nAll power supplies output +/-5 and +/-12 volts of DC output power.\n\nIn addition, most power supplies provide an on/off switch, and all power supplies provide some type of cooling (such as a fan)."

  {

    "question": "A systems administrator sets up dual-channel memory in a system to increase performance. Which of the following does NOT require support?",

      }
    ],
    "explanation": "With a dual-channel memory controller, there are effectively two 64-bit pathways through the bus to the CPU, meaning that the system can send 128 bits of data per transfer rather than 64 bits. This does not require support from RAM devices, but it does from all others mentioned.\n\nThis feature requires support from the central processing unit (CPU). The system uses standard RAM modules. There are no \"dual-channel\" DDR memory modules.\n\nThis feature also requires support from the memory controller and motherboard. When configuring a dual-channel system, users must consult the system documentation to identify the appropriate slots to use.\n\nLast, this feature also requires support from the motherboard."

  {
    "id": "sys_dev_11",
    "topic": "Installing System Devices",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network administrator is setting up a server to manage their routers and switches throughout the environment and push standardized configurations. The administrator wants to use memory which performs a hash calculation on the data value. What should the network administrator use?",
    "options": [
      {
        "id": "opt_a",

      },
      {
        "id": "opt_b",
        "text": "RDIMM",

      },
      {
        "id": "opt_c",
        "text": "UDIMM",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Virtual memory",
        "isCorrect": false
      }
    ],
    "explanation": "Error correction code (ECC) RAM performs a hash calculation on the data value for each transfer and stores it as an 8-bit checksum. Most types of ECC supply as registered Dual Inline Memory Modules (RDIMMs). A registered DIMM uses an extra component to reduce electrical load on the memory controller.\n\nWhile the administrator could use unbuffered DIMM (UDIMM) since some types of ECC RAM get packaged in UDIMMs, although this is much rarer.\n\nIf there is insufficient system RAM, the administrator can extend memory space by using disk storage known as swap space in a Linux system.\n\nThe total amount of addressable memory (system RAM plus swap space) is virtual memory or virtual RAM."
  },

  {

{

    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer is not booting from a newly installed SSD, even though it is properly connected.\n\nUpon checking the system firmware settings, you find that the boot option sequence is set to prioritize the optical drive first, followed by a USB drive, and then the network.\n\nWhich of the following actions should you take to analyze and resolve the boot issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Enable Secure Boot in the UEFI setup to ensure the SSD is recognized as a trusted device.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Update the system firmware to the latest version to ensure compatibility with the SSD.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Change the boot option sequence to prioritize the SSD as the first boot device.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Disconnect the optical drive and USB drive to force the system to boot from the SSD.",
        "isCorrect": false
      }
    ],
    "explanation": "Analyzing the boot option sequence reveals that the SSD is not prioritized, which is why the system is not booting from it. By changing the sequence to prioritize the SSD, you ensure that the system firmware searches the SSD first for a boot manager, resolving the issue.\n\nWhile disconnecting other boot devices might force the system to boot from the SSD, it is not an efficient or practical solution. It does not address the root cause of the issue, which is the incorrect boot option sequence.\n\nEnabling Secure Boot is a security measure and does not influence the boot order or resolve issues related to boot device prioritization. It ensures that only trusted software is loaded but does not affect the SSD's boot priority.\n\nWhile updating the firmware can be beneficial for compatibility, it is not necessary in this scenario. The issue is related to the boot option sequence, not firmware compatibility. Prioritizing the SSD in the boot sequence is the correct action to resolve the issue."
  },
  {

    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following BEST describes the role of the Trusted Platform Module (TPM) in enhancing system security?",
    "options": [
      {
        "id": "opt_a",
        "text": "Verifying that the TPM is configured to support legacy BIOS mode for compatibility with older hardware.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Checking if the TPM is used to control fan speed and temperature monitoring for system stability.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Assessing whether the TPM is used to store cryptographic keys securely, preventing unauthorized access to encrypted data.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Evaluating if the TPM is enabled to allow booting from USB devices for recovery purposes.",
        "isCorrect": false
      }
    ],
    "explanation": "The TPM is designed to securely store cryptographic keys, which is crucial for protecting encrypted data and ensuring that sensitive information is not accessed by unauthorized users.\n\nWhile booting from USB devices can be useful for recovery, it is not related to the primary function of the TPM. The TPM is not involved in enabling or disabling boot options; its role is focused on security, particularly in storing cryptographic keys.\n\nThe TPM does not play a role in supporting legacy BIOS mode. This option confuses the TPM's security functions with compatibility settings, which are unrelated to the TPM's purpose.\n\nThe TPM is not involved in hardware management tasks such as controlling fan speed or temperature monitoring. This option misrepresents the TPM's role, which is centered around security and cryptographic functions, not hardware stability."
  },
  {
    "id": "bios_03",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "An energy company is strengthening its defenses and wants to look for methods that successfully protect trade secrets by ensuring none of its company's computing assets are hijacked by malware.\nTo assist in safeguarding the sensitive information, what can the technician enable to ensure this will not happen?",
    "options": [
      {
        "id": "opt_a",
        "text": "Boot password",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "HSM",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "TPM",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Secure boot",
        "isCorrect": true
      }
    ],
    "explanation": "The technician can configure secure boot, which is a unified extensible firmware interface (UEFI) feature designed to prevent malware from hijacking a computer.\n\nA trusted platform module (TPM) is a specification for hardware-based storage of digital certificates, cryptographic keys, and hashed passwords.\n\nA hardware security module (HSM) is a secure USB key or thumb drive used to store cryptographic material where a user must authenticate before they can access the keys stored on the module.\n\nA boot password requires the user to authenticate before the operating system is loaded. Different system software will provide different support for authentication methods. This measure cannot keep malware from injecting code into the bootloader of the operating system."
  },
  {
    "id": "bios_04",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have purchased a new notebook. This notebook system uses UEFI firmware and comes with Windows 11 preinstalled. However, you want to use Linux on this system.\nYou download your favorite distribution and install it on the system, removing all Windows partitions on the hard disk in the process. When the installation is complete, you find that the operating system won't load when the system is rebooted.\nWhich of the following would allow your computer to boot to Linux?",
    "options": [

        "text": "Enable the TPM chip on the motherboard.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Reinstall Windows 11 on the system.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Set the boot order to boot from the hard disk first in the UEFI configuration.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Disable Secure Boot in the UEFI configuration.",
        "isCorrect": true

      {
        "id": "opt_e",
        "text": "Enable Secure Boot in the UEFI configuration.",

      }
    ],
    "explanation": "In this scenario, you should disable the Secure Boot option in the UEFI configuration. Secure Boot requires the operating system installed on the hard drive to be digitally signed. If it isn't digitally signed, the UEFI firmware will not boot it by default.\n\nReinstalling Windows 11 does not meet the requirements of this scenario.\n\nIf Secure Boot is already enabled, the TPM chip on the motherboard must already be enabled as well.\n\nThe boot order configuration is not preventing the system from booting in this scenario."
  },
  {
    "id": "bios_05",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "A company has recently upgraded its systems to UEFI-based firmware, and some employees are experiencing issues accessing system settings during boot.\nWhich of the following actions would BEST evaluate and resolve the issue of missing the key prompt to access the UEFI setup program?",
    "options": [
      {
        "id": "opt_a",
        "text": "Adjust the boot order to prioritize the hard drive, ensuring the system boots correctly.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Use the Shift-click method on the Restart button from the Windows logon screen to access UEFI boot options.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Disable Secure Boot in the UEFI setup to allow easier access to system settings.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Reboot the computer and continuously press the Delete key until the UEFI setup program appears.",
        "isCorrect": false
      }
    ],
    "explanation": "Using the Shift-click method on the Restart button from the Windows logon screen to access UEFI boot options provides a reliable way to access UEFI boot options without relying on the timing of key presses during boot. It evaluates the issue by offering an alternative access method, ensuring users can reach the UEFI setup even if they miss the initial prompt.\n\nWhile pressing the Delete key is a common method to access the UEFI setup, it does not evaluate the issue of missing the prompt. This approach relies on timing and may not resolve the problem if the boot process is too fast.\n\nDisabling Secure Boot does not affect the ability to access the UEFI setup program. Secure Boot is a security feature and does not influence the key prompt or access method for UEFI settings.\n\nAdjusting the boot order is unrelated to accessing the UEFI setup program. This action focuses on the sequence of boot devices rather than resolving the issue of missing the key prompt for UEFI access."
  },
  {
    "id": "bios_06",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a system administrator tasked with optimizing the cooling system of a high-performance workstation used for video editing. The workstation frequently overheats, causing performance issues.\nBased on the system's UEFI settings, which of the following actions should you take to ensure the workstation operates efficiently without overheating?",
    "options": [
      {
        "id": "opt_a",
        "text": "Configure the duty cycle settings to a higher percentage to increase the fan speed and improve cooling efficiency.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Set the cooling option to \"Quiet\" to reduce fan noise and allow the system to run at higher temperatures.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Use third-party applications to manually monitor the temperature and adjust fan settings as needed.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Disable all USB ports to reduce power consumption and indirectly lower system temperature.",
        "isCorrect": false
      }
    ],
    "explanation": "Increasing the duty cycle settings will make the fans run faster, enhancing cooling efficiency and helping to prevent the workstation from overheating. This action directly addresses the overheating issue by improving airflow and heat dissipation.\n\nWhile this option reduces fan noise, it allows the system to run at higher temperatures, which is not ideal for a workstation that is already experiencing overheating issues. This setting prioritizes noise reduction over cooling efficiency.\n\nDisabling USB ports may slightly reduce power consumption, but it is unlikely to have a significant impact on the system's overall temperature. This action does not directly address the cooling needs of the workstation.\n\nWhile third-party applications can provide valuable temperature monitoring, they do not directly adjust fan settings through UEFI. The question specifically asks for actions within the UEFI settings, making this option less relevant to the scenario."
  },
  {
    "id": "bios_07",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following BEST describes the technology that was designed to replace the BIOS and is a firmware solution for controlling the startup process and loading the computer operating system into memory?",
    "options": [
      {
        "id": "opt_a",
        "text": "UEFI",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "EEPROM",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "CMOS",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "BIOS 2",
        "isCorrect": false
      }
    ],
    "explanation": "UEFI was designed to replace the BIOS and is a firmware solution for controlling the startup process and loading the computer operating system into memory.\n\nCMOS is a legacy computer chip technology that was used to store system information prior to the introduction of EEPROM.\n\nEEPROM is a non-volatile memory chip that stores the system startup information that is configured through UEFI.\n\nBIOS (Basic Input/Output System) is firmware used to provide runtime services for operating systems. BIOS version 2 does not exist."
  },
  {
    "id": "bios_08",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer frequently overheats and shuts down during intensive tasks. Upon accessing the system firmware settings, you notice that the fan speed is set to \"Quiet\" mode.\nWhich of the following actions should you take to analyze and resolve the overheating issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Enable Secure Boot to ensure that only trusted software runs, preventing overheating.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Adjust the boot order to prioritize the SSD, reducing the time the system spends booting and thus lowering heat generation.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Change the fan speed setting to \"Cool\" mode to increase fan activity and reduce system temperature.",
        "isCorrect": true
      },
      {
        "id": "opt_d",

    "explanation": "By analyzing the current fan speed setting, you can determine that the \"Quiet\" mode is likely contributing to the overheating issue. Changing the setting to \"Cool\" mode will increase fan activity, enhancing cooling and reducing system temperature during intensive tasks.\n\nSecure Boot is a security feature that does not affect system temperature or fan operation. It ensures that only trusted software is loaded during boot but does not address overheating issues.\n\nAdjusting the boot order does not impact the system's temperature during intensive tasks. Boot order settings determine the sequence of boot devices and do not influence heat generation or cooling.\n\nDisabling USB ports may slightly reduce power consumption, but it is unlikely to have a significant impact on the overall system temperature during intensive tasks. The primary issue is related to fan speed settings, not USB port activity."
  },
  {
    "id": "bios_09",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following is a typical boot device option that can be prioritized in the system firmware's boot option sequence?",
    "options": [
      {
        "id": "opt_a",
        "text": "Network/PXE (Preboot Execution Environment)",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Printer",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "External monitor",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Bluetooth device",
        "isCorrect": false
      }
    ],
    "explanation": "Network/PXE is a typical boot device option that can be prioritized in the system firmware's boot option sequence. It allows the computer to boot via the network adapter by retrieving boot instructions from a configured server.\n\nBluetooth devices are not typically used as boot devices. They are primarily used for wireless communication and do not have the capability to store or execute boot instructions.\n\nAn external monitor is a display device and does not function as a boot device. It is used to display output from the computer but cannot store or execute boot instructions.\n\nA printer is an output device used for printing documents and cannot be used as a boot device. It does not have the capability to store or execute boot instructions."
  },
  {
    "id": "bios_10",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a technician tasked with setting up a new computer system for a client who wants to install an operating system from a USB drive. However, the system is currently configured to boot from the internal hard drive first.\nWhich of the following actions should you take to ensure the system boots from the USB drive?",
    "options": [
      {
        "id": "opt_a",
        "text": "Format the internal hard drive to remove any existing boot managers.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Access the UEFI setup program and change the boot option sequence to prioritize the USB drive over the internal hard drive.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Connect the USB drive and restart the computer without making any changes to the boot order.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Disable the internal hard drive in the UEFI setup program to force the system to boot from the USB drive.",
        "isCorrect": false
      }
    ],
    "explanation": "By accessing the UEFI setup program and adjusting the boot option sequence, you can ensure that the system checks the USB drive for a boot manager before the internal hard drive. This is the appropriate action to take to boot from the USB drive.\n\nSimply connecting the USB drive and restarting the computer will not change the boot order. The system will continue to boot from the internal hard drive as it is currently prioritized in the boot sequence.\n\nFormatting the internal hard drive is unnecessary and could result in data loss. It does not address the need to change the boot order to prioritize the USB drive.\n\nDisabling the internal hard drive is an extreme measure that is not required. Adjusting the boot order is sufficient to achieve the desired outcome without disabling hardware components."
  },
  {
    "id": "bios_11",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "When configuring fan settings in the UEFI setup program, which option would you select to prioritize a quieter operation over cooling performance?",
    "options": [
      {
        "id": "opt_a",
        "text": "Cool",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Balanced",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Quiet",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Fanless",
        "isCorrect": false
      }
    ],
    "explanation": "The \"Quiet\" setting prioritizes reducing fan speed to minimize noise, even if it allows for slightly higher system temperatures. This option is specifically intended for quieter operations.\n\nThe \"Balanced\" setting aims to provide a compromise between cooling performance and noise level, but it does not specifically prioritize quieter operation over cooling.\n\nThe \"Cool\" setting is designed to enhance cooling performance by running fans at higher speeds, which typically results in more noise, not less.\n\nWhile \"Fanless\" might suggest a quieter operation, it is not a typical setting for active cooling systems in UEFI. It implies no fan operation, which could lead to overheating unless the system is specifically designed for passive cooling."
  },
  {
    "id": "bios_12",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which security measure generates and stores cryptographic keys?",
    "options": [
      {
        "id": "opt_a",
        "text": "BIOS/UEFI password",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Trusted Platform Module (TPM)",

      },
      {
        "id": "opt_c",
        "text": "Chassis intrusion detection",

      },

        "id": "opt_d",
        "text": "DriveLock",

      }
    ],
    "explanation": "A Trusted Platform Module (TPM) is a special chip on the motherboard that generates and stores cryptographic keys. The TPM can be used by applications (such as Bitlocker on Windows systems) to generate and save keys that are used for encryption.\n\nA BIOS/UEFI password controls access to the BIOS/UEFI setup program.\n\nChassis intrusion detection helps you identify when a system case has been opened.\n\nDriveLock is a disk encryption solution."
  },
  {
    "id": "bios_13",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "A company is planning to implement a secure method for storing cryptographic keys used in their data encryption processes. They have several computers that do not support Trusted Platform Module (TPM) technology.\nThe IT manager is considering using a Hardware Security Module (HSM) for this purpose.\nWhich of the following reasons BEST justifies the use of an HSM in this scenario?",

        "text": "An HSM can be used to enhance the overall network bandwidth of the company.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "An HSM can be used to improve the processing speed of encryption algorithms.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "An HSM can be used to back up all company data to prevent data loss.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "An HSM provides a secure way to store cryptographic keys, especially for computers lacking TPM support.",
        "isCorrect": true

    ],
    "explanation": "A Hardware Security Module (HSM) is used to securely store cryptographic keys. It is particularly useful for computers that do not support TPM, providing a secure alternative for key storage and recovery.\n\nAn HSM is focused on secure storage of cryptographic keys, not on network performance.\n\nThe purpose of an HSM is specifically for securely storing cryptographic keys, not for general data backup.\n\nAn HSM is used for secure storage of cryptographic keys, which is unrelated to the speed of encryption processes."
  },
  {
    "id": "bios_14",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "In the context of system firmware, what is the primary purpose of configuring USB permissions through the UEFI setup program?",
    "options": [
      {
        "id": "opt_a",
        "text": "To install drivers for USB devices.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To enable or disable USB ports for security reasons.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "To increase the data transfer speed of USB devices.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "To update the firmware of USB-connected devices.",
        "isCorrect": false
      }
    ],
    "explanation": "The primary purpose of configuring USB permissions through the UEFI setup program is to enable or disable USB ports, which can be an important security measure to prevent unauthorized access or data transfer.\n\nConfiguring USB permissions in the UEFI setup program does not affect the data transfer speed of USB devices. Speed is determined by the USB version and hardware capabilities.\n\nInstalling drivers for USB devices is typically done within the operating system, not through the UEFI setup program.\n\nUpdating the firmware of USB-connected devices is not related to configuring USB permissions in the UEFI setup program. Firmware updates are usually performed through specific software tools provided by the device manufacturer."
  },
  {
    "id": "bios_15",
    "topic": "BIOS and UEFI",
    "type": "single",
    "requiredSelections": 1,
    "question": "A technician is implementing a feature that will compare hashes of key system state data during the boot process to ensure that nobody has tampered with the system firmware, boot loader, and OS kernel.\nWhat feature is this?",
    "options": [
      {
        "id": "opt_a",

        "id": "opt_b",

        "isCorrect": false
      },
      {
        "id": "opt_d",
