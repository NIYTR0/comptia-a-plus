    }
  ],
  "explanation": "Using a multimeter to measure the output voltages allows you to accurately evaluate whether the power supply is providing stable and correct voltages to the system. This method provides direct and quantitative data about the power supply's performance.\n\nWhile a visual inspection can reveal obvious physical damage or burnt smells, it does not provide a comprehensive evaluation of the power supply's stability or voltage output.\n\nReplacing the power supply without first evaluating the current one does not provide an understanding of the existing power supply's condition. It is more of a trial-and-error approach rather than an evaluative one.\n\nWhile checking event logs can provide insights into power-related issues, it does not directly evaluate the power supply's voltage stability. Event logs are more useful for identifying patterns or symptoms rather than evaluating hardware components."
},
{
  "id": "proj_03",
  "topic": "System and Display Issues",
  "type": "single",
  "requiredSelections": 1,
  "question": "While trying to use a projector for a presentation, you receive an error that states, \"No signal detected.\"\n\nWhat is the MOST likely cause of this error?",
  "options": [
    {
      "id": "opt_a",
      "text": "A burned-out bulb",
      "isCorrect": false
    },
    {
      "id": "opt_b",
      "text": "Weak remote control batteries",
      "isCorrect": false
    },
    {
      "id": "opt_c",
      "text": "A loose HDMI cable",
      "isCorrect": true
    },
    {
      "id": "opt_d",
      "text": "Obstructed air vents on the projector",
      "isCorrect": false
    }
  ],
  "explanation": "A loosely connected HDMI cable often causes a projector to be unable to detect a signal.\n\nA burned-out bulb would cause the projector to be unable to display anything at all.\n\nObstructed vents could cause the bulb to burn out or could cause a sensor to trigger a shutdown.\n\nWeak batteries in the remote control would affect the remote control's ability to communicate with the projector, but this would not result in a \"No signal detected\" error."
}
];

let questions = [];
let historyStack = [];
let historyIndex = -1;
let answeredMap = {}; 
let currentShuffledOptionsMap = {}; // Maps question ID -> shuffled array of option objects
let tempSelectionsMap = {};         // Keeps track of in-progress multi-select choices before final submission

function initApp() {
    loadBank();
    setupEventListeners();
    startNewDeck();
}

function loadBank() {
    questions = [...DEFAULT_QUESTIONS];
}

function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function startNewDeck() {
    historyStack = [];
    historyIndex = -1;
    answeredMap = {};
    tempSelectionsMap = {};
    currentShuffledOptionsMap = {};

    // Shuffle options independently for each question on new deck creation
    questions.forEach(q => {
        currentShuffledOptionsMap[q.id] = shuffleArray(q.options);
    });

    let unvisited = Array.from({length: questions.length}, (_, i) => i);
    let shuffledSequence = shuffleArray(unvisited);

    if (shuffledSequence.length > 0) {
        historyStack.push(shuffledSequence[0]);
        historyIndex = 0;
    }

    renderGrid();
    renderQuestion();
}

function renderGrid() {
    const gridContainer = document.getElementById('question-grid');
    const statusText = document.getElementById('grid-status-text');
    if (!gridContainer) return;

    gridContainer.innerHTML = '';
    const total = questions.length;
    const completed = Object.keys(answeredMap).length;

    if (statusText) {
        statusText.textContent = `${completed}/${total} Completed`;
    }

    const currentQIdx = historyStack[historyIndex];

    questions.forEach((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'grid-btn';
        btn.textContent = i + 1;

        if (i === currentQIdx) {
            btn.classList.add('active');
        }

        if (answeredMap.hasOwnProperty(i)) {
            if (answeredMap[i].isCorrect) {
                btn.classList.add('answered-correct');
            } else {
                btn.classList.add('answered-incorrect');
            }
        }

        btn.addEventListener('click', () => {
            if (historyStack[historyIndex] !== i) {
                historyStack = historyStack.slice(0, historyIndex + 1);
                historyStack.push(i);
                historyIndex++;
                renderQuestion(); 
            }
        });

        gridContainer.appendChild(btn);
    });
}

function renderQuestion() {
    if (historyIndex < 0 || historyIndex >= historyStack.length) return;
    const qIndex = historyStack[historyIndex];
    const q = questions[qIndex];

    document.getElementById('stats-badge').innerText = `Question ${historyIndex + 1} of ${questions.length}`;
    document.getElementById('topic-tag').innerText = q.topic || 'General';
    document.getElementById('question-text').innerText = q.question;

    const optionsList = document.getElementById('options-list');
    optionsList.innerHTML = '';

    const expPanel = document.getElementById('explanation-panel');
    const expContent = document.getElementById('explanation-content');
    expContent.innerText = q.explanation;

    const record = answeredMap[qIndex];

    if (record) {
        expPanel.classList.remove('hidden');
    } else {
        expPanel.classList.add('hidden');
    }

    // Retrieve shuffled options for this question
    const displayOptions = currentShuffledOptionsMap[q.id] || q.options;
    const prefixes = ['A', 'B', 'C', 'D', 'E', 'F'];
    const currentTemp = tempSelectionsMap[qIndex] || [];

    displayOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="prefix">${prefixes[idx]}</span> <span>${opt.text}</span>`;

        if (record) {
            // Question has been evaluated
            btn.disabled = true;

            if (opt.isCorrect) {
                btn.classList.add('correct');
            }

            if (record.selectedIds.includes(opt.id) && !opt.isCorrect) {
                btn.classList.add('incorrect');
            }
        } else {
            // Question is active
            const isSelectedInTemp = currentTemp.includes(opt.id);

            if (isSelectedInTemp) {
                btn.classList.add('selected-temp');
            }

            // Disable unselected options when selection limit is reached
            if (!isSelectedInTemp && currentTemp.length >= q.requiredSelections) {
                btn.disabled = true;
            } else {
                btn.addEventListener('click', () => handleOptionClick(qIndex, opt.id));
            }
        }

        optionsList.appendChild(btn);
    });

    document.getElementById('prev-btn').disabled = (historyIndex <= 0);
    renderGrid();
}

function handleOptionClick(qIndex, selectedOptionId) {
    const q = questions[qIndex];
    if (!q || answeredMap[qIndex]) return;

    if (q.type === 'single') {
        evaluateQuestion(qIndex, [selectedOptionId]);
    } else {
        // Multi-select logic
        let currentTemp = tempSelectionsMap[qIndex] ? [...tempSelectionsMap[qIndex]] : [];

        if (currentTemp.includes(selectedOptionId)) {
            // Deselect if clicked again
            currentTemp = currentTemp.filter(id => id !== selectedOptionId);
        } else {
            if (currentTemp.length < q.requiredSelections) {
                currentTemp.push(selectedOptionId);
            }
        }

        tempSelectionsMap[qIndex] = currentTemp;

        // Auto-evaluate when exact selection limit is reached
        if (currentTemp.length === q.requiredSelections) {
            evaluateQuestion(qIndex, currentTemp);
        } else {
            renderQuestion();
        }
    }
}

function evaluateQuestion(qIndex, selectedIds) {
    const q = questions[qIndex];
    if (!q) return;

    const correctIds = q.options.filter(o => o.isCorrect).map(o => o.id);

    // Compare selected IDs against true correct IDs
    const isCorrect = (
        selectedIds.length === correctIds.length &&
        selectedIds.every(id => correctIds.includes(id))
    );

    answeredMap[qIndex] = {
        selectedIds: selectedIds,
        isCorrect: isCorrect
    };

    renderQuestion();
}

function nextQuestion() {
    if (historyIndex < historyStack.length - 1) {
        historyIndex++;
    } else {
        const visitedSet = new Set(historyStack);
        const unvisited = [];
        for (let i = 0; i < questions.length; i++) {
            if (!visitedSet.has(i)) {
                unvisited.push(i);
            }
        }

        if (unvisited.length > 0) {
            const nextRandom = unvisited[Math.floor(Math.random() * unvisited.length)];
            historyStack.push(nextRandom);
            historyIndex++;
        } else {
            let nextRandom = Math.floor(Math.random() * questions.length);
            historyStack.push(nextRandom);
            historyIndex++;
        }
    }
    renderQuestion();
}

function prevQuestion() {
    if (historyIndex > 0) {
        historyIndex--;
        renderQuestion();
    }
}

function toggleExplanation() {
    const expPanel = document.getElementById('explanation-panel');
    expPanel.classList.toggle('hidden');
}

function resetToDefaults() {
    if (confirm('Reset your current test attempt and shuffle a new deck?')) {
        startNewDeck();
    }
}

function setupEventListeners() {
    document.getElementById('next-btn').addEventListener('click', nextQuestion);
    document.getElementById('prev-btn').addEventListener('click', prevQuestion);
    document.getElementById('toggle-exp-btn').addEventListener('click', toggleExplanation);

    document.addEventListener('keydown', (e) => {
        if (e.key >= '1' && e.key <= '5') {
            const idx = parseInt(e.key) - 1;
            const qIndex = historyStack[historyIndex];
            const q = questions[qIndex];
            if (q && !answeredMap[qIndex]) {
                const displayOptions = currentShuffledOptionsMap[q.id] || q.options;
                if (idx < displayOptions.length) {
                    const optId = displayOptions[idx].id;
                    const currentTemp = tempSelectionsMap[qIndex] || [];
                    
                    // Allow hotkey selection if option is clickable
                    if (currentTemp.includes(optId) || currentTemp.length < q.requiredSelections) {
                        handleOptionClick(qIndex, optId);
                    }
                }
            }
        } else if (e.key === ' ' || e.key === 'ArrowRight') {
            e.preventDefault();
            nextQuestion();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevQuestion();
        } else if (e.key.toLowerCase() === 'e') {
            toggleExplanation();
        }
    });
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
