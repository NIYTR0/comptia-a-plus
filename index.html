<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA A+ Master Practice Bank</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
            --border-color: #334155;
            --hover-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-blue);
        }

        .stats-badge {
            background-color: var(--bg-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-grid-container {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .grid-header {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
        }

        .question-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .grid-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .grid-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-main);
        }

        .grid-btn.active {
            background-color: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            font-weight: 700;
        }

        .grid-btn.answered-correct {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .grid-btn.answered-incorrect {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .topic-tag {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--text-main);
            font-weight: 500;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--hover-bg);
            border-color: var(--accent-blue);
        }

        .option-btn .prefix {
            font-weight: 700;
            color: var(--accent-blue);
            min-width: 20px;
        }

        .option-btn.selected-temp {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-blue);
        }

        .option-btn.correct {
            background-color: rgba(34, 197, 94, 0.15) !important;
            border-color: var(--accent-green) !important;
            color: #ffffff !important;
        }

        .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--accent-red) !important;
            color: #ffffff !important;
        }

        .option-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .explanation-panel {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-blue);
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .explanation-panel.hidden {
            display: none !important;
        }

        .explanation-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .explanation-content {
            font-size: 0.95rem;
            line-height: 1.65;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--hover-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: #2563eb;
            border-color: #3b82f6;
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #1d4ed8;
            border-color: #60a5fa;
            color: #ffffff;
        }

        .keyboard-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: -5px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>CompTIA A+ Master Practice Bank</h1>
        <div class="stats-badge" id="stats-badge">Loading...</div>
        <div class="header-actions">
            <button id="resetBankBtn" onclick="resetToDefaults()" style="background:#dc2626; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:0.85rem; font-weight:600;">Reset Bank</button>
        </div>
    </header>

    <div class="nav-grid-container">
        <div class="grid-header">
            <span>Question Selector</span>
            <span id="grid-status-text">0/0 Completed</span>
        </div>
        <div class="question-grid" id="question-grid"></div>
    </div>

    <main class="card">
        <div class="card-header">
            <span class="topic-tag" id="topic-tag">General</span>
        </div>

        <div class="question-text" id="question-text">Loading question...</div>

        <div class="options-list" id="options-list"></div>

        <div class="explanation-panel hidden" id="explanation-panel">
            <div class="explanation-title">Official CompTIA Explanation & Distractor Analysis</div>
            <div class="explanation-content" id="explanation-content"></div>
        </div>

        <div class="controls">
            <button class="btn" id="prev-btn" disabled>&larr; Previous</button>
            <button class="btn" id="toggle-exp-btn">Toggle Explanation</button>
            <button class="btn btn-primary" id="next-btn">Next &rarr;</button>
        </div>
    </main>

    <div class="keyboard-hint">Shortcuts: [1-5] Select Option | [Space] Next Question | [&larr;] Previous | [E] Toggle Explanation</div>
</div>

<script>
const DEFAULT_QUESTIONS = [
    {
    "id": "it_spec_01",
    "topic": "What Does an IT Specialist Do?",
    "type": "single",
    "requiredSelections": 1,
    "question": "Why is it important to establish and test a theory during the troubleshooting process?",
    "options": [
      {
        "id": "opt_a",
        "text": "To focus solely on the symptoms of the problem without considering possible causes.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To avoid consulting external resources or other technicians during the troubleshooting process.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To systematically identify the probable cause of the problem and confirm it through testing.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "To immediately implement a solution without wasting time on unnecessary steps.",
        "isCorrect": false
      }
    ],
    "explanation": "Establishing and testing a theory is a systematic approach to diagnosing a problem. By identifying probable causes and confirming them through testing, technicians can efficiently determine the root cause and proceed with an appropriate solution.\n\nIt is important to diagnose the problem before implementing a solution. Skipping the step of establishing and testing a theory could lead to incorrect fixes and wasted effort.\n\nIt is also important to go beyond symptoms and identify the underlying causes of the problem. Focusing only on symptoms without testing theories would result in incomplete troubleshooting.\n\nThe troubleshooting process encourages using research techniques, consulting other technicians, and leveraging external resources when necessary. Collaboration and research are valuable tools for accurately diagnosing and resolving issues."
  },
  {
    "id": "it_spec_02",
    "topic": "What Does an IT Specialist Do?",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the primary purpose of escalating an issue during the troubleshooting process?",
    "options": [
      {
        "id": "opt_a",
        "text": "To involve senior staff or external resources when the problem cannot be resolved at the current level.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "To skip basic troubleshooting steps and focus on advanced diagnostics.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To immediately replace faulty hardware without further testing.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "To document the problem for future reference without attempting to resolve it.",
        "isCorrect": false
      }
    ],
    "explanation": "The purpose of escalation is to seek assistance from senior staff, subject matter experts, or external resources when the problem cannot be resolved after thorough troubleshooting. Escalation ensures that the issue is addressed efficiently without wasting time or resources.\n\nReplacing hardware without proper testing is not part of the escalation process. Escalation involves seeking additional expertise or resources, not making assumptions about the cause of the problem.\n\nEscalation occurs after basic and intermediate troubleshooting steps have been completed. Skipping steps is not aligned with the systematic approach outlined in the troubleshooting methodology.\n\nWhile documentation is important, the purpose of escalation is to resolve the issue, not just to record it. Documentation supports the escalation process by providing a clear record of what has been attempted so far."
  },
  {
    "id": "it_spec_03",
    "topic": "What Does an IT Specialist Do?",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that he is unable to access data on an external hard drive. You investigate the problem and determine that the USB cable connection to the hard drive is damaged. You replace the cable.\n\nWhich of the following actions should you take next?",
    "options": [
      {
        "id": "opt_a",
        "text": "Test the solution.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Create an action plan.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Document the problem and solution.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Determine if escalation is necessary.",
        "isCorrect": false
      }
    ],
    "explanation": "After replacing the USB cable, the next logical step is to test whether the solution resolved the issue. Testing ensures that the external hard drive is now accessible and functioning as expected. This aligns with the troubleshooting methodology, which emphasizes verifying full-system functionality after implementing a solution.\n\nWhile documentation is a critical step in the troubleshooting process, it is not the immediate next step after replacing the USB cable. According to the methodology, documentation should occur after verifying that the solution works and the issue is resolved. This ensures that the documentation reflects the complete resolution process, including any lessons learned or preventive measures implemented.\n\nDetermining if escalation is necessary is a step taken when the problem cannot be resolved or if the issue requires expertise or resources beyond your scope. Since the problem has been addressed by replacing the USB cable, escalation is not relevant at this stage. Testing the solution comes first to confirm that escalation is unnecessary.\n\nCreating an action plan is a step that occurs earlier in the troubleshooting process before implementing a solution. It involves planning the steps to resolve the problem. Since the cable has already been replaced, the action plan has already been executed, and the next step is to test the solution to ensure it worked."
  },
  {
    "id": "it_spec_04",
    "topic": "What Does an IT Specialist Do?",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are troubleshooting a network printer that is not responding to print jobs.\nAfter identifying the problem and testing your theory, you determine that the issue is caused by an outdated firmware version on the printer.\nBefore implementing a plan of action to update the firmware, what should you analyze to ensure the solution is appropriate?",
    "options": [
      {
        "id": "opt_a",
        "text": "Check if other users are experiencing similar issues and wait for them to report the problem before taking action.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Analyze whether the printer can be replaced with a newer model instead of updating the firmware.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Immediately proceed with the firmware update without checking for compatibility.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Confirm whether the firmware update is compatible with the printer model and network environment.",
        "isCorrect": true
      }
    ],
    "explanation": "Analyzing compatibility is a critical step before implementing a firmware update. Ensuring that the update is suitable for the printer model and network environment prevents potential issues, such as bricking the device or introducing new problems. This aligns with the troubleshooting methodology, which emphasizes careful planning and adherence to vendor instructions.\n\nSkipping the compatibility analysis can lead to serious issues, such as rendering the printer inoperable. Implementing a plan of action requires careful consideration of all potential risks and ensuring the solution is appropriate.\n\nReplacing the printer is not a necessary step at this stage. The issue has already been identified as an outdated firmware problem, and updating the firmware is a more cost-effective and efficient solution.\n\nWaiting for other users to report the issue delays the resolution unnecessarily. The problem has already been identified, and the focus should be on implementing the solution after analyzing its appropriateness."
  },
  {
    "id": "it_spec_05",
    "topic": "What Does an IT Specialist Do?",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their laptop is not connecting to the office Wi-Fi network.\nAs part of \"Questioning the Obvious,\" which of the following actions should you take first?",
    "options": [
      {
        "id": "opt_a",
        "text": "Verify that the Wi-Fi is enabled on the laptop.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Replace the office Wi-Fi router with a new one.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Reinstall the laptop's network drivers.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Escalate the issue to the network infrastructure team.",
        "isCorrect": false
      }
    ],
    "explanation": "\"Questioning the Obvious\" involves checking simple and obvious potential causes first. Ensuring that the Wi-Fi is enabled on the laptop is a basic step that could immediately resolve the issue without requiring more complex troubleshooting.\n\nReinstalling network drivers is a more advanced troubleshooting step. Before taking such action, you should check simpler causes, such as whether the Wi-Fi is enabled on the laptop.\n\nReplacing the router is an extreme step that should only be considered after ruling out all other potential causes, including basic checks like verifying the laptop's Wi-Fi settings.\n\nEscalation is only necessary if the problem cannot be resolved after performing basic troubleshooting steps. \"Questioning the Obvious\" focuses on addressing simple potential causes before involving other teams."
  },
{
    "id": "it_spec_06",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following statements BEST describes the function and characteristics of a serial port?",
    "options": [
      {
        "id": "opt_a",
        "text": "A serial port uses a 15-pin interface and is primarily used for connecting video devices to computers.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "A serial port supports high-speed data transmission rates similar to USB and is widely used in modern computing for connecting external modems.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "A serial port is a legacy connection interface that transmits data one bit at a time over a single wire and is known as Recommended Standard #232 (RS-232).",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "A serial port transmits data one bit at a time over a single wire and is commonly used for connecting modern USB devices.",
        "isCorrect": false
      }
    ],
    "explanation": "The serial port is a legacy connection interface that transmits data one bit at a time over a single wire and is known as RS-232.\n\nWhile it is true that a serial port transmits data one bit at a time over a single wire, it is not commonly used for connecting modern USB devices. USB has largely replaced serial ports for many functions, but they are not the same interface.\n\nSerial ports do not support high-speed data transmission rates similar to USB. They are considered legacy interfaces and have been largely replaced by USB for connecting external modems.\n\nSerial ports do not use a 15-pin interface; they typically use a 9-pin or 25-pin interface. Additionally, they are not used for connecting video devices; VGA or DVI interfaces are used for video connections."
  },
  {
    "id": "it_spec_07",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "An iPhone user needs to charge their phone and notices that it only uses a certain type of connector. What type of connector does the iPhone use?",
    "options": [
      {
        "id": "opt_a",
        "text": "SATA",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Thunderbolt",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "USB",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Lightning port",
        "isCorrect": true
      }
    ],
    "explanation": "A Lightning port is found only on Apple’s mobile devices. The Lightning connector is reversible.\n\nUniversal Serial Bus (USB) is the standard meaning of connecting most peripheral device types to a computer. A host controller manages USB.\n\nThunderbolt displays interfaces like the DisplayPort or HDMI and a general peripheral interface like USB.\n\nSATA (serial advanced technology attachment) is the standard means of connecting internal storage drives within a desktop PC. STAT uses cables of up to 1 m terminated with compact 7-pin connectors. Each SATA host adapter port supports a single device."
  },
  {
    "id": "it_spec_08",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "A PC technician is diagnosing a faulty laptop and finds that the memory has likely gone bad, so the technician opens the case to try and replace it. However, the technician gets sidetracked when noticing that the SSD is provisioned in an adapter card form factor. What format is this most likely in?",
    "options": [
      {
        "id": "opt_a",
        "text": "eSATA",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "M.2",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "SATA",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "SAN",
        "isCorrect": false
      }
    ],
    "explanation": "A technician can provision a solid-state drive (SSD) in an adapter card form factor. These often use an M.2 interface. As well, an M.2 port orients horizontally.\n\nThe motherboard will contain several serial advanced technology attachment (SATA) ports to connect one or more fixed drives.\n\nThere is also an external SATA (eSATA) standard for the attachment of external drives, with a 2 m (78 in.) cable.\n\nWithin an enterprise local area network (LAN) or datacenter, a storage area network (SAN) provisions access to a configurable pool of storage devices that application servers can use."
  },
  {
    "id": "it_spec_09",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are troubleshooting a legacy network device that uses an RS-232 serial connection for management. The device is not responding to commands sent from your laptop.\n\nAfter verifying that the serial cable is securely connected, which of the following actions would BEST help you analyze and resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Update the device's firmware using a USB flash drive to bypass the serial connection.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Check the COM port settings in your OS to ensure they match the device's communication parameters.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Replace the RS-232 serial cable with a VGA cable to test if the issue is with the cable type.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Use a PS/2-to-serial adapter to connect the device to your laptop's keyboard port for input.",
        "isCorrect": false
      }
    ],
    "explanation": "RS-232 serial communication requires the COM port settings on the laptop to match the device's settings. Mismatched parameters, such as baud rate or parity, can prevent successful communication. Analyzing and adjusting these settings is a logical step in troubleshooting the issue.\n\nVGA cables are designed for video transmission, not serial communication. Replacing the RS-232 cable with a VGA cable would not resolve the issue and demonstrate a misunderstanding of the cable's purpose.\n\nUpdating firmware is not directly related to analyzing the issue with the serial connection. Additionally, the device may not support firmware updates via USB if it is a legacy device relying on RS-232 for management.\n\nPS/2 ports are designed for connecting keyboards and mice, not for serial communication. Using a PS/2-to-serial adapter would not address the issue and is not a valid troubleshooting step for RS-232 connections."
  },
  {
    "id": "it_spec_10",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are tasked with configuring a network switch in a data center. The switch has a console port that requires a serial connection for initial setup.\n\nWhich of the following steps should you take to successfully connect and configure the switch?",
    "options": [
      {
        "id": "opt_a",
        "text": "Use a VGA cable to connect the console port to your laptop's HDMI port for video output.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Use an RS-232 serial cable to connect the console port to your laptop's USB port.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Use a PS/2 cable to connect the console port to your laptop's keyboard port for input.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Use a DVI cable to connect the console port to your laptop's Ethernet port for data transmission.",
        "isCorrect": false
      }
    ],
    "explanation": "RS-232 serial cables are commonly used to connect to the console ports of network equipment for device management. Since most modern laptops do not have built-in serial ports, a USB-to-serial adapter is often required to establish the connection. In addition, the vendor may provide a serial cable specifically designed to be used with the hardware.\n\nVGA cables are used for video transmission, not for serial communication or device management. The console port on a network switch is not designed for video output.\n\nDVI cables are designed for video output, not for serial communication. Additionally, Ethernet ports are used for network connectivity, not for connecting to console ports.\n\nPS/2 cables are used for connecting older keyboards and mice, not for serial communication or network device management. The console port on a switch requires an RS-232 serial connection, not a PS/2 connection."
  },
  {
    "id": "it_spec_11",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "A computer operator has an x8 PCIe but plugs it into an x16 connector. The operator notices that performance seems to be a bit sluggish. What is the most likely cause?",
    "options": [
      {
        "id": "opt_a",
        "text": "It is only working at x1.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "It is working fine.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "It defaulted to a slower speed because of the mismatch.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The RAM does not match.",
        "isCorrect": false
      }
    ],
    "explanation": "An x8 card will fit in an x8 or x16 socket. Therefore, the card should work at x8, but in some circumstances, it may only work at x1.\n\nIt is not that the speed is slower since the card is only working at x1. It may also be possible to fit a longer card into a shorter slot, referred to as down-plugging.\n\nIt is not that the RAM does not match the Peripheral Component Interconnect Express (PCIe) card. Each PCIe adapter card supports a specific number of lanes, typically x1, x4, x8, or x16.\n\nIf the operator noticed that performance was sluggish, then it was not working fine."
  },
  {
    "id": "it_spec_12",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are setting up a new workstation for an employee in an office that still uses older DVI monitors. The new computer only has HDMI and DisplayPort outputs.\nThe employee reports that the monitor is not displaying anything after you connect it using an adapter cable.\nWhat is the MOST likely step you need to take to resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Check the pin configuration of the DVI connector.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Install a driver for the adapter cable to enable the connection.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Use a VGA to HDMI adapter instead of a DVI adapter.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Replace the adapter cable with one that supports audio output.",
        "isCorrect": false
      }
    ],
    "explanation": "DVI connectors come in different types (DVI-I, DVI-D, and DVI-A) with varying pin configurations. Ensuring that the adapter cable matches the type of DVI port on the monitor is essential for compatibility. If the pin configuration does not match, the connection will not work, which is likely the issue in this scenario.\n\nDVI does not support audio output. Replacing the adapter cable for this reason would not resolve the issue, as audio is irrelevant to the problem described in the scenario.\n\nThe scenario specifies that the monitor uses a DVI connection, not a VGA. Using a VGA to HDMI adapter would not address the compatibility issue and would not work with the DVI monitor.\n\nThere is no specific need for drivers to use DVI adapters. Most adapter cables are plug-and-play and do not require additional software. This answer introduces an unnecessary step that is not relevant to the scenario."
  },
  {
    "id": "it_spec_13",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "A server administrator assesses various types of server hardware, specifically chipsets. The administrator plans to run a hypervisor on the hardware, which will run several hundred virtual machines. What would be the best chip type to use?",
    "options": [
      {
        "id": "opt_a",
        "text": "Emulation",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "x64",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "x86",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "ARM",
        "isCorrect": false
      }
    ],
    "explanation": "The x64 chip is the best and most powerful type to use. The x86 instruction set is extended for 64-bit operation as the x64 instruction set, developed initially by AMD as AMD64 or x86-64.\n\nThis x86 instruction set defines a CPU as IBM PC compatible. Intel and Advanced Micro Devices (AMD) designed and manufactured x86 PC processors.\n\nAn advanced reduced instruction set computing (RISC) machine implements a system-on-chip (SoC). SoC means that all controllers, video, sound, networking, and storage are part of the CPU.\n\nAn option for advanced RISC machine (ARM) support is emulation. The ARM device runs a facsimile of an x86 or x64 environment. Windows 10 ARM-based devices use emulation to run x86 and x64 software apps."
  },
  {
    "id": "it_spec_14",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "Why might a user choose a VA display over a TN display for general multimedia use?",
    "options": [
      {
        "id": "opt_a",
        "text": "VA displays provide better color accuracy and viewing angles than TN displays.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "VA displays offer the fastest response times, making them ideal for fast-action gaming.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "VA displays maintain consistent color accuracy and viewing angles that match or exceed IPS panels.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "VA displays completely eliminate color shifting, even when viewed from extreme angles.",
        "isCorrect": false
      }
    ],
    "explanation": "That VA displays provide better color accuracy and viewing angles than TN displays is the correct answer. VA panels improve color reproduction and viewing angles compared to TN panels, making them better for general use.\n\nThat VA displays offer the fastest response times, making them ideal for fast-action gaming is incorrect. TN panels are typically faster than VA panels in response times.\n\nThat VA displays completely eliminate color shifting, even when viewed from extreme angles is incorrect. VA panels can still show some color shifting at extreme angles.\n\nThat VA displays maintain consistent color accuracy and viewing angles that match or exceed IPS panels is incorrect. IPS panels generally provide more consistent color accuracy and viewing angles than VA."
  },
  {
    "id": "it_spec_15",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "A helpdesk engineer runs cabling at a construction site. The site needs to achieve 100 Mbps, but the manager wants them to use the oldest cabling first to get rid of it. Which cabling should the engineer use?",
    "options": [
      {
        "id": "opt_a",
        "text": "Cat 5e",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Cat 6",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Cat 6A",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Cat 5",
        "isCorrect": true
      }
    ],
    "explanation": "Cat 5 cable supports the older 100 Mbps Fast Ethernet standard. It is no longer commercially available. A technician will probably need to rewire the network cabled with Cat 5 to support Gigabit Ethernet.\n\nCat 5e would still be an acceptable choice for providing Gigabit Ethernet links for client computers, but most sites now opt to install Cat 6 cable.\n\nThe improved construction standards for Cat 6 mean that it is more reliable than Cat 5e for Gigabit Ethernet, and it can also support 10 Gbps over a reduced range.\n\nCat 6A supports 10 Gbps over 100 m, but the cable is bulkier and heavier than Cat 5e and Cat 6, and the installation requirements are more stringent."
  },
  {
    "id": "it_spec_16",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are troubleshooting a desktop PC that has stopped recognizing a network interface card (NIC) installed in a PCI slot.\nAfter verifying that the NIC is functional, what is the next step you should take to resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Check the motherboard's BIOS/UEFI settings to ensure the PCI slot is enabled.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Replace the NIC with a PCIe card and install it in a PCIe slot.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Move the NIC to a DIMM slot to test for compatibility issues.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Install a new CPU to improve the motherboard's PCI slot performance.",
        "isCorrect": false
      }
    ],
    "explanation": "Some motherboards allow users to enable or disable specific slots through the BIOS/UEFI settings. Ensuring the PCI slot is enabled is a logical troubleshooting step when the NIC is not recognized.\n\nWhile PCIe is a newer interface, replacing the NIC without confirming the root cause of the issue is unnecessary and may not resolve the problem.\n\nDIMM slots are for RAM modules, not for NICs or other adapter cards. This is not a valid troubleshooting step.\n\nThe CPU does not directly control the PCI slot's functionality. Replacing the CPU is unrelated to resolving this issue."
  },
  {
    "id": "it_spec_17",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are assembling a desktop PC and need to connect the motherboard to the power supply.\nThe power supply has a 24-pin ATX connector, but the motherboard has a 20-pin power connector.\nWhat should you do to ensure proper power delivery to the motherboard?",
    "options": [
      {
        "id": "opt_a",
        "text": "Cut off the extra 4 pins from the 24-pin ATX connector to make it fit the 20-pin connector.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Use an adapter to convert the 24-pin ATX connector into a 20-pin connector.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Replace the power supply with one that has a 20-pin ATX connector.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Use the 24-pin ATX connector and leave the extra 4 pins hanging off the side of the motherboard connector.",
        "isCorrect": true
      }
    ],
    "explanation": "Most modern 24-pin ATX connectors are designed to be backward compatible with 20-pin motherboard connectors. The extra 4 pins can be left hanging off the side without causing any issues, ensuring proper power delivery.\n\nCutting the connector would permanently damage the power supply and is unnecessary, as the 24-pin connector is designed to work with 20-pin connectors.\n\nWhile an adapter could work, it is not required because the 24-pin connector is already compatible with 20-pin connectors.\n\nReplacing the power supply is unnecessary, as the 24-pin connector is designed to work with 20-pin motherboards."
  },
  {
    "id": "it_spec_18",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following BEST describes the primary reason RS-232 serial ports are considered a legacy interface in modern computing?",
    "options": [
      {
        "id": "opt_a",
        "text": "RS-232 serial ports are incompatible with modern operating systems.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "RS-232 serial ports transmit data at slower rates compared to modern interfaces like USB.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "RS-232 serial ports are physically larger than modern connectors like USB-C.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "RS-232 serial ports are unable to support digital data transmission.",
        "isCorrect": false
      }
    ],
    "explanation": "RS-232 serial ports support data rates up to about 115 Kbps, which is significantly slower than modern interfaces like USB. The slower data transmission rate is one of the primary reasons RS-232 has been largely replaced by USB in modern computing.\n\nRS-232 serial ports are still compatible with modern operating systems, often through the use of USB-to-serial adapters. The issue is not compatibility but rather the slower data rates and less sophisticated signaling compared to modern interfaces.\n\nRS-232 does support digital data transmission. However, it uses less sophisticated signaling methods compared to modern interfaces like USB, which makes it less efficient and slower.\n\nWhile RS-232 connectors like DB9 are larger than USB-C, the physical size is not the primary reason for their obsolescence. The main issue is their slower data transmission rates and limited functionality compared to modern alternatives."
  },
  {
    "id": "it_spec_19",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following components is most likely to use a Molex power connector?",
    "options": [
      {
        "id": "opt_a",
        "text": "Monitor",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "USB external hard drive",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "SATA SSD",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Case fan or older hard disk drive (HDD)",
        "isCorrect": true
      }
    ],
    "explanation": "Molex power connectors are commonly used to provide power case fans for older hard disk drive (HDD). Molex connectors are 4-pin power connectors traditionally found in older computer systems. They are often used to power devices such as case fans, optical drives, and older hard disk drives. They provide a reliable power connection but lack the more modern features found in newer power connectors.\n\nA SATA SSD does not use a Molex connector. Instead, it relies on a SATA power connector, which is specifically designed for SATA-based drives and offers a more compact and streamlined design compared to Molex.\n\nA monitor is powered externally through its own dedicated power cable and does not connect directly to the computer's internal power supply.\n\nA USB external hard drive is powered through its USB connection or via an external power adapter."
  },
  {
    "id": "it_spec_20",
    "topic": "Installing Motherboards and Connectors",
    "type": "single",
    "requiredSelections": 1,
    "question": "A marketing manager needs to connect a laptop to a large wall-mounted LED TV in an auditorium to make a presentation that includes high-resolution video and audio.\nWhich of the following cable types would work BEST for connecting the laptop to the display?",
    "options": [
      {
        "id": "opt_a",
        "text": "DVI",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "VGA",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "HDMI",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "S/PDIF",
        "isCorrect": false
      }
    ],
    "explanation": "HDMI is the default cable standard for newer electronic devices, such as Blu-ray players and LED TVs. HDMI can carry both digital video and audio signals. Most modern computers include an HDMI port.\n\nDVI and VGA only support video signals.\n\nS/PDIF cables and ports are used to send a digital audio signal to high-end audio devices. It does not support video signals."
  },
{

      },

  },
  {
    "id": "psu_03",
    "topic": "Power Supplies and Cooling",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which component is responsible for transferring heat from the CPU to the liquid in a liquid cooling system?",
    "options": [
      {

        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Water block",

      },
      {
        "id": "opt_c",
        "text": "Pump",
        "isCorrect": false
      },
      {
        "id": "opt_d",

      }
    ],
    "explanation": "The water block is a crucial component of a liquid cooling system. It is attached directly to the CPU and transfers heat from the processor to the coolant (liquid) that circulates through the system. The liquid is then cooled down by passing through the radiator before it is recirculated."
  },
  {
    "id": "psu_04",
    "topic": "Power Supplies and Cooling",
    "type": "multiple",
    "requiredSelections": 3,
    "question": "You need to replace the power supply in your home desktop computer.\nWhich of the following specifications are the MOST likely to affect your power supply choice? (Select three.)",

      {
        "id": "opt_a",
        "text": "Form factor",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "A fan that cools the unit",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Output wattage",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Input voltage selections",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "An on/off power switch",
        "isCorrect": false
      },
      {
        "id": "opt_f",
        "text": "Type and number of connectors",
        "isCorrect": true
      },
      {
        "id": "opt_g",
        "text": "Output voltage selections",
        "isCorrect": false
      }
    ],
    "explanation": "When choosing a power supply:\nSelect the power supply form factor that matches the motherboard and case form factor (ATX, Micro-ATX, Mini-ITX, etc.).\nMake sure that the power supply has the correct type and number of power connectors for all of your devices.\nSelect a power supply with sufficient watts to power all devices. The higher the wattage, the more internal and external devices can be supported.\nNearly all power supplies can accept between 100 and 240 volts of AC input power. Use the switch on the back to specify the input power that is appropriate for the voltage used in your country.\nAll power supplies output +/-5 and +/-12 volts of DC output power.\nIn addition, most power supplies provide an on/off switch, and all power supplies provide some type of cooling (such as a fan)."
  },
  {
    "id": "psu_05",
    "topic": "Power Supplies and Cooling",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following thermal solutions might you find on memory modules?",
    "options": [
      {
        "id": "opt_a",
        "text": "Liquid cooling",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Surface area dissipation",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Active heat sink",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Passive heat sink",
        "isCorrect": true
      }
    ],
    "explanation": "Memory modules use passive heat sinks (also called heat spreaders). They do not have a fan because they rely on increased surface area and passive air movement to cool them.\n\nActive heat sinks are used by components that generate more heat, such as CPUs, high-end video cards, and some motherboard chipsets with integrated graphics.\n\nSurface area dissipation is a generic term for cooling used by both active and passive cooling systems.\n\nLiquid cooling systems are used when air cooling is not sufficient. Liquid-based cooling systems are composed of tubes, cooling plates, a reservoir, and a radiator, primarily used for high-end gaming computers and high-performance systems."
  },

  {
    "id": "psu_07",
    "topic": "Power Supplies and Cooling",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have a desktop computer that provides a 250-watt power supply. You recently added a four-disk RAID 10 array to the system, and now it spontaneously shuts down.\nWhich of the following would MOST likely solve this issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Upgrade to a power supply that provides more volts.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Use the switch on the power supply to switch from 115 VAC to 230 VAC.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Upgrade to smaller capacity hard drives.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Upgrade to a power supply that provides more watts.",
        "isCorrect": true
      }
    ],
    "explanation": "The number of devices a power supply can support is directly related to the number of watts the power supply provides. In this situation, the new RAID array, along with all of the other components in the system, is drawing more watts than the power supply can provide. A watt is a rating for the amount of work that the power supply can perform.\n\nVolts measure electrical pressure and are not directly related to the number of supportable devices. The voltage is dependent on the wall socket's voltage. The voltage switch on the power supply should match the voltage at the wall outlet. 115 is used in the United States, while 230 is typically used in Europe."
  },
  {
    "id": "psu_08",
    "topic": "Power Supplies and Cooling",
    "type": "single",
    "requiredSelections": 1,
    "question": "Your company relocated you from the United States to their United Kingdom office in London. You brought your personal computer with you, and you are in the process of setting it up. Your computer was previously configured to receive 115 VAC, but the electricity in London uses 230 VAC.\nWhich of the following would allow your computer to run on 230 VAC?",
    "options": [
      {
        "id": "opt_a",
        "text": "Inspect the power supply unit for a manual voltage switch and move it to 230 VAC. Otherwise, no action is necessary.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Purchase a new power supply that is compatible with 230 VAC.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Purchase a voltage converter and plug your computer into the converter box.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Edit the BIOS and modify the voltage input setting.",
        "isCorrect": false
      }
    ],
    "explanation": "Most power supplies have the capacity to receive either 115 or 230 volts of power just by toggling a switch on the power supply case. However, modern power supplies generally support automatic voltage switching with no action required. You can use this switch when using the power supply in other countries. The 115-volt setting is used in the United States. 230 volts is used in Europe.\n\nBecause most power supplies support both 115 VAC and 230 VAC, you probably don't need to purchase an external voltage converter.\n\nBIOS does not provide a voltage input setting to switch from 115 VAC to 230 VAC."
  },
  {

      }
    ],
    "explanation": "Voltage levels should be within +/- 5% of normal. In this case, the 12 V rail on the power supply should be between 11.4 and 12.6 volts. Because the voltage registers as +10.1 volts, the power supply is bad or failing and should be replaced.\n\nSwitching the voltage selector on the back from 220 VAC to 110 VAC will not resolve the voltage output.\n\nDisconnecting all devices drawing power before testing would make the testing invalid. You need to test the load with the devices attached."
  },
  {
    "id": "psu_10",
    "topic": "Power Supplies and Cooling",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "An employee submits a support ticket stating that their computer will not turn on.\nWhich of the following troubleshooting steps should you take first? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Use a multimeter to test the power supply.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Make sure that the keyboard and mouse are plugged in.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Open the computer and replace the power supply.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Make sure that the surge protector is turned on.",
        "isCorrect": true
      },
      {
        "id": "opt_e",
        "text": "Make sure that the power cord is plugged into the wall.",
        "isCorrect": true
      }
    ],
    "explanation": "When troubleshooting the power supply, always check the following before opening up the computer:\nMake sure that the power cord is plugged into the wall.\nVerify that any surge protectors are plugged in and in the On position.\nMake sure that the power supply's switch is in the On position.\nOnly after you identify that the power supply is the problem should you replace it.\n\nThe keyboard and mouse being unplugged will not prevent the computer from powering on.\n\nTest the power supply using a multimeter only after ruling out the obvious potential issues."
  },
  {
    "id": "psu_11",
    "topic": "Power Supplies and Cooling",
    "type": "single",
    "requiredSelections": 1,
    "question": "A hardware technician is ordering power supply units (PSUs) for the organization's desktop computers. Most PSUs designed for use with desktop PCs are based on which form factor?",

        "text": "Mini-ITX",

      },

        "id": "opt_b",
        "text": "PCIe",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "SFF",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "ATX",
        "isCorrect": true
      }
    ],
    "explanation": "The ATX form factor is the most common standard used for PSU designs. Mini-ITX is a less common, small-footprint motherboard design. PCIe is a connectivity standard for expansion cards. Small Form Factor (SFF) is a standardized small case design standard."
  },
  {
    "id": "psu_12",
    "topic": "Power Supplies and Cooling",
    "type": "single",
    "requiredSelections": 1,
    "question": "A hardware technician installed a new power supply unit (PSU) in a workstation and removed unnecessary power connector cables. What type of PSU did the technician install?",

      },
      {
