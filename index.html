  {
    "id": "net_comms_05",
    "topic": "Network Communications",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following best describes the primary reason why Transmission Control Protocol (TCP) is considered a \"connection-oriented\" protocol?",
    "options": [
      {
        "id": "opt_a",
        "text": "It establishes a connection using a three-way handshake and ensures reliable data delivery.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "It prioritizes speed over reliability, making it suitable for time-sensitive applications like video streaming.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "It uses encryption to secure data transmissions and prevent unauthorized access.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "It assigns random port numbers to ensure that multiple applications can communicate simultaneously.",
        "isCorrect": false
      }
    ],
    "explanation": "TCP is a \"connection-oriented\" protocol due to its ability to establish a connection using a three-way handshake (SYN, SYN/ACK, ACK). It ensures reliable data delivery by assigning sequence numbers, allowing acknowledgments (ACK), and retransmitting missing or damaged packets. These features make TCP reliable for applications that cannot tolerate missing or corrupted data.\n\nEncryption is not a defining feature of TCP itself. While some application protocols that use TCP (e.g., HTTPS, SSH) implement encryption, TCP's primary role is to ensure reliable data delivery, not to secure the data. Encryption is an additional layer provided by specific application protocols.\n\nTCP prioritizes reliability over speed. It ensures that all data packets are delivered in the correct order and retransmits missing packets, which introduces overhead and delays. Time-sensitive applications like video streaming typically use UDP, which sacrifices reliability for speed.\n\nWhile TCP does assign random source port numbers for client communication, this is not the primary reason TCP is considered \"connection-oriented.\" The random port assignment is a feature of the Transport layer but does not define the connection-oriented nature of TCP."
  },

  {
    "id": "net_comms_07",
    "topic": "Network Communications",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which layer of the TCP/IP protocol stack is responsible for assigning port numbers to network applications?",
    "options": [
      {
        "id": "opt_a",
        "text": "Application Layer",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Link Layer",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Internet Layer",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Transport Layer",
        "isCorrect": true
      }
    ],
    "explanation": "The Transport layer is responsible for assigning port numbers to network applications. This layer ensures that data is sent and received by the correct application by using port numbers, which range from 0 to 65535. For example, HTTP uses port 80, and email services like SMTP use port 25.\n\nThe Link layer is responsible for moving frames of data between hosts using MAC addresses. It does not deal with port numbers or application-level communication. This layer operates at a lower level than the Transport layer and is concerned with physical and data link communication.\n\nThe Internet layer is responsible for addressing and routing data packets across networks using IP addresses. It does not assign port numbers, as its primary function is to ensure packets are delivered to the correct host, not the correct application.\n\nThe Application layer is where network applications operate, such as web browsers or email clients. While applications use port numbers to communicate, the actual assignment and management of port numbers are handled by the Transport layer, not the Application layer."
  },
  {
    "id": "net_comms_08",
    "topic": "Network Communications",
    "type": "single",
    "requiredSelections": 1,
    "question": "Why does the Transport layer use port numbers in network communication?",
    "options": [
      {
        "id": "opt_a",
        "text": "To ensure data is routed to the correct network",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To encrypt data for secure transmission",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To distinguish between applications communicating on the same device",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "To identify the physical address of the destination device",
        "isCorrect": false
      }
    ],
    "explanation": "The Transport layer uses port numbers to identify and distinguish between multiple applications running on the same device. For example, a device might be running a web browser (using port 80 for HTTP) and an email client (using port 25 for SMTP) simultaneously. Port numbers ensure that data is delivered to the correct application.\n\nIdentifying the physical address (e.g., MAC address) is the responsibility of the Link layer, not the Transport layer. The Transport layer focuses on managing communication between applications, not physical devices.\n\nRouting data to the correct network is the responsibility of the Internet layer, which uses IP addresses for this purpose. The Transport layer works at a higher level, focusing on application-specific communication.\n\nEncryption is not a function of the Transport layer. While some protocols that operate at the Transport layer (e.g., HTTPS) use encryption, the encryption itself is handled by the application layer or security protocols, not by the Transport layer."
  },
  {

  {
    "id": "net_comms_10",
    "topic": "Network Communications",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network administrator troubleshoots a video conferencing application that occasionally experiences minor glitches, such as dropped video frames or slight audio delays.\nAfter analyzing the network traffic, the administrator observes that the application uses a connectionless protocol with minimal overhead.\nBased on this information, which conclusion can the administrator make about the protocol being used and its suitability for the application?",

      },
      {
        "id": "opt_b",
        "text": "The application uses SSH, which is unsuitable because it is designed for secure remote access, not real-time communication.",

      },
      {
        "id": "opt_c",

    "explanation": "UDP is a connectionless protocol with minimal overhead, making it ideal for time-sensitive applications like video conferencing. While it does not guarantee the delivery or sequencing of packets, it allows for faster communication, and minor glitches (e.g., dropped frames) are acceptable in this context. The administrator's observation of a connectionless protocol aligns with UDP's characteristics, confirming its suitability for the application.\n\nTCP is a connection-oriented protocol that ensures reliable delivery of data through acknowledgments and retransmissions. This adds overhead and latency, making it unsuitable for real-time applications like video conferencing. The administrator's observation of a connectionless protocol rules out TCP.\n\nHTTPS is an application-layer protocol used for secure communication over the web. It relies on TCP for reliable data delivery and is not designed for real-time communication. The administrator's observation of minimal overhead and a connectionless protocol does not align with HTTPS.\n\nSSH is a protocol used for secure remote access to servers and devices. It relies on TCP for reliable and encrypted communication, making it unsuitable for video conferencing. The administrator's observation of a connectionless protocol rules out SSH as a possibility."

{

    "question": "An organization has implemented VLANs to separate traffic for its Sales, Finance, and IT departments. However, the IT team notices that devices in the Sales VLAN cannot communicate with devices in the Finance VLAN, even though some applications require inter-department communication.\nWhat is the MOST likely cause of this issue, and how can it be resolved?",

        "text": "The switch is not configured with a router or Layer 3 device to enable inter-VLAN communication.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "The VLANs are misconfigured, and all devices should be assigned to the same VLAN to allow communication.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "The devices in the Sales VLAN and Finance VLAN are using different IP address ranges, which prevents communication.",

      {
        "id": "opt_d",
        "text": "VLANs are designed to block all inter-VLAN communication, and the network must be reconfigured to use a single VLAN.",

  {
    "id": "net_config_con_05",
    "topic": "Network Configuration Concepts",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the primary purpose of a Virtual LAN (VLAN)?",
    "options": [
      {
        "id": "opt_a",
        "text": "To replace the need for a Domain Name System (DNS)",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To assign static IP addresses to devices on a network",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To logically segment a network into smaller, isolated broadcast domains",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "To physically separate devices on a network",
        "isCorrect": false
      }
    ],
    "explanation": "VLANs are designed to logically divide a network into separate broadcast domains, even if the devices are connected to the same physical switch. This helps improve network performance and security by isolating traffic.\n\nVLANs do not involve physical separation of devices. Instead, VLANs achieve logical separation, allowing devices to communicate as if they are on separate physical networks without requiring additional hardware.\n\nVLANs are not responsible for assigning IP addresses. Assigning static or dynamic IP addresses is typically managed by DHCP or manual configuration, not VLANs.\n\nVLANs and DNS serve entirely different purposes. DNS resolves hostnames to IP addresses, while VLANs are used for network segmentation and traffic isolation."
  },
  {

    "topic": "Network Configuration Concepts",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that they cannot access a specific website (e.g., www.example.com), but other websites are working fine.\nYou perform a DNS query for the domain and receive a \"Non-Existent Domain\" (NXDOMAIN) response.\nWhat is the MOST likely cause of the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "The user's device has an incorrect subnet mask configured in its TCP/IP settings.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "The domain name (e.g., www.example.com) does not exist or is not registered in the DNS hierarchy.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "The user's local DNS cache is corrupted and needs to be cleared.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The DNS server is down and not responding to any queries.",
        "isCorrect": false
      }
    ],
    "explanation": "An NXDOMAIN response from a DNS query indicates that the queried domain name does not exist in the DNS hierarchy. This could mean the domain name is not registered, expired, or incorrectly configured in the DNS system.\n\nIf the DNS server were down, you would not receive an NXDOMAIN response. Instead, you would likely encounter a timeout or no response at all. The NXDOMAIN response specifically indicates that the queried domain name does not exist.\n\nThe subnet mask is used for local network communication and routing, not DNS resolution. An incorrect subnet mask would prevent the device from communicating with the network properly but would not result in an NXDOMAIN response for a specific domain.\n\nA corrupted local DNS cache might cause issues with resolving domain names, but it would not result in an NXDOMAIN response from the DNS server. Clearing the cache might resolve other issues, but it would not fix a problem where the domain name does not exist in the DNS hierarchy."
  },

  {
    "id": "net_config_con_08",
    "topic": "Network Configuration Concepts",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network administrator notices that several devices on the network are unable to connect to the internet. Upon investigation, they find that the affected devices have IP addresses in the 169.254.x.x range.\nThe DHCP server appears to be running, and other devices on the network are functioning correctly.\nWhat is the MOST likely cause of the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "The DNS server is misconfigured, preventing devices from resolving domain names.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "The DHCP scope does not have enough available IP addresses to assign to new devices.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "The affected devices are using static IP addresses that conflict with the DHCP scope.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The DHCP server is configured with an incorrect subnet mask for the network.",
        "isCorrect": false
      }
    ],
    "explanation": "Devices receiving an IP address in the 169.254.x.x range indicate that they could not obtain an IP address from the DHCP server. If the DHCP scope has run out of available IP addresses, the server cannot assign new addresses to devices, causing them to self-assign an APIPA address. This scenario matches the symptoms described.\n\nThe issue described is related to IP address assignment, not domain name resolution. A misconfigured DNS server would cause problems with resolving domain names (e.g., accessing websites), but devices would still have valid IP addresses assigned by the DHCP server.\n\nDevices with static IP addresses would not attempt to contact the DHCP server for an address. Additionally, a conflict with the DHCP scope would not result in the devices receiving an APIPA address (169.254.x.x).\n\nAn incorrect subnet mask on the DHCP server would typically cause connectivity issues for all devices on the network, not just a subset. The scenario specifies that other devices are functioning correctly, which rules out this possibility."
  },
  {

    "question": "A remote employee needs to securely access their company's internal network while working from a coffee shop's public Wi-Fi.\nWhich solution should the employee use to ensure their data is protected during transmission?",

    "explanation": "The correct solution is to use a VPN, which creates a secure and encrypted connection between the employee's device and the company's internal network. This ensures that sensitive data transmitted over the public Wi-Fi is protected from potential eavesdropping or interception.\n\nWhile a static IP address might be useful for certain network configurations, it does not provide encryption or secure communication over an untrusted network like public Wi-Fi. This does not address the need for data protection.\n\nUsing the coffee shop's DNS server does not ensure secure communication. DNS servers are used to resolve domain names into IP addresses, but they do not encrypt data or protect against interception on public networks.\n\nA VLAN is used to segment a network into smaller, isolated sub-networks for traffic management. However, it is not a practical or feasible solution for a remote employee working on a public Wi-Fi network, nor does it provide encryption or secure communication."

  {
    "id": "net_config_con_11",
    "topic": "Network Configuration Concepts",
    "type": "single",
    "requiredSelections": 1,
    "question": "How does a Virtual Private Network (VPN) ensure secure communication over an untrusted network?",
    "options": [
      {
        "id": "opt_a",
        "text": "By encrypting data transmitted between the client and the server",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "By resolving domain names into IP addresses for secure access",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "By dynamically assigning IP addresses to devices on the network",

      },
      {
        "id": "opt_d",
        "text": "By dividing a network into smaller segments to isolate traffic",
        "isCorrect": false
      }
    ],
    "explanation": "A VPN ensures secure communication over an untrusted network, such as the internet, by encrypting the data transmitted between the client and the server. This encryption prevents unauthorized parties from intercepting or accessing sensitive information during transmission.\n\nDynamically assigning IP addresses to devices on the network describes the function of a DHCP server, not a VPN. DHCP is responsible for assigning IP addresses to devices automatically, but it does not provide encryption or secure communication.\n\nResolving domain names into IP addresses for secure access is the function of the Domain Name System (DNS), which translates domain names into IP addresses. While DNS is essential for network communication, it does not provide the encryption or secure tunneling that a VPN offers.\n\nDividing a network into smaller segments to isolate traffic describes the purpose of a Virtual LAN (VLAN), which is used to segment a network for better traffic management. While VLANs improve network efficiency, they do not provide the secure communication features of a VPN."
  },
  {
    "id": "net_config_con_12",
    "topic": "Network Configuration Concepts",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the primary purpose of a DHCP server in a network?",
    "options": [
      {
        "id": "opt_a",
        "text": "To manually assign static IP addresses to all devices on the network",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To act as a firewall and block unauthorized access to the network",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To allocate IP addresses dynamically to devices on the network",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "To resolve domain names into IP addresses for devices on the network",
        "isCorrect": false
      }
    ],
    "explanation": "The primary purpose of a DHCP (Dynamic Host Configuration Protocol) server is to dynamically assign IP addresses, subnet masks, and other configuration settings (e.g., default gateway, DNS server) to devices on the network. This eliminates the need for manual configuration and reduces the risk of errors such as duplicate IP addresses.\n\nDHCP is specifically designed to automate the process of assigning IP addresses dynamically. Manually assigning static IP addresses is the opposite of what DHCP is intended to do, and it is prone to errors and inefficiencies.\n\nResolving domain names into IP addresses is the function of a DNS (Domain Name System) server, not a DHCP server. While both DHCP and DNS are important for network functionality, they serve different purposes.\n\nActing as a firewall is not a function of a DHCP server. Firewalls are separate devices or software designed to monitor and control incoming and outgoing network traffic based on security rules. DHCP servers are focused on IP address allocation and configuration."
  },
  {
    "id": "net_config_con_13",
    "topic": "Network Configuration Concepts",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the primary purpose of a DNS query in a network?",
    "options": [
      {
        "id": "opt_a",
        "text": "To encrypt communication between a client and a server",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To resolve a hostname or FQDN to an IP address",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "To establish a secure connection for web traffic",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "To assign IP addresses dynamically to devices on the network",
        "isCorrect": false
      }
    ],
    "explanation": "The purpose of a DNS query is to resolve a hostname or Fully Qualified Domain Name (FQDN) into an IP address. This process allows users to access resources on the network or the internet using human-readable names instead of numerical IP addresses.\n\nAssigning IP addresses dynamically is the role of the DHCP (Dynamic Host Configuration Protocol), not DNS. DNS is responsible for name resolution, not IP address allocation.\n\nDNS does not handle encryption of communication. Encryption is typically handled by protocols like HTTPS (using SSL/TLS) or other security mechanisms. DNS is focused on resolving names to IP addresses.\n\nEstablishing secure connections for web traffic is the role of HTTPS (port 443) or other secure protocols, not DNS. DNS is not involved in securing connections but rather in resolving names to IP addresses."
  },
  {

  {
    "id": "net_config_con_15",
    "topic": "Network Configuration Concepts",
    "type": "single",
    "requiredSelections": 1,
    "question": "A company has a single physical switch connecting all its devices, including accounting, HR, and IT departments. The IT manager notices that broadcast traffic from one department is affecting the performance of other departments.\nTo address this issue, the IT manager decides to implement VLANs.\nWhich configuration would BEST solve the problem?",

      },

        "text": "Enable a single VLAN for all devices to centralize traffic management.",

      },

      },

        "id": "opt_d",

  },

  {
    "id": "cnaaic_10",
    "topic": "Configuring Network Addressing and Internet Connections",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are configuring a small office/home office (SOHO) network. You notice that devices on your local network can communicate with each other but cannot access the internet.\nUpon investigation, you find that the router's IPv4 forwarding feature is disabled.\nWhat action should you take to resolve the issue and enable internet connectivity for the devices on your network?",
    "options": [
      {
        "id": "opt_a",
        "text": "Enable NAT (Network Address Translation) on the router.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Assign static IP addresses to all devices on the network.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Enable IPv4 forwarding on the router.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Configure a new subnet mask for the local network.",
        "isCorrect": false
      }
    ],
    "explanation": "IPv4 forwarding is responsible for routing packets between different networks, such as your local network and the internet. When IPv4 forwarding is disabled, the router cannot forward packets from the local network to the internet. Enabling IPv4 forwarding ensures that the router can route traffic between the local network and external networks, resolving the issue.\n\nWhile NAT is essential for translating private IP addresses to a public IP address for internet access, it is not the root cause of the issue described. The problem lies in the router's inability to forward packets due to IPv4 forwarding being disabled. Enabling NAT without enabling IPv4 forwarding will not resolve the issue.\n\nAssigning static IP addresses can help with network organization but does not address the issue of packet forwarding. The devices already have IP addresses and can communicate locally, so the problem is not related to IP address assignment but to the router's forwarding functionality.\n\nA subnet mask determines the range of IP addresses within a network and is unrelated to the router's ability to forward packets between networks. Changing the subnet mask will not resolve the issue of devices being unable to access the internet due to disabled IPv4 forwarding."
  },
  {
    "id": "cnaaic_11",
    "topic": "Configuring Network Addressing and Internet Connections",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that they cannot access a specific website (e.g., www.example.com), but other websites are working fine.\nYou perform a DNS query for the domain and receive a \"Non-Existent Domain\" (NXDOMAIN) response.\nWhat is the MOST likely cause of the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "The user's device has an incorrect subnet mask configured in its TCP/IP settings.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "The domain name (e.g., www.example.com) does not exist or is not registered in the DNS hierarchy.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "The user's local DNS cache is corrupted and needs to be cleared.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The DNS server is down and not responding to any queries.",
        "isCorrect": false
      }
    ],
    "explanation": "An NXDOMAIN response from a DNS query indicates that the queried domain name does not exist in the DNS hierarchy. This could mean the domain name is not registered, expired, or incorrectly configured in the DNS system.\n\nIf the DNS server were down, you would not receive an NXDOMAIN response. Instead, you would likely encounter a timeout or no response at all. The NXDOMAIN response specifically indicates that the queried domain name does not exist.\n\nThe subnet mask is used for local network communication and routing, not DNS resolution. An incorrect subnet mask would prevent the device from communicating with the network properly but would not result in an NXDOMAIN response for a specific domain.\n\nA corrupted local DNS cache might cause issues with resolving domain names, but it would not result in an NXDOMAIN response from the DNS server. Clearing the cache might resolve other issues, but it would not fix a problem where the domain name does not exist in the DNS hierarchy."
  },

  {
    "id": "cnaaic_13",
    "topic": "Configuring Network Addressing and Internet Connections",
    "type": "single",
    "requiredSelections": 1,
    "question": "An IT administrator is troubleshooting a file transfer issue between a client and a server.\nUsing a protocol analyzer, the administrator observes that the client sends a SYN packet to the server, and the server responds with a SYN/ACK packet, but the client does not send the final ACK packet.\nBased on this observation, what is the MOST likely cause of the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "The server is using UDP instead of TCP, which does not require a three-way handshake.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "The client's application is using an outdated version of the protocol, which does not support the three-way handshake.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "The client's TCP connection is being blocked by a firewall, preventing the completion of the three-way handshake.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "The server's port number is incorrectly configured, causing the client to fail to respond.",
        "isCorrect": false
      }
    ],
    "explanation": "The three-way handshake (SYN, SYN/ACK, ACK) is a fundamental part of establishing a TCP connection. If the client does not send the final ACK packet, it is likely that something is blocking the connection, such as a firewall or security rule. TCP requires this handshake to establish a reliable connection, and any interruption in this process will prevent the connection from being established.\n\nThe scenario explicitly describes the SYN and SYN/ACK packets, which are part of the TCP handshake process. UDP does not use a three-way handshake, so the presence of SYN and SYN/ACK packets confirms that TCP is being used.\n\nThe server has already responded with a SYN/ACK packet, indicating that the port configuration is correct and the server is listening for connections. The issue lies with the client's failure to send the final ACK packet, not the server's port configuration.\n\nThe three-way handshake is a fundamental feature of TCP and has been part of the protocol since its inception. There is no \"outdated version\" of TCP that lacks this feature. The issue is more likely related to network interference, such as a firewall blocking the connection."
  },

  {
    "id": "cnaaic_19",
    "topic": "Configuring Network Addressing and Internet Connections",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are troubleshooting a network application that streams live video. Users report occasional glitches in the video, such as brief freezes or distorted frames, but the application does not crash.\nWhich Transport Layer protocol is MOST likely being used by this application?",
    "options": [
      {
        "id": "opt_a",
        "text": "Transmission Control Protocol (TCP)",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "User Datagram Protocol (UDP)",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Address Resolution Protocol (ARP)",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Internet Protocol (IP)",
        "isCorrect": false
      }
    ],
    "explanation": "UDP is the correct answer because it is commonly used for time-sensitive applications like live video streaming. UDP provides connectionless, unreliable forwarding, which means it does not guarantee delivery or order of packets. This trade-off allows for faster transmission, which is critical for live video, even if some packets are lost or arrive out of order. The occasional glitches reported by users are consistent with the characteristics of UDP.\n\nTCP is incorrect because it provides reliable, connection-oriented forwarding, ensuring all packets are delivered in order and without loss. While this reliability is beneficial for applications like file transfers or web browsing, it introduces additional overhead and latency, making it unsuitable for live video streaming, where speed is more critical than perfect reliability.\n\nARP is incorrect because it operates at the Internet Layer, not the Transport Layer. Its function is to map IP addresses to MAC addresses for devices on the same local network. It does not handle the transport of data or affect how video streaming applications function.\n\nIP is incorrect because it operates at the Internet Layer, not the Transport Layer. While IP is responsible for addressing and routing packets between networks, it does not manage the connection or determine whether the application uses TCP or UDP."
  },

    "explanation": "Because Telnet transmits data in plaintext, it is vulnerable to eavesdropping and interception by malicious actors, which can lead to unauthorized access and data breaches.\n\nTelnet does not encrypt data transmissions. This is a common misconception. The lack of encryption is a significant security flaw, as it allows data to be intercepted in plaintext.\n\nTelnet does not use any secure tunneling protocol. This statement is false because Telnet lacks built-in security features to protect data integrity and confidentiality.\n\nTelnet does not inherently require multi-factor authentication. This statement is misleading, as Telnet's standard implementation does not include advanced authentication mechanisms, making it less secure compared to modern alternatives like SSH."

  {

    "topic": "Networked Host Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "Your company has recently experienced issues with inconsistent timestamps on transaction logs across multiple servers, leading to difficulties in tracking and auditing activities.\nAs the network administrator, you need to resolve this issue to ensure all servers have synchronized time.\nWhich of the following actions should you take to address this problem?",

    "explanation": "By installing and configuring a centralized Time Server, you can ensure that all devices on the network have synchronized time, which will resolve the issue of inconsistent timestamps on transaction logs.\n\nWhile a Database Server can help manage and store data, it does not address the issue of time synchronization across servers, which is the root cause of the inconsistent timestamps.\n\nHTTPS is used to secure data transmission over the network but does not directly affect the synchronization of time across servers. It does not resolve the issue of inconsistent timestamps.\n\nWhile setting up an FTP server for backups can aid in data recovery and auditing, it does not address the core issue of time synchronization, which is necessary for consistent timestamps."

  {

    "type": "single",

    "question": "Your organization has been experiencing intermittent email delivery failures, and you have been tasked with analyzing the issue.\nUpon investigation, you discover that the mail server is frequently reaching its maximum capacity for concurrent connections.\nWhich of the following analyses would BEST help you determine the root cause of this problem?",

        "text": "Examine the web server's bandwidth usage to identify any potential network bottlenecks affecting email delivery.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Analyze the mail server's configuration settings to ensure they are optimized for handling the current volume of email traffic.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Review the database server's query performance to check for any delays in data retrieval impacting email processing.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Evaluate the file/print server's resource allocation to determine if it is affecting the mail server's performance.",
        "isCorrect": false
      }
    ],
    "explanation": "Analyzing the mail server's configuration settings is crucial in understanding why it might be reaching its maximum capacity for concurrent connections. By ensuring that the server is configured to handle the expected volume of email traffic, you can identify if the issue is due to misconfiguration or if the server needs to be upgraded to accommodate higher demand.\n\nWhile network bottlenecks can affect email delivery, examining the web server's bandwidth usage is not directly related to the mail server's capacity issues. The focus should be on the mail server itself, as it is the component experiencing the problem.\n\nDatabase server performance is not directly related to the mail server's ability to handle concurrent connections. While slow data retrieval can affect applications, it is unlikely to be the root cause of the mail server's capacity issues.\n\nThe file/print server's resource allocation is not relevant to the mail server's capacity for handling email connections. The analysis should focus on the mail server's settings and performance, as it is the system directly involved in email delivery."
  },
  {

    "explanation": "Mailbox servers are integral to email systems, as they store and manage email messages, handle the delivery process, and provide access to users through various email clients. This aligns with the core functions of mailbox servers.\n\nWhile spam filtering is an important aspect of email security, it is typically handled by a separate component known as a mail filter or gateway, not the mailbox server itself. The mailbox server's primary role is not focused on filtering but on storing and managing emails.\n\nWeb servers are responsible for hosting websites and web applications, whereas mailbox servers are dedicated to managing email communications.\n\nPrimarily managing the authentication and authorization of users attempting to access network resources pertains to the role of directory and authentication servers, which handle user authentication and authorization. Mailbox servers do not primarily manage these functions; instead, they focus on email storage and management."

  {
    "id": "net_host_serv_12",
    "topic": "Networked Host Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a network administrator tasked with securing your company's website to ensure that all data exchanged between your clients and the server is encrypted.\nYou need to implement a protocol that will provide this security by encrypting the data and verifying the server's identity.\nWhich of the following actions should you take to achieve this goal?",

        "isCorrect": true

        "text": "Enable NetBIOS over TCP/IP on the web server to allow secure data transmission.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Configure the website to use HTTP and ensure all data is transmitted over port 80.",
        "isCorrect": false
      }
    ],
    "explanation": "By installing a digital certificate and configuring the website to use HTTPS, you ensure that data is encrypted and the server's identity is verified, providing the necessary security for data exchange.\n\nHTTP does not encrypt data, leaving it vulnerable to interception. Port 80 is used for HTTP, which does not provide the security features required in the scenario.\n\nFTP, especially when operating over port 21, does not inherently provide encryption for data transmission. The scenario requires encrypted data exchange, which FTP does not fulfill without additional security measures like FTPS or SFTP.\n\nNetBIOS over TCP/IP is not related to securing web data transmission. It is an outdated protocol for network communication and does not provide the encryption and server identity verification required by the scenario."
  },
  {
    "id": "net_host_serv_13",

        "text": "Hosting websites and web applications",

    "explanation": "Mail servers are specifically designed to handle the sending, receiving, and storage of email messages. They manage email traffic and ensure that emails are delivered to the correct recipients. This is the primary function of mail servers.\n\nHosting websites and web applications is the primary function of web servers, not mail servers. Web servers use HTTP or HTTPS to serve web pages and applications to clients. This function is unrelated to the operations of mail servers.\n\nStoring and managing large amounts of structured data is associated with database servers, which are used to store, organize, and manage data for easy retrieval and manipulation. Mail servers do not primarily focus on data storage in the same way database servers do.\n\nProviding remote terminal access to network resources is typically associated with remote terminal access servers, which allow users to access network resources from remote locations. Mail servers do not provide this type of access, as their main role is to handle email communications."

  {
    "id": "net_host_serv_14",
    "topic": "Networked Host Services",
    "type": "multiple",
    "requiredSelections": 3,
    "question": "A web developer plans out a new website, including uniform resource locators (URLs) for each page. What are parts of the URL that the web developer will need to consider?",

        "id": "opt_c",
        "text": "Protocol",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "File path",
        "isCorrect": true
      }
    ],
    "explanation": "The developer will need to consider the fully qualified domain name (FQDN), which is not case-sensitive. The host location can also be an IP address; an IPv6 address must be in square brackets.\n\nThe developer will need to consider the protocol that describes the access method, which will likely be HyperText Transfer Protocol (HTTP) or HyperText Transfer Protocol Secure (HTTPS).\n\nThe developer will need to consider the file path, which specifies the directory and file name location of the resource (if required). The file path may or may not be case-sensitive.\n\nIn file server-based networks, a central machine provides dedicated file and print services to workstations. The benefits of server-based networks include ease of administration through centralization."

  {
    "id": "net_host_serv_15",
    "topic": "Networked Host Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "Your organization has recently deployed a Network Monitoring Server to address frequent network outages and potential security breaches.\nAfter a week of monitoring, you receive a report indicating a significant increase in network traffic during non-business hours, along with several failed login attempts from an unfamiliar IP address.\nAs the network analyst, how should you interpret these findings to enhance network security and performance?",
    "options": [
      {
        "id": "opt_a",
        "text": "Assume the network monitoring server is malfunctioning and schedule a maintenance check to resolve the issue.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Conclude that the increased traffic is due to legitimate after-hours work by employees, and no action is needed.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Determine that the failed login attempts are likely due to forgotten passwords and advise users to reset their credentials.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Analyze the report to identify potential unauthorized access attempts and recommend implementing stricter access controls.",

    "explanation": "Analyzing the report to identify potential unauthorized access attempts and recommending the implementation of stricter access controls and monitoring demonstrates an analytical approach by considering the possibility of unauthorized access based on the report's findings.\n\nConcluding that the increased traffic is due to legitimate after-hours work by employees and no action is needed overlooks the potential security threat posed by the unusual traffic patterns and failed login attempts. Analyzing the situation requires considering the possibility of unauthorized access rather than assuming all activity is legitimate.\n\nWhile forgotten passwords can cause failed login attempts, this explanation does not account for the unusual timing and unfamiliar IP address. A deeper analysis is needed to assess potential security risks.\n\nAssuming a malfunction without further investigation dismisses the potential security threat. Analyzing the data should focus on understanding the traffic patterns and addressing any security vulnerabilities."
  },
{
    "id": "iaea_01",
    "topic": "Internet and Embedded Appliances",
    "type": "single",
    "requiredSelections": 1,
    "question": "A company has recently experienced performance issues with its web application during peak usage times. The application is hosted on multiple servers, but users report slow response times and occasional timeouts.\nAs a network administrator, you are tasked with resolving these issues.\nWhich solution would BEST address the company's performance problems?",
    "options": [
      {
        "id": "opt_a",
        "text": "Set up a spam gateway to filter out unwanted email traffic.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Implement a load balancer to distribute incoming requests evenly across all servers.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Deploy an intrusion detection system to monitor and alert on suspicious activities.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Install a firewall to block unnecessary traffic and reduce server load.",
        "isCorrect": false
      }
    ],
    "explanation": "Implementing a load balancer will distribute incoming client requests evenly across all available servers. This helps to manage the load more effectively, preventing any single server from becoming overwhelmed and improving overall application performance during peak usage times.\n\nWhile a firewall can block unnecessary traffic, it does not address the distribution of legitimate client requests across multiple servers. The primary issue is related to load distribution, which is best handled by a load balancer.\n\nAn intrusion detection system (IDS) focuses on monitoring and alerting for suspicious activities, not on improving performance or distributing client requests. The performance issue is not related to security threats but to load management.\n\nA spam gateway is designed to filter email traffic, which is unrelated to the performance issues of a web application. The problem lies in managing web application requests, not email traffic."
  },
  {

    "requiredSelections": 1,

        "text": "Implement an intrusion prevention system (IPS).",
        "isCorrect": false
      },

        "id": "opt_b",
        "text": "Implement a firewall.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Implement a content filter.",
        "isCorrect": false

        "id": "opt_d",

      {
        "id": "opt_d",
        "text": "Outsource the management of the legacy system to a third-party vendor specializing in legacy systems.",
        "isCorrect": false
      }
    ],
    "explanation": "Conducting a risk assessment allows you to analyze the specific vulnerabilities of the legacy system and develop a targeted mitigation plan. This approach balances security needs with operational requirements by addressing vulnerabilities without disrupting business continuity.\n\nShutting down the legacy system immediately could disrupt business operations and is not a balanced approach. While it addresses security concerns, it fails to consider the operational impact and continuity of customer transactions.\n\nIgnoring the audit findings is not a responsible approach. The security risks associated with legacy systems, and failing to address these vulnerabilities could lead to exploitation and potential breaches.\n\nWhile outsourcing might provide some expertise in managing legacy systems, it does not directly address the specific vulnerabilities identified in the audit. A targeted mitigation plan based on a risk assessment would be more effective in balancing security and operational needs."
  },
  {
    "id": "iaea_04",
    "topic": "Internet and Embedded Appliances",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is a key characteristic of a legacy system?",
    "options": [
      {
        "id": "opt_a",
        "text": "A legacy system is designed to integrate seamlessly with new technologies.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "A legacy system is no longer directly supported by its vendor.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "A legacy system is always supported by its vendor with regular updates.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "A legacy system is typically used for modern applications and services.",
        "isCorrect": false
      }
    ],
    "explanation": "A legacy system is one that is no longer directly supported by its vendor. This lack of support is a defining characteristic of legacy systems and poses security risks.\n\nA legacy system is defined by the fact that it is no longer directly supported by its vendor. This means that regular updates and support are not provided, which is a significant risk factor for such systems.\n\nLegacy systems are generally used for older applications and services that are too complex or costly to migrate to modern platforms. They are not typically associated with modern applications.\n\nLegacy systems often do not integrate well with new technologies. They are typically retained because they perform specific functions that are difficult to replace, not because they work well with modern systems."
  },
  {
    "id": "iaea_05",
    "topic": "Internet and Embedded Appliances",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are setting up a smart home system that includes smart lightbulbs, a smart thermostat, and a video doorbell. You want to control all these devices remotely using your smartphone.\nWhich component is essential for integrating these devices into a cohesive Internet of Things (IoT) network?",
    "options": [
      {
        "id": "opt_a",
        "text": "A powerful router to provide high-speed internet to each device",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "A hub/control system to facilitate communication and control of the devices",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "A high-capacity data storage server to save all device settings and logs",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "A backup power supply to ensure devices remain operational during power outages",
        "isCorrect": false

    "explanation": "A hub/control system is essential for integrating IoT devices into a cohesive network. It facilitates communication between devices and allows you to control them remotely using your smartphone.\n\nWhile data storage can be useful for logging and settings, it is not essential for integrating and controlling IoT devices. The primary need is for communication and control, not storage.\n\nAlthough a router is important for internet connectivity, the key component for integrating and controlling IoT devices is a hub/control system, not just internet access.\n\nWhile a backup power supply can be beneficial for maintaining operation during outages, it is not essential for the integration and control of IoT devices in a network. The focus is on communication and control."
  },
  {

    "topic": "Internet and Embedded Appliances",
    "type": "single",
    "requiredSelections": 1,
    "question": "An energy company is upgrading its systems across multiple sites. The company would like to control the systems with software that communicates with the current programmable logic controllers (PLCs) and new RTUs.\nWhat kind of system is the company upgrading to?",
    "options": [

        "id": "opt_a",
        "text": "SCADA",
        "isCorrect": true
      },

        "id": "opt_b",
        "text": "ICS",

      },

        "id": "opt_c",
        "text": "Embedded system",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "OT",
        "isCorrect": false
      }
    ],
    "explanation": "The company is upgrading to a supervisory control and data acquisition (SCADA) system, which will take the place of a control server in large-scale, multiple-site ICSs.\n\nAn embedded system network is known as an operational technology (OT) network, to distinguish it from an IT network.\n\nAn embedded system is an electronic device that performs a specific, dedicated function. Embedded systems might typically have operated within a closed network.\n\nAn industrial control system (ICS) provides mechanisms for workflow and process automation. An ICS controls machinery used in critical infrastructures, such as power and water suppliers."
  },
  {
    "id": "iaea_07",
    "topic": "Internet and Embedded Appliances",
    "type": "single",
    "requiredSelections": 1,
    "question": "As a network administrator for your company, you want to set up a network device that manages traffic leaving and entering your network from the outside.\nWhich of the following proxy server configurations would BEST meet your requirements?",
    "options": [
      {
        "id": "opt_a",
        "text": "Non-transparent proxy",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Content filter",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Transparent proxy",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "VPN",
        "isCorrect": false
      }
    ],
    "explanation": "In this scenario, the use of transparent proxies are optimal as they allow automatic configuration to intercept traffic, can be done without the users' awareness of the proxy, and monitor and control overall traffic. A proxy server can operate as a transparent service and the client requires no special configuration.\n\nA proxy server could operate as a non-transparent service but the client must be configured with the IP address and service port (often 8080 by convention) of the proxy server.\n\nA content filter is a role of a proxy server that is designed to block traffic by regulating incoming and outgoing connection requests. This prevents users from accessing websites they should not have access to.\n\nA VPN allows users to connect to the internet anonymously. All data is encrypted, and not even the ISP can see the contents of the traffic."
  },
  {
    "id": "iaea_08",
    "topic": "Internet and Embedded Appliances",
    "type": "single",
    "requiredSelections": 1,
    "question": "How do embedded systems within a Supervisory Control and Data Acquisition (SCADA) system typically communicate with field devices?",
    "options": [
      {
        "id": "opt_a",
        "text": "Through direct physical connections using USB cables",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "By utilizing WAN communications such as cellular or satellite links",

      },
      {

        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Via local area network (LAN) connections using Ethernet cables",
        "isCorrect": false
      }
    ],
    "explanation": "SCADA systems typically use WAN communications, such as cellular or satellite, to link the SCADA server to field devices. This allows for communication over large distances, which is typical for SCADA systems managing multiple-site industrial control systems.\n\nSCADA systems typically manage large-scale operations where direct physical connections like USB cables are impractical due to distance and scale.\n\nSCADA systems often require communication over long distances, which LAN connections using Ethernet cables are not suited for. WAN communications are more appropriate for such scenarios.\n\nWi-Fi technology is generally used for shorter-range communication and is not typically employed for the long-distance communication required by SCADA systems, which instead use WAN communications like cellular or satellite links."
  },
  {
    "id": "iaea_09",
    "topic": "Internet and Embedded Appliances",
    "type": "single",
    "requiredSelections": 1,
    "question": "Company employees are accessing the same resources on the internet many times a day. As the network administrator, you configure a solution that forwards traffic to and from the internet and also caches content to improve performance and reduce bandwidth consumption.\nWhat solution are you implementing?",
    "options": [
      {
        "id": "opt_a",
        "text": "UTM",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Proxy server",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Load balancer",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "NAT",
        "isCorrect": false
      }
    ],
    "explanation": "A proxy server takes a whole HTTP request from a client, checks it, and then forwards it to and from the destination server on the internet. It also caches content to improve performance.\n\nIn a port-based or overloaded network address translation (NAT), a NAT device translates between the private IP addresses used on the LAN and the public IP address on the router's WAN interface.\n\nA unified threat management (UTM) appliance enforces a variety of security policies and controls, combining the work of multiple security functions.\n\nA load balancer distributes client requests across server nodes in a farm or pool and can deploy in any situation where multiple servers are providing the same function."
  },

{
    "id": "tsn_01",
    "topic": "Troubleshoot Networks",
    "type": "single",
    "requiredSelections": 1,
    "question": "After several new computers are connected to a network device, every computer connected to the device begins to experience slow transfer speeds.\nWhich of the following is the FIRST step to troubleshoot this problem?",
    "options": [
      {
        "id": "opt_a",
        "text": "Use a loopback plug to determine whether the NIC in each computer is good.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Use a loopback plug to determine whether each port on the network device is good.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Use a cable tester to determine whether all cables between each computer and the device are good.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Determine whether the network device is a hub or a switch.",
        "isCorrect": true
      }
    ],
    "explanation": "When troubleshooting slow speeds, you need first to determine which device is running slowly (such as a hub or switch). If a specific resource is experiencing slow speeds, you need to focus your efforts on that resource.\n\nThe problem is unlikely to be a bad port on the network device, which would only affect one computer.\n\nIf the problem is a bad NIC, already knowing whether the network device is a hub or switch would help isolate the problem.\n\nA bad cable would only affect the computer it was connected to, but all computers are experiencing slow transfer speeds in this scenario."
  },
  {
    "id": "tsn_02",
    "topic": "Troubleshoot Networks",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports intermittent connectivity and slow transfer speeds on the office Wi-Fi network. Upon investigation, you find that the user's device is connected to the 2.4 GHz band, while other devices connected to the 5 GHz band are not experiencing any issues.\nAdditionally, the Wi-Fi analyzer shows that the 2.4 GHz band is heavily congested with multiple overlapping networks.\nWhat is the BEST course of action to resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Adjust the channel settings on the wireless access point to a less congested channel in the 2.4 GHz band.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Configure the user's device to connect to the 5 GHz band instead of the 2.4 GHz band.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Move the user's device closer to the wireless access point to improve the signal strength.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Replace the wireless access point with a newer model that supports higher speeds.",
        "isCorrect": false
      }
    ],
    "explanation": "The 5 GHz band is less congested and offers better performance in terms of speed and reliability compared to the 2.4 GHz band, especially in environments with many overlapping networks. Configuring the user's device to connect to the 5 GHz band will resolve the issue of congestion and improve connectivity. This is the most effective solution based on the analysis of the problem.\n\nWhile adjusting the channel settings can reduce interference in the 2.4 GHz band, it does not address the fundamental issue of congestion caused by multiple overlapping networks. Switching to the 5 GHz band is a more effective solution in this scenario.\n\nMoving closer to the access point might improve signal strength, but it does not resolve the issue of congestion in the 2.4 GHz band. The problem is not related to signal strength but to interference and congestion.\n\nReplacing the access point is unnecessary in this scenario because the issue is related to the user's device being connected to the congested 2.4 GHz band. The existing access point already supports the 5 GHz band, which is a viable solution. Replacing the hardware would be an excessive and costly approach."
  },
  {
    "id": "tsn_03",
    "topic": "Troubleshoot Networks",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their file transfers over the network are significantly slower than usual. Upon investigation, you find that the issue is isolated to this user's workstation.\nYou check the cabling and find no visible damage or interference.\nWhat should you do next to troubleshoot the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Replace the user's Ethernet cable with a shielded cable.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Reposition the user's workstation closer to the router.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check the duplex settings on the user's network adapter and the switch port.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Update the firmware on the router.",
        "isCorrect": false
      }
    ],
    "explanation": "Mismatched duplex settings on the network adapter and switch port can reduce network speed. Ensuring that both are set to auto-negotiate is a critical step in troubleshooting slow speeds. Since the issue is isolated to one workstation, this is the most logical next step.\n\nYou should use shielded cables only when interference is suspected. Since no interference or damage was found during the cabling check, replacing the cable is unnecessary at this stage.\n\nRepositioning is a troubleshooting step for wireless networks, not for cabled connections. The user's workstation is connected via Ethernet, so physical proximity to the router is irrelevant.\n\nThe issue is isolated to a single workstation. Updating the router firmware would be a step to address network-wide issues, not a problem specific to one user."
  },
  {
    "id": "tsn_04",
    "topic": "Troubleshoot Networks",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the first step in troubleshooting a limited connectivity issue for a single host in a wired network?",
    "options": [
      {
        "id": "opt_a",
        "text": "Verify that the patch cords are properly terminated and connected to the network ports.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Check the switch configuration for port security settings.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Use a cable tester to verify the structured cabling.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Update the NIC's device driver software.",
        "isCorrect": false
      }
    ],
    "explanation": "The first step in troubleshooting limited connectivity for a single host is to check the physical connections, such as ensuring that the patch cords are properly terminated and securely connected to the network ports. This is a basic but essential step to rule out simple physical issues before moving on to more complex troubleshooting.\n\nWhile port security settings on the switch can cause connectivity issues, this is not the first step in troubleshooting. Physical connections should be checked before investigating switch configurations.\n\nUsing a cable tester to verify structured cabling is a more advanced step in troubleshooting. It is performed after confirming that the patch cords and physical connections are not the source of the problem.\n\nUpdating the NIC's device driver software is a potential solution for connectivity issues caused by driver problems. However, this is not the first step in troubleshooting. Physical connections should be checked before addressing software-related issues."
  },
  {
    "id": "tsn_05",
    "topic": "Troubleshoot Networks",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the maximum one-way latency that VoIP can support without significantly impacting call quality?",
    "options": [
      {
        "id": "opt_a",
        "text": "500 milliseconds (ms)",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "300 milliseconds (ms)",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "50 milliseconds (ms)",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "150 milliseconds (ms)",
        "isCorrect": true
      }
    ],
    "explanation": "VoIP can support a maximum one-way latency of about 150 milliseconds. Latency beyond this threshold can lead to noticeable delays in voice communication, which can significantly degrade call quality.\n\nWhile lower latency is always better for VoIP, 50 milliseconds is not the maximum one-way latency VoIP can support. VoIP systems are designed to tolerate latency of up to 150 milliseconds without significant impact on call quality.\n\nA one-way latency of 300 milliseconds is too high for VoIP and would result in noticeable delays and poor call quality. This exceeds the acceptable threshold for effective real-time communication.\n\nA one-way latency of 500 milliseconds is far beyond the acceptable limit for VoIP. Such high latency would make real-time communication nearly impossible, leading to severe disruptions in call quality."
  },
  {
    "id": "tsn_06",
    "topic": "Troubleshoot Networks",
    "type": "single",
    "requiredSelections": 1,
    "question": "You have just installed a wireless network, but the network is experiencing slow speeds, especially when accessing the internet from your workstation.",
    "options": [
      {
        "id": "opt_a",
        "text": "Move your workstation closer to the wireless access point.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Add a network extender.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Reset your wireless router to the factory defaults.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Move the wireless access point.",
        "isCorrect": true
      }
    ],
    "explanation": "Slow wireless speeds can be caused by weak signal strength. If weak spots are found, the easiest and least expensive first step would be to move the wireless access point.\n\nYou could also try adding a network extender, but this solution would mean an additional cost.\n\nMoving your workstation closer to the wireless access point could involve a lot of work (if it is even an option).\n\nResetting your wireless router to the factory defaults could cause other issues and probably won't resolve the issue with slow speeds."
  },
  {
    "id": "tsn_07",
    "topic": "Troubleshoot Networks",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are an IT technician tasked with resolving a wired connectivity issue for a workstation in an office. The user reports intermittent connectivity problems.\nUpon inspection, you notice that the link LEDs on the network adapter and switch port are flickering inconsistently.\nWhat is the BEST next step to troubleshoot and resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Update the NIC's device driver software.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Replace the network adapter (NIC) on the workstation.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Use a loopback tool to test the switch port.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Substitute the current patch cord with a known good cable.",
        "isCorrect": true
      }
    ],
    "explanation": "The first step in troubleshooting intermittent connectivity issues is to check the physical connections, starting with the patch cord. A faulty or improperly terminated patch cord is a common cause of intermittent connectivity. Substituting it with a known good cable is a quick and effective way to rule out this potential issue.\n\nReplacing the NIC is a more invasive and time-consuming step that should only be considered after ruling out simpler issues, such as faulty patch cords or bad switch ports. The problem may not be with the NIC at all.\n\nUpdating the NIC's driver is typically a solution for software-related issues, such as speed mismatches or configuration problems. In this scenario, the flickering LEDs suggest a physical connectivity issue, which should be addressed first.\n\nUsing a loopback tool is a more advanced diagnostic step that is typically performed after simpler troubleshooting steps, such as checking cables and connections, have been completed. It is not the best next step in this scenario."
  },
  {
    "id": "tsn_08",
    "topic": "Troubleshoot Networks",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports limited connectivity on their workstation. Upon investigation, you find that the workstation is connected to the network but cannot access certain external websites. Other users on the same network do not have this issue.\nYou run the ipconfig command and notice that the workstation has a valid IP address, subnet mask, and default gateway.\nWhat is the MOST likely cause of the issue, and what should you do next?",
    "options": [
      {
        "id": "opt_a",
        "text": "The switch port is experiencing port flapping. Check the switch logs for port status changes.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "The user's computer has a malware infection. Disconnect the workstation and run a malware scan.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "The DNS server settings are incorrect. Reconfigure the workstation to use the correct DNS server.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "The network cable is faulty. Replace the cable with a known good one.",
        "isCorrect": false
      }
    ],
    "explanation": "If the workstation has a valid IP address, subnet mask, and default gateway but cannot access certain external websites, the issue is likely related to DNS resolution. Incorrect DNS server settings can prevent the workstation from resolving domain names to IP addresses, leading to limited connectivity for external websites. Reconfiguring the DNS server settings to point to a valid DNS server will resolve the issue.\n\nA faulty network cable would likely result in no connectivity or intermittent connectivity, not an issue limited to accessing certain external websites. Since the workstation has a valid IP configuration, the cable is functioning properly.\n\nPort flapping causes intermittent connectivity as the port repeatedly transitions between up and down states. This would affect all network activity, not just access to certain external websites. The issue described is more specific to DNS resolution.\n\nWhile malware can cause network issues, the symptoms described (valid IP configuration but limited access to external websites) are more indicative of a DNS configuration problem. Malware is not the most likely cause in this scenario."
  },
  {
    "id": "tsn_09",
    "topic": "Troubleshoot Networks",
    "type": "single",
    "requiredSelections": 1,
    "question": "A company is experiencing poor VoIP call quality, including jitter and delays. You analyze the network and find that the issue occurs during peak usage times when multiple devices are streaming videos and downloading large files.\nThe company uses a SOHO router without advanced traffic management features.\nWhat is the MOST likely cause of the VoIP issues?",
    "options": [
      {
        "id": "opt_a",
        "text": "The SOHO router lacks Quality of Service (QoS) configuration to prioritize VoIP traffic.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "The Internet Service Provider (ISP) is throttling VoIP traffic during peak hours.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "The VoIP phones are outdated and cannot handle modern network traffic.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The VoIP application is not compatible with the SOHO router.",
        "isCorrect": false
      }
    ],
    "explanation": "The lack of QoS on the SOHO router is the most likely cause of the VoIP issues. Without QoS, the router cannot prioritize VoIP traffic over other types of data, such as video streaming or file downloads. This results in jitter and delays during peak usage times, as VoIP packets are delayed or dropped due to network congestion.\n\nVoIP applications are generally compatible with most routers, including SOHO models. The issue here is not compatibility but the router's inability to prioritize VoIP traffic during periods of high network usage.\n\nThe age of the VoIP phones is not the issue in this scenario. The problem lies in the network's inability to prioritize VoIP traffic, which is unrelated to the phones themselves.\n\nWhile ISP throttling could theoretically cause issues, there is no evidence in this scenario to suggest that the ISP is specifically targeting VoIP traffic. The described problem is more likely due to the lack of QoS on the SOHO router."
  },
  {
    "id": "tsn_10",
    "topic": "Troubleshoot Networks",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network technician troubleshoots an issue where the video conferencing system keeps freezing up and dropping out. The technician determines that the network is not congested and the signal is not being processed fast enough to meet the streaming requirement.\nWhat is this type of issue known as?",
    "options": [
      {
        "id": "opt_a",
        "text": "QoS",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Jitter",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "VoIP",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Latency",
        "isCorrect": true
      }
    ],
    "explanation": "This issue is known as latency, which is the time it takes for a signal to reach the recipient. Processing delays at intermediate systems, such as routers, can cause latency to be worse.\n\nVoice over Internet Protocol (VoIP) is a generic name for protocols that carry voice traffic over data networks.\n\nQuality of service (QoS) means that switches, access points, and routers are all configured to identify VoIP data and prioritize it over bursty data.\n\nJitter is the amount of variation in delay over time, and network technicians can measure it by sampling the elapsed time between packets arriving. Jitter is typically caused by network congestion."
  },
{
    "id": "snserv_01",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "A host configured with a private address cannot access the internet directly; therefore, a router uses a Network Address Translation (NAT) to convert the private and public addresses through what?",
    "options": [
      {
        "id": "opt_a",
        "text": "Proxy server",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Web server",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Spam gateway",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Mail server",
        "isCorrect": false
      }
    ],
    "explanation": "A proxy server fulfills requests for internet resources and configures a private address to a public address so it can access the internet directly.\n\nA web server provides client access using HTTP or HTTPS but will not convert a private address to a public address.\n\nA mail server enables a person to compose a message and send it to another anywhere in the world via the internet but will not convert a private address to a public one.\n\nSpam gateways use protocols to verify the authenticity of mail servers and a network administrator configures them to identify spoofed, misleading, malicious, or unwanted messages. Spam gateways do not have the ability to change a private address to a public address."
  },
  {
    "id": "snserv_02",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "A company asked a network engineer to provide a solution that will allow a hosted application to be highly available if one or more servers are offline. They have plenty of resources to provide a cluster of servers that can run the application. Still, the company is looking for direction on making the application seamlessly available to customers. What solution would the engineer implement for this request?",
    "options": [
      {
        "id": "opt_a",
        "text": "Spam gateway",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Load balancer",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Proxy server",
        "isCorrect": false
      },
