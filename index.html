{
    "id": "hw_01",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "When troubleshooting a Windows system that displays a Blue Screen of Death (BSOD), which of the following steps should you take to understand the cause of the error?",
    "options": [
      {
        "id": "opt_a",
        "text": "Check the error code and message displayed on the BSOD to identify the specific problem.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Disconnect all peripheral devices and attempt to boot the system again.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Immediately restart the computer to see if the issue resolves itself.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Reinstall the operating system to ensure all corrupted files are replaced.",
        "isCorrect": false
      }
    ],
    "explanation": "The BSOD provides an error code and message that can help identify the specific issue causing the crash. Understanding these details is crucial for diagnosing and resolving the underlying problem.\n\nWhile restarting the computer might temporarily resolve the issue, it does not help in understanding the cause of the BSOD. Without identifying the error, the problem may persist or recur.\n\nWhile disconnecting peripherals can help isolate hardware issues, it does not directly address understanding the cause of a BSOD. The error message on the BSOD is a more direct source of information.\n\nReinstalling the operating system is a drastic measure that may resolve the issue but does not help in understanding the specific cause of the BSOD. It's important to analyze the error code first to determine if reinstallation is necessary."
  },
  {
    "id": "hw_02",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are responsible for enhancing the security of a company's laptops that are frequently used by employees for remote work. The company wants to ensure that sensitive data on these laptops is protected even if the devices are lost or stolen.\n\nHow can you utilize the Trusted Platform Module (TPM) to achieve this goal?",
    "options": [
      {
        "id": "opt_a",
        "text": "Configure TPM to monitor system temperatures and alert users of overheating.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Enable TPM to store encryption keys and use it to encrypt the entire hard drive with BitLocker.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Enable TPM to provide faster boot times by optimizing hardware initialization.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Use TPM to disable all USB ports, preventing unauthorized data transfer.",
        "isCorrect": false
      }
    ],
    "explanation": "TPM can securely store encryption keys, and when used with BitLocker, it can encrypt the entire hard drive. This ensures that sensitive data is protected, even if the laptop is lost or stolen, as the data cannot be accessed without the correct decryption key.\n\nTPM is not used for managing USB port permissions. Its primary function is to securely store cryptographic keys and enhance security features like encryption, not to control hardware interfaces like USB ports.\n\nTPM does not have the capability to monitor system temperatures. Its role is focused on security, particularly in storing cryptographic keys and ensuring platform integrity, not hardware monitoring.\n\nTPM is not designed to optimize boot times or hardware initialization. Its purpose is to enhance security by storing cryptographic keys and supporting secure boot processes, not to improve system performance or speed."
  },
  {
    "id": "hw_03",
    "topic": "Troubleshooting PC Hardware",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that their computer frequently overheats and shuts down during intensive tasks. Upon accessing the system firmware settings, you notice that the fan speed is set to \"Quiet\" mode.\n\nWhich of the following actions should you take to analyze and resolve the overheating issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Enable Secure Boot to ensure that only trusted software runs, preventing overheating.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Adjust the boot order to prioritize the SSD, reducing the time the system spends booting and thus lowering heat generation.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Change the fan speed setting to \"Cool\" mode to increase fan activity and reduce system temperature.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Disable USB ports to reduce power consumption and heat output from connected devices.",

      }
    ],
    "explanation": "By analyzing the current fan speed setting, you can determine that the \"Quiet\" mode is likely contributing to the overheating issue. Changing the setting to \"Cool\" mode will increase fan activity, enhancing cooling and reducing system temperature during intensive tasks.\n\nSecure Boot is a security feature that does not affect system temperature or fan operation. It ensures that only trusted software is loaded during boot but does not address overheating issues.\n\nAdjusting the boot order does not impact the system's temperature during intensive tasks. Boot order settings determine the sequence of boot devices and do not influence heat generation or cooling.\n\nDisabling USB ports may slightly reduce power consumption, but it is unlikely to have a significant impact on the overall system temperature during intensive tasks. The primary issue is related to fan speed settings, not USB port activity."
  },
  {

    "topic": "Troubleshooting PC Hardware",

        "id": "opt_b",
        "text": "Balanced",

let questions = [];
let historyStack = [];
let historyIndex = -1;
let answeredMap = {}; 
let currentShuffledOptionsMap = {}; // Maps question ID -> shuffled array of option objects
let tempSelectionsMap = {};         // Keeps track of in-progress multi-select choices before final submission

function initApp() {
    loadBank();
    setupEventListeners();
    startNewDeck();
}

function loadBank() {
    questions = [...DEFAULT_QUESTIONS];
}

function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function startNewDeck() {
    historyStack = [];
    historyIndex = -1;
    answeredMap = {};
    tempSelectionsMap = {};
    currentShuffledOptionsMap = {};

    // Shuffle options independently for each question on new deck creation
    questions.forEach(q => {
        currentShuffledOptionsMap[q.id] = shuffleArray(q.options);
    });

    let unvisited = Array.from({length: questions.length}, (_, i) => i);
    let shuffledSequence = shuffleArray(unvisited);

    if (shuffledSequence.length > 0) {
        historyStack.push(shuffledSequence[0]);
        historyIndex = 0;
    }

    renderGrid();
    renderQuestion();
}

function renderGrid() {
    const gridContainer = document.getElementById('question-grid');
    const statusText = document.getElementById('grid-status-text');
    if (!gridContainer) return;

    gridContainer.innerHTML = '';
    const total = questions.length;
    const completed = Object.keys(answeredMap).length;

    if (statusText) {
        statusText.textContent = `${completed}/${total} Completed`;
    }

    const currentQIdx = historyStack[historyIndex];

    questions.forEach((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'grid-btn';
        btn.textContent = i + 1;

        if (i === currentQIdx) {
            btn.classList.add('active');
        }

        if (answeredMap.hasOwnProperty(i)) {
            if (answeredMap[i].isCorrect) {
                btn.classList.add('answered-correct');
            } else {
                btn.classList.add('answered-incorrect');
            }
        }

        btn.addEventListener('click', () => {
            if (historyStack[historyIndex] !== i) {
                historyStack = historyStack.slice(0, historyIndex + 1);
                historyStack.push(i);
                historyIndex++;
                renderQuestion(); 
            }
        });

        gridContainer.appendChild(btn);
    });
}

function renderQuestion() {
    if (historyIndex < 0 || historyIndex >= historyStack.length) return;
    const qIndex = historyStack[historyIndex];
    const q = questions[qIndex];

    document.getElementById('stats-badge').innerText = `Question ${historyIndex + 1} of ${questions.length}`;
    document.getElementById('topic-tag').innerText = q.topic || 'General';
    document.getElementById('question-text').innerText = q.question;

    const optionsList = document.getElementById('options-list');
    optionsList.innerHTML = '';

    const expPanel = document.getElementById('explanation-panel');
    const expContent = document.getElementById('explanation-content');
    expContent.innerText = q.explanation;

    const record = answeredMap[qIndex];

    if (record) {
        expPanel.classList.remove('hidden');
    } else {
        expPanel.classList.add('hidden');
    }

    // Retrieve shuffled options for this question
    const displayOptions = currentShuffledOptionsMap[q.id] || q.options;
    const prefixes = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
    const currentTemp = tempSelectionsMap[qIndex] || [];

    displayOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="prefix">${prefixes[idx]}</span> <span>${opt.text}</span>`;

        if (record) {
            // Question has been evaluated
            btn.disabled = true;

            if (opt.isCorrect) {
                btn.classList.add('correct');
            }

            if (record.selectedIds.includes(opt.id) && !opt.isCorrect) {
                btn.classList.add('incorrect');
            }
        } else {
            // Question is active
            const isSelectedInTemp = currentTemp.includes(opt.id);

            if (isSelectedInTemp) {
                btn.classList.add('selected-temp');
            }

            // Disable unselected options when selection limit is reached
            if (!isSelectedInTemp && currentTemp.length >= q.requiredSelections) {
                btn.disabled = true;
            } else {
                btn.addEventListener('click', () => handleOptionClick(qIndex, opt.id));
            }
        }

        optionsList.appendChild(btn);
    });

    document.getElementById('prev-btn').disabled = (historyIndex <= 0);
    renderGrid();
}

function handleOptionClick(qIndex, selectedOptionId) {
    const q = questions[qIndex];
    if (!q || answeredMap[qIndex]) return;

    if (q.type === 'single') {
        evaluateQuestion(qIndex, [selectedOptionId]);
    } else {
        // Multi-select logic
        let currentTemp = tempSelectionsMap[qIndex] ? [...tempSelectionsMap[qIndex]] : [];

        if (currentTemp.includes(selectedOptionId)) {
            // Deselect if clicked again
            currentTemp = currentTemp.filter(id => id !== selectedOptionId);
        } else {
            if (currentTemp.length < q.requiredSelections) {
                currentTemp.push(selectedOptionId);
            }
        }

        tempSelectionsMap[qIndex] = currentTemp;

        // Auto-evaluate when exact selection limit is reached
        if (currentTemp.length === q.requiredSelections) {
            evaluateQuestion(qIndex, currentTemp);
        } else {
            renderQuestion();
        }
    }
}

function evaluateQuestion(qIndex, selectedIds) {
    const q = questions[qIndex];
    if (!q) return;

    const correctIds = q.options.filter(o => o.isCorrect).map(o => o.id);

    // Compare selected IDs against true correct IDs
    const isCorrect = (
        selectedIds.length === correctIds.length &&
        selectedIds.every(id => correctIds.includes(id))
    );

    answeredMap[qIndex] = {
        selectedIds: selectedIds,
        isCorrect: isCorrect
    };

    renderQuestion();
}

function nextQuestion() {
    if (historyIndex < historyStack.length - 1) {
        historyIndex++;
    } else {
        const visitedSet = new Set(historyStack);
        const unvisited = [];
        for (let i = 0; i < questions.length; i++) {
            if (!visitedSet.has(i)) {
                unvisited.push(i);
            }
        }

        if (unvisited.length > 0) {
            const nextRandom = unvisited[Math.floor(Math.random() * unvisited.length)];
            historyStack.push(nextRandom);
            historyIndex++;
        } else {
            let nextRandom = Math.floor(Math.random() * questions.length);
            historyStack.push(nextRandom);
            historyIndex++;
        }
    }
    renderQuestion();
}

function prevQuestion() {
    if (historyIndex > 0) {
        historyIndex--;
        renderQuestion();
    }
}

function toggleExplanation() {
    const expPanel = document.getElementById('explanation-panel');
    expPanel.classList.toggle('hidden');
}

function resetToDefaults() {
    if (confirm('Reset your current test attempt and shuffle a new deck?')) {
        startNewDeck();
    }
}

function setupEventListeners() {
    document.getElementById('next-btn').addEventListener('click', nextQuestion);
    document.getElementById('prev-btn').addEventListener('click', prevQuestion);
    document.getElementById('toggle-exp-btn').addEventListener('click', toggleExplanation);

    document.addEventListener('keydown', (e) => {
        if (e.key >= '1' && e.key <= '5') {
            const idx = parseInt(e.key) - 1;
            const qIndex = historyStack[historyIndex];
            const q = questions[qIndex];
            if (q && !answeredMap[qIndex]) {
                const displayOptions = currentShuffledOptionsMap[q.id] || q.options;
                if (idx < displayOptions.length) {
                    const optId = displayOptions[idx].id;
                    const currentTemp = tempSelectionsMap[qIndex] || [];
                    
                    // Allow hotkey selection if option is clickable
                    if (currentTemp.includes(optId) || currentTemp.length < q.requiredSelections) {
                        handleOptionClick(qIndex, optId);
                    }
                }
            }
        } else if (e.key === ' ' || e.key === 'ArrowRight') {
            e.preventDefault();
            nextQuestion();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevQuestion();
        } else if (e.key.toLowerCase() === 'e') {
            toggleExplanation();
        }
    });
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
