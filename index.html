      {
        "id": "opt_d",
        "text": "Web server",
        "isCorrect": false
      }
    ],
    "explanation": "A load balancer can distribute client requests across server nodes in a farm or pool. The company can use a load balancer in any situation where multiple servers provide the same function.\n\nA proxy server takes a full HTTP request from a client, checks it, then forwards it to the destination server on the internet. This activity would not be the solution for the given request.\n\nA web server provides client access using HTTP or its secure version (HTTPS). This is likely the type of servers in the mentioned cluster hosting the application.\n\nSpam gateways verify the authenticity of mail servers and have filters that can identify spoofed, misleading, malicious, or otherwise unwanted messages."
  },
  {
    "id": "snserv_03",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following proxy server roles stores frequently accesses data so that a user's request never has to leave the network for retrieval?",
    "options": [
      {
        "id": "opt_a",
        "text": "VPN",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Firewall",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Caching",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Sharing Internet Connections",
        "isCorrect": false
      }
    ],
    "explanation": "Caching allows frequently accessed data to be stored on the local proxy server so that a user's request never has to leave the network for retrieval.\n\nA VPN allows users to connect to the internet anonymously. All the data is encrypted, and not even the ISP can see the contents of the traffic.\n\nThe Sharing Internet Connections role allows all devices to be funneled through one connection, controlling the flow of network traffic. This is a good solution for wireless device connections over Wi-Fi.\n\nA firewall is a security system on a network that acts as a barrier between the network and the rest of the internet. A firewall is configured to block unwanted access and traffic that could cause security issues."
  },
  {
    "id": "snserv_04",
    "topic": "Supporting Network Services",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "Which of the following functions are performed by proxy servers? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Store client files.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Cache web pages.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Block unwanted packets from entering your private network.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Block employees from accessing certain websites.",
        "isCorrect": true
      },
      {
        "id": "opt_e",
        "text": "Filter unwanted email.",
        "isCorrect": false
      }
    ],
    "explanation": "A proxy, or proxy server, stands between client computers and web servers. You can use a proxy server to prevent access to specific websites or to cache (save) frequently used web pages.\n\nWhen a proxy receives a request from the client, the proxy checks to verify that the client is allowed access to the website. If they are, the proxy then checks its cache to see if the requested page is there. If the page is already cached, the proxy server fulfills the request by displaying the requested page from the cache rather than retrieving it from the internet. Receiving a web page from a local proxy server is much faster than downloading the page from the internet."
  },
  {
    "id": "snserv_05",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following is a primary function of a mail server?",
    "options": [
      {
        "id": "opt_a",
        "text": "Providing remote terminal access to network resources",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Facilitating the sending and receiving of email messages",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Storing and managing large amounts of structured data",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Hosting websites and web applications",
        "isCorrect": false
      }
    ],
    "explanation": "Mail servers are specifically designed to handle the sending, receiving, and storage of email messages. They manage email traffic and ensure that emails are delivered to the correct recipients. This is the primary function of mail servers.\n\nHosting websites and web applications is the primary function of web servers, not mail servers. Web servers use HTTP or HTTPS to serve web pages and applications to clients. This function is unrelated to the operations of mail servers.\n\nStoring and managing large amounts of structured data is associated with database servers, which are used to store, organize, and manage data for easy retrieval and manipulation. Mail servers do not primarily focus on data storage in the same way database servers do.\n\nProviding remote terminal access to network resources is typically associated with remote terminal access servers, which allow users to access network resources from remote locations. Mail servers do not provide this type of access, as their main role is to handle email communications."
  },
  {
    "id": "snserv_06",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "To enable printer sharing via Windows, what should the print device connect to on the Windows PC?",
    "options": [
      {
        "id": "opt_a",
        "text": "To the print server via the Ethernet or on a Wi-Fi link, Bluetooth, USB, or other share service",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "To the file share server via the internet on a Wi-Fi link",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To the proxy server via the Ethernet on a DSL",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "To the web server via the internet on Wi-Fi or other share service",
        "isCorrect": false
      }
    ],
    "explanation": "Any print device can connect to a Windows print server over USB, Bluetooth, Ethernet, or Wi-Fi and must keep the Windows PC on to facilitate printing.\n\nA proxy server fulfills requests for internet resources and configures or converts a private address to a public address so a client can access the internet directly.\n\nA file share server is a server disk configured to allow clients to access resources over the enterprise network for authorized users.\n\nA web server provides client access using HTTP or HTTPS and would not play a part in printing."
  },
  {
    "id": "snserv_07",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "What is the primary function of a load balancer in a network?",
    "options": [
      {
        "id": "opt_a",
        "text": "To block unauthorized access to a network by using a firewall",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To detect and prevent malicious traffic patterns using an intrusion detection system",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To distribute client requests across server nodes in a farm or pool",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "To filter out spam messages before they reach the user's inbox",
        "isCorrect": false
      }
    ],
    "explanation": "The primary function of a load balancer is to distribute client requests across multiple server nodes in a farm or pool. This helps in providing high availability and scalability for services.\n\nBlocking unauthorized access is the primary function of a firewall, not a load balancer. Firewalls are used to allow or block traffic based on network access control lists.\n\nDetecting and preventing malicious traffic patterns is the function of an intrusion detection system (IDS) or intrusion prevention system (IPS), not a load balancer.\n\nFiltering out spam messages is the function of a spam gateway, not a load balancer. Spam gateways are used to verify the authenticity of mail servers and filter unwanted messages."
  },
  {
    "id": "snserv_08",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports slow network speeds while transferring files to a shared server. You verify that the cabling and switch port are functioning correctly.\nUpon further investigation, you notice that the user's network adapter and the switch port are set to different duplex modes.\nWhat should you do to resolve the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "Replace the user's network cable with a shielded one",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Set both the network adapter and switch port to auto-negotiate",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Disable the user's network adapter and re-enable it",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Update the firmware on the switch",
        "isCorrect": false
      }
    ],
    "explanation": "Mismatched duplex settings can cause slow network speeds due to improper communication between the devices. Setting both the network adapter and switch port to auto-negotiate ensures they can agree on the appropriate duplex mode and speed.\n\nShielded cables are used to reduce interference, but interference is not indicated as the issue here. The problem is related to mismatched duplex settings, not the physical cabling.\n\nWhile updating firmware can resolve certain network issues, it is not relevant to resolving mismatched duplex settings.\n\nDisabling and re-enabling the network adapter might temporarily reset the connection but will not resolve the underlying duplex mismatch issue."
  },
  {
    "id": "snserv_09",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network technician troubleshoots a computer on the wired network that is experiencing slow network speeds. Which of the following would NOT be a possible cause for the technician to troubleshoot?",
    "options": [
      {
        "id": "opt_a",
        "text": "Improperly terminated patch cords",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "External interference on the cable",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Improper speed/duplex configuration",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Another radio source broadcasting at the same frequency",
        "isCorrect": true
      }
    ],
    "explanation": "Another radio source broadcasting at the same frequency would cause interference and result in slow speeds for wireless devices, but this would not be relevant to a wired network.\n\nImproperly terminated patch cords can cause slow network speeds on a wired network. The technician should substitute the patch cord with a known good cable or verify patch cords using a cable tester.\n\nAn improper speed/duplex configuration on the switch interface and network interface card (NIC) can cause slow network speeds on a wired network. This should usually be set to auto-negotiate.\n\nExternal interference on the structured cabling can cause slow network speeds on a wired network. A cable tester called a \"certifier\" can report detailed information about cable interference."
  },
  {
    "id": "snserv_10",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "Your company has recently experienced issues with inconsistent timestamps on transaction logs across multiple servers, leading to difficulties in tracking and auditing activities.\nAs the network administrator, you need to resolve this issue to ensure all servers have synchronized time.\nWhich of the following actions should you take to address this problem?",
    "options": [
      {
        "id": "opt_a",
        "text": "Set up a File Transfer Protocol (FTP) server to regularly back up transaction logs for auditing purposes.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Install and configure a centralized Time Server to synchronize the clocks of all network devices.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Deploy a new Database Server to manage and store transaction logs more efficiently.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Implement HTTPS on all servers to secure data transmission and improve timestamp accuracy.",
        "isCorrect": false
      }
    ],
    "explanation": "By installing and configuring a centralized Time Server, you can ensure that all devices on the network have synchronized time, which will resolve the issue of inconsistent timestamps on transaction logs.\n\nWhile a Database Server can help manage and store data, it does not address the issue of time synchronization across servers, which is the root cause of the inconsistent timestamps.\n\nHTTPS is used to secure data transmission over the network but does not directly affect the synchronization of time across servers. It does not resolve the issue of inconsistent timestamps.\n\nWhile setting up an FTP server for backups can aid in data recovery and auditing, it does not address the core issue of time synchronization, which is necessary for consistent timestamps."
  },
  {
    "id": "snserv_11",
    "topic": "Supporting Network Services",
    "type": "multiple",
    "requiredSelections": 3,
    "question": "Vulnerability issues do not just affect PC operating systems and applications in enterprise networks. Any device or network appliance can be vulnerable to exploits from within and outside the network. With the rise of more personalized devices, the risks to embedded systems have become more evident. Which devices are considered a new and growing problem regarding these proposed risks? (Select all that apply.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Mobile devices",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "New motherboard, router, adapter, or other internal devices",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Any unpatched device",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Internet of Things (IoT)",
        "isCorrect": true
      }
    ],
    "explanation": "Many IoT devices are for home automation systems used over Wi-Fi. Unfortunately, most standards that regulate frequencies, bands, networks, or other wireless technology may not cover them, and the IOTs could have security flaws.\n\nEvery establishment should have similar security concerns toward monitoring vulnerabilities and only allowing mobile devices on networks with authorization.\n\nEach establishment should monitor vulnerabilities on unpatched devices and apply patches or install a hardened configuration to those devices with access to enterprise networks to reduce security concerns.\n\nAny code running on a network appliance or device can also be vulnerable to exploits. However, installing new or updated hardware for internal systems will most likely have updated security measures already in place."
  },
  {
    "id": "snserv_12",
    "topic": "Supporting Network Services",
    "type": "multiple",
    "requiredSelections": 3,
    "question": "A network technician is troubleshooting an issue where a wireless device only receives an intermittent signal. What could be a possible cause of this? (Select three.)",
    "options": [
      {
        "id": "opt_a",
        "text": "There is an electromagnetic source nearby.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "There is Wi-Fi analyzer software running.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Another radio source is broadcasting at the same frequency.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Something is blocking the signal.",
        "isCorrect": true
      }
    ],
    "explanation": "If a device is within the supported range but the signal is intermittent, there is likely to be interference from another radio source broadcasting at the same frequency.\n\nInterference from a powerful electromagnetic source, such as a motor or a microwave oven, can cause an intermittent wireless signal.\n\nRadio waves do not pass easily through metal or dense objects. Construction materials, such as wire mesh, foil-backed plasterboard, concrete, and mirrors, can block or degrade signals.\n\nWi-Fi analyzer software identifies the signal strength of nearby networks on each channel. It shows the signal strength with values close to zero representing a stronger signal."
  },
  {
    "id": "snserv_13",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following BEST describes the role of HyperText Markup Language (HTML) in web applications?",
    "options": [
      {
        "id": "opt_a",
        "text": "HTML is used to encrypt data between a client and a server to ensure secure communication.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "HTML provides the structure and formatting for web pages.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "HTML is a protocol used to transfer data between web servers and clients over the internet.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "HTML is a software suite that allows Windows clients to access Linux hosts as though they were Windows servers.",
        "isCorrect": false
      }
    ],
    "explanation": "HTML is a markup language used to create the structure of web pages. It uses coded tags to describe how text and multimedia content should be displayed by web browsers.\n\nHTML is not used for encryption. Encryption for secure communication is typically handled by protocols like HTTPS, which uses SSL/TLS.\n\nHTML is not a protocol. The protocol used for transferring data between web servers and clients is HTTP or HTTPS.\n\nHTML is not a software suite for accessing servers. The software suite that allows Windows clients to access Linux hosts is Samba, which is unrelated to HTML."
  },
  {
    "id": "snserv_14",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "A company is experiencing poor VoIP call quality, including jitter and delays. You analyze the network and find that the issue occurs during peak usage times when multiple devices are streaming videos and downloading large files.\nThe company uses a SOHO router without advanced traffic management features.\nWhat is the MOST likely cause of the VoIP issues?",
    "options": [
      {
        "id": "opt_a",
        "text": "The SOHO router lacks Quality of Service (QoS) configuration to prioritize VoIP traffic.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "The Internet Service Provider (ISP) is throttling VoIP traffic during peak hours.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "The VoIP phones are outdated and cannot handle modern network traffic.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The VoIP application is not compatible with the SOHO router.",
        "isCorrect": false
      }
    ],
    "explanation": "The lack of QoS on the SOHO router is the most likely cause of the VoIP issues. Without QoS, the router cannot prioritize VoIP traffic over other types of data, such as video streaming or file downloads. This results in jitter and delays during peak usage times, as VoIP packets are delayed or dropped due to network congestion.\n\nVoIP applications are generally compatible with most routers, including SOHO models. The issue here is not compatibility but the router's inability to prioritize VoIP traffic during periods of high network usage.\n\nThe age of the VoIP phones is not the issue in this scenario. The problem lies in the network's inability to prioritize VoIP traffic, which is unrelated to the phones themselves.\n\nWhile ISP throttling could theoretically cause issues, there is no evidence in this scenario to suggest that the ISP is specifically targeting VoIP traffic. The described problem is more likely due to the lack of QoS on the SOHO router."
  },
  {
    "id": "snserv_15",
    "topic": "Supporting Network Services",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user on a Windows computer receives a limited connectivity message. They call the helpdesk to see how their issue can be resolved. What should the user check first?",
    "options": [
      {
        "id": "opt_a",
        "text": "Check the DHCP lease.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Check patch cords.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Check for network congestion.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Check that the network is the problem and not the host.",
        "isCorrect": false
      }
    ],
    "explanation": "In Windows, a limited connectivity message specifically means that the host can establish a physical connection to the network but has not received a lease for an IP configuration from a DHCP server.\n\nThe first step in resolving a no or intermittent connectivity issue is to check that the patch cords are properly terminated and connected to the network ports.\n\nIf a user reports slow speed, establish that there is a link speed problem by checking the nominal link speed and using a utility to measure transfer rate independent of specific apps or network services.\n\nJitter is typically caused by network congestion affecting packet processing on routers and switches."
  },
{
    "id": "cr57_01",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "A computer technician disassembles a desktop computer and notices that some system chips are bulging on the motherboard. What can cause this type of observed issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "No power",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Crash screens",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Sluggish performance",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Capacitor swelling",
        "isCorrect": true
      }
    ],
    "explanation": "Capacitor swelling is the bulging, swelling, or emission of any kind of residue from the capacitors, which could have been damaged or failed due to a manufacturing defect.\n\nA crash screen typically indicates a system memory fault, a hardware device/driver fault, or corruption of operating system files.\n\nNo power means that the power supply unit did not receive any energy. The power supply unit is what powers the computer motherboard and peripherals.\n\nSluggish performance occurs when the device operates below normal computing standards. Several variables can cause the sluggish performance of a device."
  },
  {
    "id": "cr57_02",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are assembling a desktop PC and need to connect the motherboard to the power supply.\nThe power supply has a 24-pin ATX connector, but the motherboard has a 20-pin power connector.\nWhat should you do to ensure proper power delivery to the motherboard?",
    "options": [
      {
        "id": "opt_a",
        "text": "Cut off the extra 4 pins from the 24-pin ATX connector to make it fit the 20-pin connector.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Use an adapter to convert the 24-pin ATX connector into a 20-pin connector.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Replace the power supply with one that has a 20-pin ATX connector.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Use the 24-pin ATX connector and leave the extra 4 pins hanging off the side of the motherboard connector.",
        "isCorrect": true
      }
    ],
    "explanation": "Most modern 24-pin ATX connectors are designed to be backward compatible with 20-pin motherboard connectors. The extra 4 pins can be left hanging off the side without causing any issues, ensuring proper power delivery.\n\nCutting the connector would permanently damage the power supply and is unnecessary, as the 24-pin connector is designed to work with 20-pin connectors.\n\nWhile an adapter could work, it is not required because the 24-pin connector is already compatible with 20-pin connectors.\n\nReplacing the power supply is unnecessary, as the 24-pin connector is designed to work with 20-pin motherboards."
  },
  {
    "id": "cr57_03",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "What does constant light-emitting diode (LED) activity on a hard drive disk (HDD) indicate? (Select all that apply.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Low system memory",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Disk thrashing",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Blue screen of death (BSOD)",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Faulty HDD platters",
        "isCorrect": false
      }
    ],
    "explanation": "Constant activity, often referred to as disk thrashing, means the disk is being constantly read. This constant activity may be a result of malware on the computer.\n\nConstant disk activity can signify that there is not enough system random access memory (RAM), so paging (virtual memory) is continually using the disk.\n\nA faulty hard disk drive (HDD) with bad internal platters will be apparent if there are grinding or clicking sounds. These are signs of an imminent failure of the disk.\n\nA failing fixed disk and file corruption on a Windows computer may cause a system stop error or crash screen known as the blue screen of death (BSOD). There is less disk activity in a BSOD state."
  },
  {
    "id": "cr57_04",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "An old desktop computer has an office projector currently connected to it. A colleague brought in a modern low-profile laptop for the upcoming presentation and connected the office projector to the laptop. Unfortunately, a loud \"pop\" sound occurs, and the projector emits no light. How can desktop support troubleshoot the issue so the meeting can continue as usual?",
    "options": [
      {
        "id": "opt_a",
        "text": "Select a different source input.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Calibrate the image.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Use a different display cable.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Change the light bulb.",
        "isCorrect": true
      }
    ],
    "explanation": "A burned-out bulb is a bulb that has entirely failed. There might be burn marks on the interior. Desktop support will need to replace the bulb.\n\nOld and new computers may use different display inputs. For example, modern laptops will most likely use a high-definition media input (HDMI) cable.\n\nIt may require using a different cable since the older desktop model uses legacy display cables. Furthermore, HDMI ports require an HDMI cable to display properly.\n\nIt may require image or picture calibration if the color needs adjustment on the screen. However, there is no image to review in this case."
  },
  {
    "id": "cr57_05",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "A desktop technician was troubleshooting a computer that would not connect to the network and suspected that the network interface card (NIC) was not working.\nHowever, when the technician tested the NIC, it was working.\nWhat should the technician do next?",
    "options": [
      {
        "id": "opt_a",
        "text": "Implement a plan of action.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Test the theory.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Establish a new theory.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Implement preventive measures.",
        "isCorrect": false
      }
    ],
    "explanation": "The technician would establish a new theory as the tests they made or research they conducted proved that their original theory was incorrect.\n\nOnce the technician had a reliable theory of probable cause, then they would need to implement a plan of action by repairing or replacing the equipment or implementing a workaround.\n\nThe technician cannot test the theory until after they have established a new theory about why the computer cannot connect to the network.\n\nThe technician would implement preventive measures after they corrected the issue. This means eliminating any factors that could cause the problem to reoccur."
  },
  {
    "id": "cr57_06",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "You are in the process of purchasing several new Windows-based computers to replace broken or outdated computers. You have heard that solid-state drives (SSDs) can significantly increase systems' overall performance.\nWhich of the following BEST describe the features of solid-state drives (SSDs) compared to hard disk drives (HDDs)? (Select two.)",
    "options": [
      {
        "id": "opt_a",
        "text": "An SSD opens files faster than an HDD.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "An SSD uses flash technology to store data.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "SSD spindles move at a faster rate than those of an HDD.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "An SSD can be adversely affected by magnetism.",
        "isCorrect": false
      },
      {
        "id": "opt_e",
        "text": "An SSD cheaply stores a large amount of data.",
        "isCorrect": false
      }
    ],
    "explanation": "A solid-state drive is a flash device with a storage capacity similar to that of a small hard drive. Solid-state drives are used as replacements for hard disk drives and store operating systems, application, and data files.\n\nSolid-state drives have several advantages. They:\nAre faster than hard drives.\nHave no moving parts.\nHave lower power consumption than hard drives (which is good for laptops).\nAre less susceptible to physical damage and are immune to magnetic field damage.\nAre smaller and lighter than hard drives.\n\nThe main disadvantage to solid-state drives is cost. They are several times more expensive than comparable hard drives. However, their advantages make them a good choice in many situations, especially for portable devices."
  },
  {
    "id": "cr57_07",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "What characteristics of Wi-Fi 5 (802.11ac) allow for increased bandwidth and support for modern networks? (Select all that apply.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Downlink MU-MIMO",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Designed to work in both the 2.4 GHz and 5 GHz bands",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Typically supports up to four simultaneous clients",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Designed to work only in the 5 GHz band",
        "isCorrect": true
      }
    ],
    "explanation": "Wi-Fi 5 works only in the 5 GHz band. A dual-band access point can use its 2.4 GHz radio to support clients on legacy standards (802.11g/n), but it will not support Wi-Fi 5 on that 2.4 GHz band.\n\nIn Wi-Fi 5, downlink multi-user, multiple input, multiple output (DL MU-MIMO) allows the access point to use its multiple antennas to simultaneously send data to up to four clients.\n\nWi-Fi 5 allows up to eight streams, though most Wi-Fi 5 access points only support 4x4 streams in practice.\n\nWi-Fi 6 works in both the 2.4 GHz and 5 GHz bands. This is not a characteristic of Wi-Fi 5."
  },
  {
    "id": "cr57_08",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "Why are inverters typically not required in modern LED-backlit displays?",
    "options": [
      {
        "id": "opt_a",
        "text": "LED backlighting operates directly on DC power without needing conversion to AC",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Touchscreen capability replaces the function of the inverter in newer displays",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Modern displays use higher refresh rates that eliminate the need for power conversion",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Modern displays rely on larger power supplies that provide multiple voltage types for all components simultaneously",
        "isCorrect": false
      }
    ],
    "explanation": "LED backlighting operating directly on DC power without needing conversion to AC is the correct answer. LED backlights function using DC power, removing the need for an inverter.\n\nModern displays using higher refresh rates that eliminate the need for power conversion is incorrect. Refresh rate affects motion smoothness, not power conversion requirements.\n\nTouchscreen capability replacing the function of the inverter in newer displays is incorrect. Touch functionality is unrelated to power conversion for backlighting.\n\nModern displays relying on larger power supplies that provide multiple voltage types for all components simultaneously is incorrect. While power supplies vary, the absence of an inverter is due to LED technology, not power supply size or complexity."
  },
  {
    "id": "cr57_09",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "A sales person requires that a large number of document, data, presentation, image, and video files be accessible on their personal mobile device when making sales pitches to new customers. A cloud solution is not feasible since cellular and internet connections are not always guaranteed at a customer site.\nWhich of the following accessories would a technician suggest to BEST meet the sales person's requirements?",
    "options": [
      {
        "id": "opt_a",
        "text": "Docking station",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Micro SD card",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Credit card reader",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Wireless hotspot",
        "isCorrect": false
      }
    ],
    "explanation": "A micro SD card adds storage to a mobile device. Data files on the micro SD card will be available even without cellular and Wi-Fi connectivity. The card can be moved to other devices to update the files.\n\nA docking station might be beneficial if a storage device were attached. However, the docking station would be clumsy to work with and is not the BEST solution.\n\nA wireless hotspot would not be possible if there is no cellular connectivity.\n\nA credit card reader would be helpful for collecting payments when a sale is made, but a credit card reader does not store data files."
  },
  {
    "id": "cr57_10",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "A systems engineer is trying to identify suitable smartphone models to issue to field sales staff. The models must be able to use digital payments. What type of sensor must the devices have?",
    "options": [
      {
        "id": "opt_a",
        "text": "Bluetooth",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Indoor positioning system (IPS)",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Near-field communication system (NFC)",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "Radio-frequency identification system (RFID)",
        "isCorrect": false
      }
    ],
    "explanation": "Near-field communication (NFC) allows the user to touch the phone to a point-of-sale terminal to authorize payment in conjunction with a wallet app.\n\nA radio-frequency ID (RFID) identifies and tracks objects using specially encoded tags. The tags can be unpowered and passive, or powered and active, but not used in digital payments.\n\nAn indoor positioning system (IPS) shows a device's location by triangulating its proximity to other radio sources, such as a cellular radio tower's Wi-Fi access points, and does not involve digital payments.\n\nBluetooth connects peripheral devices to PCs and mobiles and shares data between two systems, such as radios, speakers, and wearable technology. It is not involved in digital payments."
  },
  {
    "id": "cr57_11",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "A support technician had to order an external USB device to allow a user to use CDs with a new laptop. What kind of device was missing from the new laptop to allow it to read CDs?",
    "options": [
      {
        "id": "opt_a",
        "text": "Hard drive",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Optical media drive",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Smart card drive",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Solid state drive",
        "isCorrect": false
      }
    ],
    "explanation": "CDs read by using an optical media drive. Optical media means that data gets written by making pits in a physical layer of media, such as CDs. Then, lasers read these pits.\n\nHard drives are internal and external data storage mediums similar to optical media; however, the disks are not removable in a hard drive.\n\nA solid-state hard drive stores data within a semiconductor chip and would not help the user read a CD.\n\nA smart card inserts into a smart card drive. Smart cards are typically for authenticating with an operating system."
  },
  {
    "id": "cr57_12",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "A user reports that she can't send print jobs to a specific printer. You are able to reproduce the problem on the user's computer.\nWhich of the following actions should you perform next?",
    "options": [
      {
        "id": "opt_a",
        "text": "Determine whether anything has changed.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "Determine if escalation is necessary.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Establish a plan of action.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Establish the most probable cause.",
        "isCorrect": false
      }
    ],
    "explanation": "According to the troubleshooting methodology, identifying the problem involves gathering information about recent changes to the system or environment. Changes, such as updates, configuration modifications, or hardware adjustments, are often the root cause of technical issues. By asking whether anything has changed, you can narrow down potential causes and proceed with testing a theory to resolve the issue.\n\nEstablishing a plan of action is a step that occurs later in the troubleshooting process, after identifying the problem and determining the probable cause. At this point in the scenario, the problem has been reproduced, but the root cause has not yet been identified. Before creating a plan of action, it is necessary to gather more information, such as determining if any changes have occurred that might explain the issue.\n\nEstablishing the most probable cause is an important step in the troubleshooting process, but it comes after gathering sufficient information about the problem. In this scenario, determining whether anything has changed is a prerequisite to identifying the probable cause. Without understanding the context of the issue, it would be premature to establish a probable cause.\n\nDetermining if escalation is necessary is a step taken when the problem cannot be resolved or requires additional expertise or resources. In this scenario, escalation is not yet relevant because the problem is still being investigated. The next step is to gather more information (e.g., whether anything has changed) to better understand the issue before considering escalation."
  },
  {
    "id": "cr57_13",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "What information would help diagnose an intermittent shutdown problem?",
    "options": [
      {
        "id": "opt_a",
        "text": "What the computers sounds like",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "User's contact information",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "The LED status lights",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Circumstance when shutdown occurs",
        "isCorrect": true
      }
    ],
    "explanation": "Intermittent shutdowns are difficult to pinpoint a specific cause, but with as many specifics as possible, it can narrow down the cause. For example, what the user is doing when the computer shuts down would be helpful information.\n\nThe user’s contact information is important to continue to respond to a ticket, but this will not directly help diagnose the problem.\n\nIf loud noises come from the computer, this can indicate a mechanical hard drive disk failure. However, a quiet computer makes it difficult to solve the problem.\n\nLED status lights can indicate if the machine is getting power, and some vendors have LED error codes. This does not help unless it is related to when the computer shuts down."
  },
  {
    "id": "cr57_14",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "As an IT technician for your company, you are in the process of setting up several servers in your network. During the process, one of the servers was misconfigured and is having trouble synchronizing information with the other servers.\nWhich of the following is the BEST next step?",
    "options": [
      {
        "id": "opt_a",
        "text": "Implement the fix.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Gather information.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Identify what has changed.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Create a hypothesis.",
        "isCorrect": false
      }
    ],
    "explanation": "According to the troubleshooting methodology, the first step in resolving any issue is to gather information to identify the problem. In this scenario, the server is misconfigured and having trouble synchronizing information, but the exact nature of the misconfiguration and its impact is not yet clear. Gathering information involves asking questions, reviewing logs, and understanding the symptoms of the issue. This step is critical to ensure that you have enough context to proceed with diagnosing and resolving the problem effectively.\n\nIdentifying what has changed is an important part of the troubleshooting process, but it typically comes after gathering initial information about the problem. Once you have a clear understanding of the issue, you can then investigate whether any recent changes (e.g., configuration updates, software installations, or network modifications) might have caused the problem. In this scenario, jumping directly to identifying changes without first gathering information could lead to overlooking key details about the issue.\n\nCreating a hypothesis (or establishing a theory of probable cause) is a step that occurs after gathering information and identifying potential changes or symptoms. Without sufficient information about the problem, it would be premature to create a hypothesis. The troubleshooting methodology emphasizes the importance of fully understanding the issue before attempting to determine its cause.\n\nImplementing the fix is a step that occurs much later in the troubleshooting process, after gathering information, identifying the problem, establishing a theory, and testing the theory to confirm the cause. In this scenario, implementing a fix without first understanding the problem could result in applying the wrong solution or causing additional issues. The methodology stresses the importance of a systematic approach to problem-solving."
  },
  {
    "id": "cr57_15",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "If a legacy IBM computer was experiencing some heating that affected the memory controller, what beep code would a computer technician hear?",
    "options": [
      {
        "id": "opt_a",
        "text": "One long, three short beeps",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Three long beeps",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "Continuous beep",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "One short beep",
        "isCorrect": false
      }
    ],
    "explanation": "A continuous beep indicates a problem with system memory modules or the memory controller. Replacing the memory modules or reseating them can help to resolve this issue.\n\nThree long beeps would indicate a keyboard issue. First, check that a key is not depressed. Then, tap on every key or re-insert the keyboard USB into the computer to resolve.\n\nOne long and three short beeps would indicate a video adapter error. Resolve this by updating the video drivers or checking internal connections.\n\nOne short beep indicates a normal power-on self-test (POST), meaning the system is OK. Computer technicians configure most modern PCs to boot silently, however."
  },
  {
    "id": "cr57_16",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "A network administrator is troubleshooting an issue where a client device cannot access a web server. The administrator uses a packet analyzer and observes that the client is sending packets to the server on port 80, but the server is not responding.\nWhich of the following is the MOST likely cause of the issue?",
    "options": [
      {
        "id": "opt_a",
        "text": "The Transport layer protocol being used is UDP instead of TCP.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "The client device has an incorrect IP address.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "The server's MAC address is not configured correctly.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The server is using a different port for HTTP communication.",
        "isCorrect": true
      }
    ],
    "explanation": "If the client is sending packets to port 80 (the default port for HTTP) but the server is not responding, it is possible that the server is configured to use a different port for HTTP communication. For example, the server might be using port 8080 instead of port 80.\n\nIf the client had an incorrect IP address, it would not be able to send packets to the server at all. The scenario specifies that packets are being sent to the server, so the IP address is not the issue.\n\nHTTP communication requires the use of TCP, not UDP. If UDP were being used, the client would not be able to establish a connection with the server in the first place. The issue described in the scenario is related to the port number, not the protocol.\n\nMAC addresses are used at the Link layer for local network communication. If there were an issue with the server's MAC address, the client would not be able to send packets to the server at all. The scenario specifies that packets are being sent, so the MAC address is not the problem."
  },
  {
    "id": "cr57_17",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "Which of the following is a benefit of good documentation?",
    "options": [
      {
        "id": "opt_a",
        "text": "It saves time and money in troubleshooting problems.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "It reduces hardware replacement requirements.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "It reduces hardware maintenance.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "It eliminates the need to troubleshoot problems.",
        "isCorrect": false
      }
    ],
    "explanation": "By keeping adequate documentation, you can reduce the time and money spent troubleshooting.\n\nWhile documentation can help reduce troubleshooting, it can never completely eliminate it.\n\nDocumentation helps you know when regular maintenance of hardware is required but does not eliminate maintenance.\n\nDocumentation helps you plan for hardware updates but does not reduce the requirements to replace the hardware."
  },
  {
    "id": "cr57_18",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "You are a security consultant tasked with assessing the vulnerabilities of a smart home system that includes various IoT devices such as smart cameras, smart locks, and a smart refrigerator.\nDuring your analysis, you discover that the system uses a hub/control system connected to the Wi-Fi network, while the IoT devices communicate using Zigbee protocol.\nWhat potential security risk should you prioritize addressing?",
    "options": [
      {
        "id": "opt_a",
        "text": "The risk of physical tampering with the smart devices themselves",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "The risk of unauthorized access to the Wi-Fi network through the hub/control system",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "The risk of insufficient data storage capacity for logs and device settings",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The risk of data interception due to the low-power nature of the Zigbee protocol",
        "isCorrect": false
      }
    ],
    "explanation": "Since the hub/control system is connected to the Wi-Fi network, it can be a potential entry point for unauthorized access. Securing the hub/control system is crucial to prevent unauthorized access to the entire IoT network.\n\nWhile Zigbee is a low-power protocol, it is designed with security features such as encryption. The primary concern should be the security of the hub/control system connected to the Wi-Fi network.\n\nPhysical tampering is a concern, but it is not as immediate or likely as the risk of unauthorized access through the network. Network security should be prioritized in this scenario.\n\nWhile data storage is important for maintaining logs and settings, it is not a direct security risk. The focus should be on preventing unauthorized network access."
  },
  {
    "id": "cr57_19",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "A computer repair specialist diagnoses an issue with a peripheral component interconnect (PCI) card for a user. The user has a much older computer but is replacing parts to improve the overall computer operations without paying the cost of a brand new computer. However, the specialist notices that the keying does not quite line up. What is the reason it is not working?",
    "options": [
      {
        "id": "opt_a",
        "text": "A 3.3V card was inserted in a 5V slot.",
        "isCorrect": true
      },
      {
        "id": "opt_b",
        "text": "A 5V card was inserted into a 12V slot.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "A 5V card was inserted in a 3.3V slot.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "The user plugged a 120V adapter into a 240V supply.",
        "isCorrect": false
      }
    ],
    "explanation": "To prevent a user from inserting an incompatible PCI card into a motherboard slot (for example, a 3.3V card in a 5V PCI slot), the keying for the three types of cards is different.\n\nThe earliest PCI cards were for 5V signaling. More recently, 3.3V and dual voltage PCI cards became more prevalent.\n\nThe power supply unit (PSU) supplies 12V power immediately, and the fans and hard disks should spin up. PCI cards are 5V and 3.3V.\n\nPower adapters for computers come in 110-120V and 220-240V. PCI cards come in 5V and 3.3V."
  },
  {
    "id": "cr57_20",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "Your organization uses a legacy system that is crucial for processing customer transactions.\nRecently, an audit revealed that this system poses significant security vulnerabilities. You need to analyze the situation and decide on a strategic approach to address these vulnerabilities while ensuring business continuity.\nWhich of the following actions would BEST balance security and operational needs?",
    "options": [
      {
        "id": "opt_a",
        "text": "Immediately shut down the legacy system to prevent any potential security breaches.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Conduct a risk assessment to identify specific vulnerabilities and develop a targeted mitigation plan.",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "Ignore the audit findings, as the system has been operating without issues for years.",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "Outsource the management of the legacy system to a third-party vendor specializing in legacy systems.",
        "isCorrect": false
      }
    ],
    "explanation": "Conducting a risk assessment allows you to analyze the specific vulnerabilities of the legacy system and develop a targeted mitigation plan. This approach balances security needs with operational requirements by addressing vulnerabilities without disrupting business continuity.\n\nShutting down the legacy system immediately could disrupt business operations and is not a balanced approach. While it addresses security concerns, it fails to consider the operational impact and continuity of customer transactions.\n\nIgnoring the audit findings is not a responsible approach. The security risks associated with legacy systems, and failing to address these vulnerabilities could lead to exploitation and potential breaches.\n\nWhile outsourcing might provide some expertise in managing legacy systems, it does not directly address the specific vulnerabilities identified in the audit. A targeted mitigation plan based on a risk assessment would be more effective in balancing security and operational needs."
  },
  {
    "id": "cr57_21",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "single",
    "requiredSelections": 1,
    "question": "Why is it important to establish and test a theory during the troubleshooting process?",
    "options": [
      {
        "id": "opt_a",
        "text": "To focus solely on the symptoms of the problem without considering possible causes.",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "To avoid consulting external resources or other technicians during the troubleshooting process.",
        "isCorrect": false
      },
      {
        "id": "opt_c",
        "text": "To systematically identify the probable cause of the problem and confirm it through testing.",
        "isCorrect": true
      },
      {
        "id": "opt_d",
        "text": "To immediately implement a solution without wasting time on unnecessary steps.",
        "isCorrect": false
      }
    ],
    "explanation": "Establishing and testing a theory is a systematic approach to diagnosing a problem. By identifying probable causes and confirming them through testing, technicians can efficiently determine the root cause and proceed with an appropriate solution.\n\nIt is important to diagnose the problem before implementing a solution. Skipping the step of establishing and testing a theory could lead to incorrect fixes and wasted effort.\n\nIt is also important to go beyond symptoms and identify the underlying causes of the problem. Focusing only on symptoms without testing theories would result in incomplete troubleshooting.\n\nThe troubleshooting process encourages using research techniques, consulting other technicians, and leveraging external resources when necessary. Collaboration and research are valuable tools for accurately diagnosing and resolving issues."
  },

  {
    "id": "cr57_23",
    "topic": "Checkpoint Review | Lessons 5-7",
    "type": "multiple",
    "requiredSelections": 2,
    "question": "A server administrator is joining a new startup business that will perform outsourced IT management for client firms. The administrator is to configure a web server to run on Linux, accept remote terminal connections from clients without using passwords, and encrypt terminal emulations. What can the administrator use to achieve this? (Select all that apply.)",
    "options": [
      {
        "id": "opt_a",
        "text": "Secure File Transfer Protocol (SFTP)",
        "isCorrect": false
      },
      {
        "id": "opt_b",
        "text": "Secure Shell (SSH)",
        "isCorrect": true
      },
      {
        "id": "opt_c",
        "text": "File Transfer Protocol (FTP)",
        "isCorrect": false
      },
      {
        "id": "opt_d",
        "text": "OpenSSH",
        "isCorrect": true
      }
    ],
    "explanation": "A Secure Shell (SSH) connection is the principal means of obtaining secure remote access to UNIX and Linux servers and to most types of network appliances (switches, routers, and firewalls).\n\nThe most widely used SSH is OpenSSH. Therefore, a common secure shell connection is considered OpenSSH.\n\nIncluding encrypted terminal emulations, SFTP can use SSH to achieve many other network configurations. However, it is not the principal means of obtaining a secure connection to another system.\n\nAn SSH server listens on port TCP/22 by default, which is the next port after FTP ports 20 & 21, used by the unsecure File Transfer Protocol (FTP). However, it is not the principal means of obtaining a secure connection."
  },
  {
    "id": "cr57_24",

    "type": "single",
    "requiredSelections": 1,
    "question": "A help desk analyst is replacing an internal hard drive on a desktop. A technician had previously removed the hard drive, so the analyst did not have a chance to map which cable should go where. Which cable will provide power in a modern SATA setup?",

    "explanation": "A separate 15-pin serial advanced technology attachment (SATA) power connector connects the device to the PC’s power supply.\n\nThe 7-pin data connector does not supply power. Instead, SATA uses cables of up to 1 m (39 in.) terminated with compact 7-pin connectors. Each SATA host adapter port supports a single device.\n\nWhile the SATA power connector is the best option for new devices, legacy components connect to the power supply unit (PSU) via a Molex connector.\n\nUsers need an external SATA (eSATA) cable to connect to an eSATA port. Users cannot use an internal SATA cable."
  },
{

    "question": "A technician researches flat-screen displays to find the perfect model for a conference room. The screen should feature a high viewing angle as the conference room is wide. Which technology does the technician look for when purchasing a flat-screen display?",

    "explanation": "In-plane switching (IPS) uses crystals that rotate rather than twist. The main benefit is to deliver better color reproduction at a wider range of viewing angles. Most IPS panels support 178/178 degree horizontal and vertical viewing angles.\n\nVertical alignment (VA) uses crystals that tilt rather than twist or rotate. This technology supports a wide color gamut and the best contrast-ratio performance.\n\nAn array of light-emitting diodes (LEDs) can provide illumination in a flat panel. Most smartphone and tablet screens use edge lighting where the LEDs are at the top or bottom of the screen.\n\nA separate LED generates each pixel in an organic LED (OLED) display, or technically, an advanced matrix OLED (AMOLED) display."
  },
  {

    "requiredSelections": 1,
    "question": "A marketing manager needs to connect a laptop to a large wall-mounted LED TV in an auditorium to make a presentation that includes high-resolution video and audio.\nWhich of the following cable types would work BEST for connecting the laptop to the display?",
